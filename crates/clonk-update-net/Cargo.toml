[package]
name = "clonk-update-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true

[dependencies]
clonk-update = { path = "../clonk-update" }
# Requested exactly as `clonk-network` requests it minus the features only the
# league client needs, so Cargo's feature unification adds no crate to the
# workspace graph that a networked build did not already compile.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
thiserror = "2"
tokio = { version = "1", features = ["net", "rt", "time"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3.10"
tokio = { version = "1", features = ["macros"] }
