[package]
name = "clonk-launcher-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0"
# Text-only clipboard use; default "image-data" feature would pull a second
# image crate (0.25) plus moxcms/pxfm/tiff into every workspace build.
arboard = { version = "3.3", default-features = false }
clonk-launcher = { path = "../clonk-launcher" }
clonk-launcher-ui = { path = "../clonk-launcher-ui" }
clonk-gui = { path = "../clonk-gui" }
clonk-graphics = { path = "../clonk-graphics" }
clonk-icon = { path = "../clonk-icon" }
clonk-platform = { path = "../clonk-platform" }
clonk-logging = { path = "../clonk-logging" }
pixels = "0.17"
rfd = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
winit = "0.30"
tracing = "0.1"

[dev-dependencies]
tempfile = "3.10"
