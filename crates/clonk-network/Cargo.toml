[package]
name = "clonk-network"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true
autotests = false

[dependencies]
flate2 = "1"
iconv-native = "0.1"
clonk-core = { path = "../clonk-core" }
clonk-engine = { path = "../clonk-engine" }
clonk-resources = { path = "../clonk-resources" }
serde = { version = "1", features = ["derive"] }
sha1 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["cookies", "gzip", "rustls-tls"] }
socket2 = { version = "0.6", features = ["all"] }
xml-rs = "0.8"
[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", features = ["use_std"] }

[dev-dependencies]
# Pin workspace-wide transitive features so focused network tests remain
# binary-compatible with artifacts produced by the full landing gate.
bitflags = { version = "2", features = ["std"] }
# Keep focused network tests aligned with clonk-app and the engine test leaves so
# their optimized engine artifact is reusable by the full workspace gate.
clonk-engine = { path = "../clonk-engine", features = ["test-graph"] }
log = { version = "0.4", features = ["std"] }
serde_json = "1"
tokio = { version = "1", features = ["test-util"] }
tracing-core = "0.1"

[[test]]
name = "integration"
path = "tests/main.rs"
