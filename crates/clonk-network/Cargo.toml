[package]
name = "clonk-network"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true
autotests = false

[dependencies]
flate2 = "1"
iconv-native = "0.1"
clonk-core = { path = "../clonk-core" }
clonk-engine = { path = "../clonk-engine" }
clonk-resources = { path = "../clonk-resources" }
serde = { version = "1", features = ["derive"] }
sha1 = { version = "0.11", default-features = false }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["cookies", "gzip", "rustls-no-provider"] }
# The voice media lane's key agreement, HKDF and AEAD. Declared exactly as
# rustls declares it so the already-compiled graph is reused unchanged.
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
socket2 = { version = "0.6", features = ["all"] }
webpki-root-certs = "1"
xml = "1"
# Already in the graph as a rustls dependency at this version, so a direct edge
# adds no crate to the build or the supply chain -- only the ability to name
# the trait that erases a dropped media key (clonk-org/clonk-rs#470).
zeroize = { version = "1", default-features = false }
[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", features = ["use_std"] }

[dev-dependencies]
# Pin workspace-wide transitive features so focused network tests remain
# binary-compatible with artifacts produced by the full landing gate.
bitflags = { version = "2", features = ["std"] }
# Keep focused network tests aligned with clonk-app and the engine test leaves so
# their optimized engine artifact is reusable by the full workspace gate.
clonk-engine = { path = "../clonk-engine", features = ["test-graph"] }
log = { version = "0.4", features = ["std"] }
serde_json = "1"
tokio = { version = "1", features = ["test-util"] }
tracing-core = "0.1"

# `GetAdaptersAddresses` backs the IPv6 multicast fallback's interface
# enumeration on Windows; the unix arm uses `if_nameindex` from libc.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    # `GetAdaptersAddresses` and `IP_ADAPTER_ADDRESSES_LH` are both gated on
    # Ndis *and* WinSock, not on IpHelper alone.
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }

[[test]]
name = "integration"
path = "tests/main.rs"
