[package]
name = "clonk-app-menus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true

[features]
# Exposes the object-menu parity-test mutator that clonk-app's test suite
# drives. The app's dev-dependencies enable it so the app test graph sees the
# same hook surface `#[cfg(test)]` provided before the split; production
# builds never request it.
test-hooks = []

[dependencies]
clonk-app-core = { path = "../clonk-app-core" }
clonk-engine = { path = "../clonk-engine" }
clonk-frontend = { path = "../clonk-frontend" }
clonk-graphics = { path = "../clonk-graphics" }
clonk-gui = { path = "../clonk-gui" }
clonk-resources = { path = "../clonk-resources" }
clonk-script = { path = "../clonk-script" }
tracing = "0.1"

[dev-dependencies]
# Keep clonk-engine's property-test dependencies in this test graph so focused
# menu-crate runs share one clonk-engine fingerprint with the workspace gate.
clonk-engine = { path = "../clonk-engine", features = ["test-graph"] }
# Match clonk-app's plain serde_json request so both test graphs resolve one
# serde_json fingerprint.
serde_json = "1.0"
