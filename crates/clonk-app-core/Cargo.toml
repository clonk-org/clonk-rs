[package]
name = "clonk-app-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true

[features]
# Fixture utilities for the extracted app crates' tests. Only dev-dependencies
# enable it, so nothing here reaches a production build
# (clonk-org/clonk-rs#1260).
test-support = []

[dependencies]
clonk-core = { path = "../clonk-core" }
clonk-engine = { path = "../clonk-engine" }
clonk-frontend = { path = "../clonk-frontend" }
clonk-graphics = { path = "../clonk-graphics" }
clonk-gui = { path = "../clonk-gui" }

[dev-dependencies]
# Keep clonk-engine's property-test dependencies in this test graph so focused
# core-crate runs share one clonk-engine fingerprint with the workspace gate.
clonk-engine = { path = "../clonk-engine", features = ["test-graph"] }
