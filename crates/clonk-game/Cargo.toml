[package]
name = "clonk-game"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
clonk-launcher = { path = "../clonk-launcher" }
clonk-logging = { path = "../clonk-logging" }
clonk-platform = { path = "../clonk-platform" }
clonk-update = { path = "../clonk-update" }
clonk-core = { path = "../clonk-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"

[build-dependencies]
# Embeds the Windows executable icon resource. The `build-script` feature stays
# out of the normal graph, so the shipped binary does not carry the `.ico` bytes.
clonk-icon = { path = "../clonk-icon", features = ["build-script"] }

[dev-dependencies]
tempfile = "3"
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Registry"] }
