[package]
name = "clonk-app-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true

[features]
default = []
bench = ["dep:criterion", "clonk-frontend/bench"]

[dependencies]
clonk-engine = { path = "../clonk-engine" }
clonk-frontend = { path = "../clonk-frontend" }
clonk-graphics = { path = "../clonk-graphics" }
thiserror = "2"
tracing = "0.1"
wgpu = "29"
# Benchmark-only: keep Criterion out of the application and workspace test
# graph while retaining an executable end-to-end GPU submission benchmark.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"], optional = true }

[dev-dependencies]
# Keep clonk-engine's property-test dependencies in this test graph so focused
# render-crate runs share one clonk-engine fingerprint with the workspace gate.
clonk-engine = { path = "../clonk-engine", features = ["test-graph"] }
clonk-gui = { path = "../clonk-gui" }
# The renderer tests only need a current-thread runtime (`rt`), but request the
# workspace test graph's full Tokio feature union so focused render-crate runs
# share one Tokio fingerprint with the app and workspace gates.
tokio = { version = "1.32", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time", "test-util"] }

[[bench]]
name = "particle_render"
harness = false
required-features = ["bench"]

[[bench]]
name = "object_sprite_render"
harness = false
required-features = ["bench"]

[[bench]]
name = "landscape_render"
harness = false
required-features = ["bench"]

[[bench]]
name = "pxs_render"
harness = false
required-features = ["bench"]
