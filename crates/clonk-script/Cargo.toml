[package]
name = "clonk-script"
version = "0.1.0"
edition = "2021"

[features]
default = []
bench = ["dep:criterion"]

[dependencies]
thiserror = "1"
serde = { version = "1.0", features = ["derive"] }
indexmap = { version = "2", features = ["serde"] }
smallvec = { version = "1", features = ["const_generics"] }
# Grows the native stack on demand so deep (but C++-legal, <=512) script
# recursion doesn't overflow the thread stack in this tree-walking interpreter.
stacker = "0.1"
# Benchmark-only: ordinary test roots must not pull Criterion/Ciborium into
# the workspace-wide Serde feature union.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"], optional = true }

[dev-dependencies]
serde_json = "1"

[[bench]]
name = "script_execution"
harness = false
required-features = ["bench"]
