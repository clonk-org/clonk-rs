[package]
name = "clonk-script"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true

[features]
default = []
bench = ["dep:criterion"]

[dependencies]
thiserror = "1"
serde = { version = "1.0", features = ["derive"] }
indexmap = { version = "2", features = ["serde"] }
# Fixed-seed hashing for the VM's name-keyed lookup tables. `RandomState`
# reseeds per process, so nothing may read their iteration order today; a
# seedless hasher is strictly more reproducible and skips SipHash per probe.
rustc-hash = "2"
smallvec = { version = "1", features = ["const_generics"] }
tracing = "0.1"
# Grows the native stack on demand so deep (but C++-legal, <=512) script
# recursion doesn't overflow the thread stack in this tree-walking interpreter.
stacker = "0.1"
# Benchmark-only: ordinary test roots must not pull Criterion/Ciborium into
# the workspace-wide Serde feature union.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"], optional = true }

[dev-dependencies]
serde_json = "1"

[[bench]]
name = "script_execution"
harness = false
required-features = ["bench"]
