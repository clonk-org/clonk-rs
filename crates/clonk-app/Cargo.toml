[package]
name = "clonk-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true

[features]
default = []
app-test-shard-mode = []
app-test-shard-1 = ["app-test-shard-mode"]
app-test-shard-2 = ["app-test-shard-mode"]
app-test-shard-3 = ["app-test-shard-mode"]
app-test-shard-4 = ["app-test-shard-mode"]
app-test-shard-5 = ["app-test-shard-mode"]
app-test-shard-6 = ["app-test-shard-mode"]
app-test-shard-7 = ["app-test-shard-mode"]
app-test-shard-8 = ["app-test-shard-mode"]
app-test-shard-9 = ["app-test-shard-mode"]
app-test-shard-10 = ["app-test-shard-mode"]
app-test-shard-11 = ["app-test-shard-mode"]
app-test-shard-12 = ["app-test-shard-mode"]

[dependencies]
anyhow = "1.0"
arboard = { version = "3.3", default-features = false }
# Global allocator for the shipped binary; see the `global_allocator` comment in
# main.rs. Default features off keeps the secure/debug modes out of the build.
mimalloc = { version = "0.1", default-features = false }
gilrs = "0.10"
clonk-app-core = { path = "../clonk-app-core" }
clonk-app-menus = { path = "../clonk-app-menus" }
clonk-app-netplay = { path = "../clonk-app-netplay" }
clonk-app-render = { path = "../clonk-app-render" }
clonk-audio = { path = "../clonk-audio" }
clonk-core = { path = "../clonk-core" }
clonk-engine = { path = "../clonk-engine" }
clonk-frontend = { path = "../clonk-frontend" }
clonk-gui = { path = "../clonk-gui" }
clonk-graphics = { path = "../clonk-graphics" }
clonk-icon = { path = "../clonk-icon" }
clonk-logging = { path = "../clonk-logging" }
clonk-scaling = { path = "../clonk-scaling" }
clonk-network = { path = "../clonk-network" }
clonk-platform = { path = "../clonk-platform" }
clonk-resources = { path = "../clonk-resources" }
clonk-script = { path = "../clonk-script" }
clonk-update = { path = "../clonk-update" }
clonk-update-net = { path = "../clonk-update-net" }
pixels = "0.17"
rfd = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
strsim = "0.11"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.32", features = ["rt-multi-thread", "sync", "time", "net"] }
raw-window-handle = "0.6"
winit = "0.30"
tracing = "0.1"
parking_lot = "0.12"
png = "0.17"
image = { version = "0.24", default-features = false, features = ["bmp", "jpeg", "png"] }
time = { version = "0.3", features = ["formatting", "macros"] }
freetype-rs = { version = "0.38.0", features = ["bundled"] }
ttf-parser = "0.25.1"
thiserror = "1"
gethostname = "1.0"
tempfile = "3.8"
unicode-normalization = "0.1"

[build-dependencies]
# Embeds the Windows executable icon resources. The `build-script` feature stays
# out of the normal graph, so the shipped binary does not carry the `.ico` bytes.
clonk-icon = { path = "../clonk-icon", features = ["build-script"] }

[target.'cfg(target_os = "macos")'.dependencies]
# `MainThreadMarker` lives in `objc2` itself; the `objc2-foundation` re-export is
# deprecated, and a deprecation warning fails the `-D warnings` lint gate.
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSString", "NSProcessInfo", "NSUserDefaults"] }
# Already resolved in the lock via `arboard`, so this pulls in nothing new. Only
# AppKit can give an unbundled binary a Dock icon — see `dock_icon.rs`.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "4.4", default-features = false, features = ["async-io"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Data_Xml_Dom", "Foundation", "UI_Notifications", "Win32_Foundation", "Win32_Globalization", "Win32_System_Console", "Win32_System_Registry", "Win32_System_WinRT", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_TextServices"] }

[dev-dependencies]
# The app test suite drives NetworkManager and the object-menu parity mutator
# through the netplay/menus crates' test stubs; the features stand in for the
# `#[cfg(test)]` gates that covered them before the crate splits and stay out
# of production builds.
clonk-app-menus = { path = "../clonk-app-menus", features = ["test-hooks"] }
clonk-app-netplay = { path = "../clonk-app-netplay", features = ["test-hooks"] }
flate2 = "1"
# Keep clonk-engine's property-test dependencies in the app test graph so adding
# clonk-engine or the full workspace does not rebuild shared transitive crates.
clonk-engine = { path = "../clonk-engine", features = ["test-graph"] }
# Every comparison target includes clonk-app. Request clonk-network's test-only
# Tokio feature here as well so app-only and workspace test graphs share one
# Tokio fingerprint without enabling test utilities in production builds.
tokio = { version = "1.32", features = ["test-util"] }
# The message-board log tests write through clonk-logging's MakeWriter sinks.
# Request the same features clonk-logging already builds so the test graph
# reuses one tracing-subscriber fingerprint.
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
