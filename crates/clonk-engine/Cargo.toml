[package]
name = "clonk-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true
autotests = false

# The inline unit and integration surfaces are compiled from their original
# source paths by dedicated test-only leaf packages. Building them here as well
# would repeat level-3 test-wrapper codegen on every complete workspace gate.
[lib]
test = false

[features]
default = []
bench = ["dep:criterion"]
test-graph = ["dep:proptest"]
# Process-global presentation RNG tracing used only by the audited capture
# executable. Ordinary engine and shipped app builds keep this surface absent.
presentation-capture = []
# The C ABI the pinned oracle's USE_RUST_ENGINE_VALIDATION bridge links against
# (clonk-org/clonk-rs#585). Off by default: it is a diagnostic surface, not part
# of the shipped engine. It also carries the config, group-validation and
# platform-path bridge surfaces (clonk-org/clonk-rs#1264, #1265, #1267): the
# oracle links every bridge it enables into one executable, and two Rust
# static archives in one image duplicate the standard library, so there is
# one archive and `cargo xtask ffi` copies it to every name CMake imports.
ffi = [
    "dep:tracing-subscriber",
    "clonk-core/ffi",
    "clonk-resources/ffi",
    "dep:clonk-platform",
    "clonk-platform/ffi",
]

[dependencies]
clonk-core = { path = "../clonk-core" }
clonk-engine-core = { path = "../clonk-engine-core" }
clonk-protocol = { path = "../clonk-protocol" }
clonk-script = { path = "../clonk-script" }
clonk-resources = { path = "../clonk-resources" }
clonk-platform = { path = "../clonk-platform", optional = true }
# Fixed-seed hashing for the per-frame lookup tables. `RandomState` reseeds per
# process, so nothing in the simulation may read HashMap iteration order today;
# a seedless hasher is strictly more reproducible and skips SipHash per probe.
rustc-hash = "2"
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["bmp", "jpeg", "png"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tracing = "0.1"
# Identical feature set to the dev-dependency below, so enabling the FFI
# surface cannot split the tracing-subscriber fingerprint across graphs.
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"], optional = true }
# Benchmark-only: keeping Criterion optional prevents `cargo test -p clonk-engine`
# from changing the shared Serde feature graph for every downstream crate.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"], optional = true }
# Exposed only so clonk-app's dev graph can pre-unify the features used by the
# engine property tests. The extracted engine_inline target mirrors the
# non-optional test dependency in clonk-engine-unit-tests.
proptest = { version = "1", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
clonk-test-support = { path = "../clonk-test-support" }
once_cell = "1"
proptest = { version = "1", default-features = false, features = ["std"] }
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }

[[bench]]
name = "engine_tick"
harness = false
required-features = ["bench"]
