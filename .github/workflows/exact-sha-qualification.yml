name: Exact-SHA qualification

on:
  workflow_call:
    inputs:
      source-sha:
        description: The exact commit to qualify
        required: true
        type: string
      concurrency-suffix:
        description: An exact-SHA or rolling concurrency lane
        required: true
        type: string
      publish-recording-host-cache:
        description: Whether this trusted ref may publish the macOS cache
        required: true
        type: boolean
      upload-diagnostics:
        description: Whether to retain post-merge coverage and developer-feedback reports
        required: true
        type: boolean

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always

jobs:
  coverage-fragments:
    name: Rust coverage / ${{ matrix.name }}
    runs-on: ubuntu-24.04
    # The twelve rows use their measured budgets rather than one number sized
    # for the shortest row. The presentation capture cases share one booted
    # application fixture, so `app 5/12` remains within the common 15-minute
    # qualification budget instead of paying for 51 redundant application
    # boots. `landing.yml` carries the same per-entry timeout contract.
    timeout-minutes: ${{ matrix.timeout || 15 }}
    concurrency:
      group: "main-coverage-${{ matrix.artifact }}-${{ inputs.concurrency-suffix }}"
      cancel-in-progress: true
    env:
      CARGO_TARGET_DIR: target/coverage-build
      COVERAGE_IGNORE_REGEX: '/(main_tests|lib_tests)/|/(parity_differential|test_game_call_ex|test_support)\.rs$'
      LLVM_PROFILE_FILE_NAME: 'clonk-%8m.profraw'
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app 1+10/12
            timeout: 15
            artifact: app-1-10
            apt: libasound2-dev libudev-dev
            command: cargo llvm-cov --no-report nextest -p clonk-app --features app-test-shard-1,app-test-shard-10 --no-fail-fast --locked
          - name: app 2+7/12
            timeout: 15
            artifact: app-2-7
            apt: libasound2-dev libudev-dev
            command: cargo llvm-cov --no-report nextest -p clonk-app --features app-test-shard-2,app-test-shard-7 --no-fail-fast --locked
          - name: app 3/12
            timeout: 15
            artifact: app-3
            apt: libasound2-dev libudev-dev
            command: cargo llvm-cov --no-report nextest -p clonk-app --features app-test-shard-3 --no-fail-fast --locked
          - name: app 4+9/12
            timeout: 15
            artifact: app-4-9
            apt: libasound2-dev libudev-dev
            command: cargo llvm-cov --no-report nextest -p clonk-app --features app-test-shard-4,app-test-shard-9 --no-fail-fast --locked
          - name: app 5/12
            timeout: 15
            artifact: app-5
            apt: libasound2-dev libudev-dev
            command: cargo llvm-cov --no-report nextest -p clonk-app --features app-test-shard-5 --no-fail-fast --locked
          - name: app 11+12/12
            timeout: 15
            artifact: app-11-12
            apt: libasound2-dev libudev-dev
            command: cargo llvm-cov --no-report nextest -p clonk-app --features app-test-shard-11,app-test-shard-12 --no-fail-fast --locked
          - name: app 6+8/12
            timeout: 15
            artifact: app-6-8
            apt: libasound2-dev libudev-dev
            command: cargo llvm-cov --no-report nextest -p clonk-app --features app-test-shard-6,app-test-shard-8 --no-fail-fast --locked
          - name: engine integration 1/3
            timeout: 15
            artifact: engine-1
            apt: ''
            command: cargo llvm-cov --no-report nextest -p clonk-engine-integration-tests --test engine_it --features engine-it-shard-1 --no-fail-fast --locked
          - name: engine integration 2+3/3
            timeout: 15
            artifact: engine-2-3
            apt: ''
            command: cargo llvm-cov --no-report nextest -p clonk-engine-integration-tests --test engine_it --features engine-it-shard-2,engine-it-shard-3 --no-fail-fast --locked
          - name: engine and frontend units
            timeout: 15
            artifact: engine-and-frontend-units
            apt: ''
            command: cargo llvm-cov --no-report nextest -p clonk-engine-unit-tests -p clonk-frontend-unit-tests --no-fail-fast --locked
          - name: remaining workspace 1/2
            timeout: 15
            artifact: remaining-1
            apt: mesa-vulkan-drivers
            command: cargo llvm-cov --no-report nextest -p clonk-app-core -p clonk-app-netplay -p clonk-app-render -p clonk-frontend -p clonk-launcher-shell -p clonk-launcher-ui -p clonk-surface --no-fail-fast --locked
          - name: remaining workspace 2/2
            timeout: 15
            artifact: remaining-2
            apt: libasound2-dev libxmp4
            command: cargo llvm-cov --no-report nextest -p clonk-app-menus -p clonk-audio -p clonk-c4group -p clonk-core -p clonk-engine -p clonk-engine-core -p clonk-game -p clonk-graphics -p clonk-gui -p clonk-icon -p clonk-launcher -p clonk-logging -p clonk-network -p clonk-platform -p clonk-resources -p clonk-scaling -p clonk-script -p clonk-update -p clonk-update-net -p xtask --features xtask/engine-tools --no-fail-fast --locked
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false

      # Create the shard identity before setup or compilation. The diagnostic
      # upload below runs even when coverage collection fails, so a failed
      # release qualification still exposes the exact source and shard.
      - name: Prepare shard diagnostics
        env:
          DIAGNOSTIC_DIR: ${{ runner.temp }}/test-diagnostics
          MATRIX_NAME: ${{ matrix.name }}
          SHARD_ID: ${{ matrix.artifact }}
          SHARD_COMMAND: ${{ matrix.command }}
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path

          diagnostic_dir = Path(os.environ["DIAGNOSTIC_DIR"])
          if diagnostic_dir.exists():
              shutil.rmtree(diagnostic_dir)
          diagnostic_dir.mkdir(parents=True)
          metadata = {
              "schema_version": 1,
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "shard": os.environ["SHARD_ID"],
              "name": os.environ["MATRIX_NAME"],
              "source_sha": os.environ["SOURCE_SHA"],
              "command": os.environ["SHARD_COMMAND"],
              "nextest_profile": "default",
              "junit": "target/nextest/default/junit.xml",
              "retained_junit": "junit/*.xml",
          }
          path = diagnostic_dir / "metadata.json"
          path.write_text(json.dumps(metadata, indent=2, sort_keys=True) + "\n")
          PY

      # `submodules: recursive` fetched content unbounded inside checkout, so a
      # stalled transfer spent the whole 15-minute budget there and took the row
      # down before a single test ran. The fetch is the same shallow, blobless
      # one `landing.yml` uses; what is new is that each attempt is bounded and
      # retried, so a transient stall costs minutes instead of the budget.
      #
      # This workflow may not cache (`scripts/tests/test_workflow_runtime_inventory.py`
      # and `test_rust_ci_coverage.py` both assert no `actions/cache/*` here), and
      # content is a gigabyte, so neither a shared cache nor a run-scoped artifact
      # handoff is available to collapse the per-row fetch.
      - name: Resolve pinned content revision
        id: content
        run: |
          revision=$(git rev-parse HEAD:content)
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid content gitlink: $revision" >&2
            exit 1
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Materialize pinned content checkout
        timeout-minutes: 9
        run: |
          # Bound each attempt rather than the job: an unbounded fetch that
          # stalls is indistinguishable from a slow one until the runner
          # cancels the row, and by then the whole budget is gone.
          #
          # The first attempt gets five minutes because no cold blobless fetch
          # time is recorded anywhere -- a healthy one has to fit inside the
          # 15-minute row alongside an instrumented compile and its tests, so
          # five is already far more than it can be using. The retry gets three:
          # it resumes from whatever the first attempt fetched, and a second
          # stall is a provider problem rather than a slow transfer. Eight
          # minutes worst case still leaves the row more time than the 14m53s
          # stall left it, which was none.
          for attempt in 1 2; do
            case "$attempt" in
              1) budget=300 ;;
              *) budget=180 ;;
            esac
            started=$SECONDS
            status=0
            python3 scripts/run_with_timeout.py "$budget" git submodule update --init --force --depth=1 \
              --filter=blob:none content || status=$?
            elapsed=$((SECONDS - started))
            if (( status == 0 )); then
              size=$(du -sk .git/modules/content | cut -f1)
              echo "content-checkout attempt=$attempt seconds=$elapsed size-kib=$size"
              exit 0
            fi
            # `run_with_timeout.py` reports 124 for the stall this exists to bound; any
            # other status is the fetch itself failing, and reporting one as
            # the other sends the next reader looking at the wrong thing. The
            # size on the success line is what separates a provider stall from
            # a repository that simply grew.
            if (( status == 124 )); then
              reason=stalled
            else
              reason=failed-status-$status
            fi
            echo "content-checkout attempt=$attempt $reason after=${elapsed}s" >&2
          done
          echo "::error::pinned content checkout did not complete in two bounded attempts" >&2
          exit 1

      - name: Verify pinned content checkout
        env:
          CONTENT_REVISION: ${{ steps.content.outputs.revision }}
        run: |
          actual=$(git -C content rev-parse HEAD)
          [[ "$actual" == "$CONTENT_REVISION" ]]
          [[ -z "$(git -C content status --porcelain --untracked-files=all)" ]]

      - name: Install native Rust dependencies
        if: matrix.apt != ''
        env:
          APT_PACKAGES: ${{ matrix.apt }}
        timeout-minutes: 10
        run: |
          read -r -a packages <<< "$APT_PACKAGES"
          scripts/install-apt-packages.sh "${packages[@]}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
        with:
          components: llvm-tools-preview

      - name: Install cargo-nextest
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-nextest@0.9.91
          fallback: none

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-llvm-cov@0.8.7
          fallback: none

      # Instrumented targets are large and incompatible across collector
      # feature sets. Reuse only Cargo downloads; one trusted-main row refreshes
      # the shared registry cache after all rows restore the same snapshot.
      - name: Restore Cargo registry cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-targets: false
          shared-key: coverage-registry
          save-if: ${{ inputs.upload-diagnostics && matrix.artifact == 'app-1-10' }}

      - name: Reset stale JUnit report
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path

          Path("target/nextest/default/junit.xml").unlink(missing_ok=True)
          PY

      - name: Collect instrumented coverage fragment
        env:
          SHARD_COMMAND: ${{ matrix.command }}
          DIAGNOSTIC_DIR: ${{ runner.temp }}/test-diagnostics
          LC_CAPTURE_VIRTUAL_PLAYER: '1'
          LC_TEST_ARTIFACT_DIR: ${{ runner.temp }}/test-diagnostics/replays
        run: |
          export LC_REAL_CARGO="$(command -v cargo)"
          export LC_NEXTEST_JUNIT_DIR="$DIAGNOSTIC_DIR/junit"
          cargo() {
            local status=0
            rm -f "${LC_NEXTEST_JUNIT_SOURCE:-target/nextest/default/junit.xml}"
            "$LC_REAL_CARGO" "$@" || status=$?
            bash scripts/retain-nextest-junit.sh || true
            return "$status"
          }
          export -f cargo
          cargo llvm-cov clean --workspace
          bash -euo pipefail -c "$SHARD_COMMAND"
          mkdir -p target/coverage-fragments
          cargo llvm-cov report --lcov \
            --output-path "target/coverage-fragments/${{ matrix.artifact }}.lcov" \
            --ignore-filename-regex "$COVERAGE_IGNORE_REGEX"
          gzip --best "target/coverage-fragments/${{ matrix.artifact }}.lcov"

      # Coverage fragments remain a success-only handoff. Diagnostics have a
      # separate always-run upload so a failed test keeps its JUnit output and
      # bounded virtual-player trace while the qualification job stays failed.
      - name: Upload shard test diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-test-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.artifact }}-${{ inputs.source-sha }}
          path: |
            ${{ runner.temp }}/test-diagnostics
            target/nextest/default/junit.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Upload coverage fragment
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-coverage-fragment-${{ github.run_id }}-${{ matrix.artifact }}
          path: target/coverage-fragments/${{ matrix.artifact }}.lcov.gz
          if-no-files-found: error
          overwrite: true
          retention-days: ${{ inputs.upload-diagnostics && 1 || 7 }}

  coverage:
    name: Rust code coverage
    needs: coverage-fragments
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: "main-coverage-report-${{ inputs.concurrency-suffix }}"
      cancel-in-progress: true
    env:
      # The prior LLVM JSON gate was 79%. LCOV detail omits unmergeable macro
      # expansion totals and reads 0.45 points higher on the baseline report.
      COVERAGE_MIN_LINE_PERCENT: '79.45'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false

      - name: Download coverage fragments
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rust-coverage-fragment-${{ github.run_id }}-*
          path: target/coverage-fragments
          merge-multiple: true

      - name: Enforce merged line coverage floor
        env:
          EXPECTED_FRAGMENT_COUNT: '12'
        run: |
          expected=(
            app-1-10
            app-2-7
            app-3
            app-4-9
            app-5
            app-11-12
            app-6-8
            engine-1
            engine-2-3
            engine-and-frontend-units
            remaining-1
            remaining-2
          )
          shopt -s nullglob
          fragments=(target/coverage-fragments/*.lcov.gz)
          if [[ "${#fragments[@]}" -ne "$EXPECTED_FRAGMENT_COUNT" ]]; then
            echo "expected ${EXPECTED_FRAGMENT_COUNT} coverage fragments, found ${#fragments[@]}" >&2
            exit 1
          fi
          expected_names=$(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          actual_names=$(printf '%s\n' "${fragments[@]##*/}" | sed 's/\.lcov\.gz$//' | LC_ALL=C sort)
          if [[ "$actual_names" != "$expected_names" ]]; then
            diff -u <(printf '%s\n' "$expected_names") <(printf '%s\n' "$actual_names") || true
            exit 1
          fi
          gzip --decompress --keep target/coverage-fragments/*.lcov.gz
          python3 scripts/merge-rust-coverage.py \
            --fail-under-lines "$COVERAGE_MIN_LINE_PERCENT" \
            target/coverage-fragments/*.lcov

  # HTML is useful post-merge diagnostics, not part of the coverage gate. It
  # independently merges the fragments so rendering and artifact retention
  # cannot extend or fail the required release-qualification critical path.
  coverage-html:
    name: Rust coverage HTML report
    needs: coverage-fragments
    if: inputs.upload-diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: "main-coverage-html-${{ inputs.concurrency-suffix }}"
      cancel-in-progress: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false

      - name: Download Rust coverage fragments
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rust-coverage-fragment-${{ github.run_id }}-*
          path: target/coverage-fragments
          merge-multiple: true

      - name: Merge Rust coverage fragments
        env:
          EXPECTED_FRAGMENT_COUNT: '12'
        run: |
          expected=(
            app-1-10
            app-2-7
            app-3
            app-4-9
            app-5
            app-11-12
            app-6-8
            engine-1
            engine-2-3
            engine-and-frontend-units
            remaining-1
            remaining-2
          )
          shopt -s nullglob
          fragments=(target/coverage-fragments/*.lcov.gz)
          if [[ "${#fragments[@]}" -ne "$EXPECTED_FRAGMENT_COUNT" ]]; then
            echo "expected ${EXPECTED_FRAGMENT_COUNT} coverage fragments, found ${#fragments[@]}" >&2
            exit 1
          fi
          expected_names=$(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          actual_names=$(printf '%s\n' "${fragments[@]##*/}" | sed 's/\.lcov\.gz$//' | LC_ALL=C sort)
          if [[ "$actual_names" != "$expected_names" ]]; then
            diff -u <(printf '%s\n' "$expected_names") <(printf '%s\n' "$actual_names") || true
            exit 1
          fi
          gzip --decompress --keep target/coverage-fragments/*.lcov.gz
          python3 scripts/merge-rust-coverage.py \
            --output target/coverage/lcov.info \
            target/coverage-fragments/*.lcov

      - name: Install LCOV report generator
        run: |
          if ! sudo apt-get install --yes --no-install-recommends lcov; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends lcov
          fi

      - name: Generate Rust coverage report
        run: |
          genhtml target/coverage/lcov.info \
            --output-directory target/coverage/html \
            --legend \
            --title "clonk-rs ${{ inputs.source-sha }}"

      - name: Upload Rust coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/coverage/lcov.info
            target/coverage/html
          if-no-files-found: warn
          retention-days: 14

  developer-feedback:
    name: Developer feedback replay
    if: inputs.upload-diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: "main-developer-feedback-${{ inputs.concurrency-suffix }}"
      cancel-in-progress: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false

      # `submodules: recursive` fetched content unbounded inside checkout, so a
      # stalled transfer spent the whole 15-minute budget there and took the row
      # down before a single test ran. The fetch is the same shallow, blobless
      # one `landing.yml` uses; what is new is that each attempt is bounded and
      # retried, so a transient stall costs minutes instead of the budget.
      #
      # This workflow may not cache (`scripts/tests/test_workflow_runtime_inventory.py`
      # and `test_rust_ci_coverage.py` both assert no `actions/cache/*` here), and
      # content is a gigabyte, so neither a shared cache nor a run-scoped artifact
      # handoff is available to collapse the per-row fetch.
      - name: Resolve pinned content revision
        id: content
        run: |
          revision=$(git rev-parse HEAD:content)
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid content gitlink: $revision" >&2
            exit 1
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Materialize pinned content checkout
        timeout-minutes: 9
        run: |
          # Bound each attempt rather than the job: an unbounded fetch that
          # stalls is indistinguishable from a slow one until the runner
          # cancels the row, and by then the whole budget is gone.
          #
          # The first attempt gets five minutes because no cold blobless fetch
          # time is recorded anywhere -- a healthy one has to fit inside the
          # 15-minute row alongside an instrumented compile and its tests, so
          # five is already far more than it can be using. The retry gets three:
          # it resumes from whatever the first attempt fetched, and a second
          # stall is a provider problem rather than a slow transfer. Eight
          # minutes worst case still leaves the row more time than the 14m53s
          # stall left it, which was none.
          for attempt in 1 2; do
            case "$attempt" in
              1) budget=300 ;;
              *) budget=180 ;;
            esac
            started=$SECONDS
            status=0
            python3 scripts/run_with_timeout.py "$budget" git submodule update --init --force --depth=1 \
              --filter=blob:none content || status=$?
            elapsed=$((SECONDS - started))
            if (( status == 0 )); then
              size=$(du -sk .git/modules/content | cut -f1)
              echo "content-checkout attempt=$attempt seconds=$elapsed size-kib=$size"
              exit 0
            fi
            # `run_with_timeout.py` reports 124 for the stall this exists to bound; any
            # other status is the fetch itself failing, and reporting one as
            # the other sends the next reader looking at the wrong thing. The
            # size on the success line is what separates a provider stall from
            # a repository that simply grew.
            if (( status == 124 )); then
              reason=stalled
            else
              reason=failed-status-$status
            fi
            echo "content-checkout attempt=$attempt $reason after=${elapsed}s" >&2
          done
          echo "::error::pinned content checkout did not complete in two bounded attempts" >&2
          exit 1

      - name: Verify pinned content checkout
        env:
          CONTENT_REVISION: ${{ steps.content.outputs.revision }}
        run: |
          actual=$(git -C content rev-parse HEAD)
          [[ "$actual" == "$CONTENT_REVISION" ]]
          [[ -z "$(git -C content status --porcelain --untracked-files=all)" ]]

      - name: Install native Rust dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libasound2-dev \
            libfreetype6-dev \
            libvulkan1 \
            libxmp4 \
            libudev-dev \
            mesa-vulkan-drivers \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0

      - name: Install cargo-nextest
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-nextest@0.9.91
          fallback: none

      - name: Restore Linux landing cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: . -> target
          shared-key: full-parity
          save-if: false

      # The ordinary landing suite runs the replay assertion. Repeat it here
      # only when retaining a fresh snapshot for the ignored render diagnostic.
      - name: Generate deterministic replay evidence
        env:
          LC_TEST_ARTIFACT_DIR: ${{ github.workspace }}/target/dev-check/replay
          LC_KEEP_PASS_ARTIFACTS: '1'
        run: |
          cargo nextest run \
            -p clonk-engine-integration-tests \
            --test engine_it \
            --locked \
            -- \
            dev_feedback_replay::real_scenario_replays_repeat_with_native_group_order \
            --exact
          snapshot=$(find target/dev-check/replay -type f -name final.json -print | sort | tail -1)
          if [[ -z "$snapshot" ]]; then
            echo "deterministic replay produced no final snapshot" >&2
            exit 1
          fi
          cp "$snapshot" target/dev-check/snapshot-final.json

      - name: Render the replay snapshot
        env:
          LC_DEV_CHECK_SNAPSHOT: ${{ github.workspace }}/target/dev-check/snapshot-final.json
          LC_DEV_CHECK_FRAME_PNG: ${{ github.workspace }}/target/dev-check/frame-final.png
          LC_DEV_CHECK_RENDER_METRICS: ${{ github.workspace }}/target/dev-check/render-metrics.json
        run: |
          cargo nextest run \
            -p clonk-frontend \
            --features dev-feedback-render \
            --test dev_feedback_render \
            --locked \
            -- \
            dev_feedback_render --ignored --exact

      - name: Upload developer-feedback artifacts
        if: ${{ always() && inputs.upload-diagnostics }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: developer-feedback-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/dev-check
          if-no-files-found: warn
          retention-days: 14

  recording-host-oracles:
    name: Recording-host material-order oracles (macOS)
    runs-on: macos-latest
    timeout-minutes: 45
    concurrency:
      group: "main-recording-host-${{ inputs.concurrency-suffix }}"
      cancel-in-progress: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false

      # `submodules: recursive` fetched content unbounded inside checkout, so a
      # stalled transfer spent the whole 15-minute budget there and took the row
      # down before a single test ran. The fetch is the same shallow, blobless
      # one `landing.yml` uses; what is new is that each attempt is bounded and
      # retried, so a transient stall costs minutes instead of the budget.
      #
      # This workflow may not cache (`scripts/tests/test_workflow_runtime_inventory.py`
      # and `test_rust_ci_coverage.py` both assert no `actions/cache/*` here), and
      # content is a gigabyte, so neither a shared cache nor a run-scoped artifact
      # handoff is available to collapse the per-row fetch.
      - name: Resolve pinned content revision
        id: content
        run: |
          revision=$(git rev-parse HEAD:content)
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid content gitlink: $revision" >&2
            exit 1
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Materialize pinned content checkout
        timeout-minutes: 9
        run: |
          # Bound each attempt rather than the job: an unbounded fetch that
          # stalls is indistinguishable from a slow one until the runner
          # cancels the row, and by then the whole budget is gone.
          #
          # The first attempt gets five minutes because no cold blobless fetch
          # time is recorded anywhere -- a healthy one has to fit inside the
          # 15-minute row alongside an instrumented compile and its tests, so
          # five is already far more than it can be using. The retry gets three:
          # it resumes from whatever the first attempt fetched, and a second
          # stall is a provider problem rather than a slow transfer. Eight
          # minutes worst case still leaves the row more time than the 14m53s
          # stall left it, which was none.
          for attempt in 1 2; do
            case "$attempt" in
              1) budget=300 ;;
              *) budget=180 ;;
            esac
            started=$SECONDS
            status=0
            python3 scripts/run_with_timeout.py "$budget" git submodule update --init --force --depth=1 \
              --filter=blob:none content || status=$?
            elapsed=$((SECONDS - started))
            if (( status == 0 )); then
              size=$(du -sk .git/modules/content | cut -f1)
              echo "content-checkout attempt=$attempt seconds=$elapsed size-kib=$size"
              exit 0
            fi
            # `run_with_timeout.py` reports 124 for the stall this exists to bound; any
            # other status is the fetch itself failing, and reporting one as
            # the other sends the next reader looking at the wrong thing. The
            # size on the success line is what separates a provider stall from
            # a repository that simply grew.
            if (( status == 124 )); then
              reason=stalled
            else
              reason=failed-status-$status
            fi
            echo "content-checkout attempt=$attempt $reason after=${elapsed}s" >&2
          done
          echo "::error::pinned content checkout did not complete in two bounded attempts" >&2
          exit 1

      - name: Verify pinned content checkout
        env:
          CONTENT_REVISION: ${{ steps.content.outputs.revision }}
        run: |
          actual=$(git -C content rev-parse HEAD)
          [[ "$actual" == "$CONTENT_REVISION" ]]
          [[ -z "$(git -C content status --porcelain --untracked-files=all)" ]]

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0

      - name: Install cargo-nextest
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-nextest@0.9.91
          fallback: none

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: . -> target
          shared-key: recording-host-oracles
          save-if: ${{ inputs.publish-recording-host-cache }}

      # scripts/tests/test_rust_ci_recording_host_gate.py requires these
      # material-order oracles to appear here even though they now run on
      # every host (clonk-org/clonk-rs#1455).
      - name: Run recording-host material-order oracles
        run: |
          cargo nextest run \
            -p clonk-app \
            -p clonk-engine-integration-tests \
            -p clonk-frontend-unit-tests \
            --bin clonk-app \
            --test engine_it \
            --test frontend_inline \
            --locked \
            -E 'test(/(alchemy_real_scenario_subcases_batch_4|app_virtual_keyboard_completes_real_tutorial02_route|committed_real_scenario_replays_are_deterministic|real_tutorial_seven_acid_rain_matches_cpp_animated_pxs_sequence|tutorial02_virtual_player_completes_the_real_tutorial_route|tutorial07_seed_zero_landscape_matches_cpp_surface8|tutorial_landscapes_match_cpp_surface8_across_scenarios_and_seeds)$/)'

  platform-lints:
    name: Platform lints / ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    # `cargo clippy -D warnings` runs only on Linux in `landing.yml`, so the
    # `cfg(windows)` and `cfg(target_os = "macos")` paths were never linted by
    # anything and had accumulated findings (clonk-org/clonk-rs#725). The port
    # carries a lot of both, and the next one could be a real bug rather than
    # an unused `mut`.
    #
    # Here rather than in the queue's ordinary gates because this is a whole
    # extra workspace build per platform. That still makes it release-blocking
    # — `landing.yml` waits on this workflow as `release-qualification` — while
    # staying an asynchronous diagnostic after an ordinary landing.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-latest
            # Everything builds natively here.
            scope: --workspace
          - name: Windows
            runner: windows-latest
            # Everything builds natively here too, once the vendored libpng
            # inside `freetype-rs`'s `bundled` feature is told where zlib's
            # headers are — see the step below (clonk-org/clonk-rs#737).
            scope: --workspace
    concurrency:
      group: "main-platform-lint-${{ matrix.name }}-${{ inputs.concurrency-suffix }}"
      cancel-in-progress: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
        with:
          components: clippy

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: . -> target
          shared-key: platform-lints-${{ matrix.name }}

      # `freetype-rs` is taken with `features = ["bundled"]`, which compiles
      # vendored libpng, and that libpng needs `zlib.h`. Its build passes
      # `-I libz-sys/src/zlib` without that path being populated, so under
      # native MSVC it fails before clippy sees a single lint:
      #
      #   freetype-sys .. libpng\pngstruct.h: fatal error C1083:
      #   Cannot open include file: 'zlib.h'
      #
      # Hand it the headers `libz-sys` already vendors. This is the same three
      # lines `rust.yml` uses to build the shipped `clonk-app` natively on this
      # runner, so the shape is already proven here rather than inferred from
      # the mingw cross-build. The path carries a registry hash and the exact
      # `libz-sys` version, so it has to be globbed after `cargo fetch` rather
      # than written into `.cargo/config.toml`.
      - name: Point the vendored libpng at zlib's headers
        if: matrix.name == 'Windows'
        run: |
          cargo fetch --locked
          zlib_dir=$(find "${CARGO_HOME:-$HOME/.cargo}/registry/src" -maxdepth 2 -type d -name 'libz-sys-*' | head -1)/src/zlib
          if [[ ! -f "$zlib_dir/zlib.h" ]]; then
            echo "could not locate the vendored zlib headers under $zlib_dir" >&2
            exit 1
          fi
          echo "CFLAGS_x86_64_pc_windows_msvc=-I$zlib_dir" >> "$GITHUB_ENV"

      # No `--tests`, and so no `content/` checkout: the `include_bytes!` sites
      # that need the submodule are all inside `#[test]` bodies, and keeping
      # them out holds this to one library-and-binary build per platform.
      - name: Lint this platform's own code paths
        env:
          LINT_SCOPE: ${{ matrix.scope }}
        run: cargo clippy $LINT_SCOPE --lib --bins --locked -- -D warnings
