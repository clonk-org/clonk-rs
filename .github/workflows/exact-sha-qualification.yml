name: Exact-SHA qualification

on:
  workflow_call:
    inputs:
      source-sha:
        description: The exact commit to qualify
        required: true
        type: string
      concurrency-suffix:
        description: An exact-SHA or rolling concurrency lane
        required: true
        type: string
      publish-recording-host-cache:
        description: Whether this trusted ref may publish the macOS cache
        required: true
        type: boolean
      upload-diagnostics:
        description: Whether to retain coverage and developer-feedback reports
        required: true
        type: boolean

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always

jobs:
  coverage-fragments:
    name: Rust coverage / ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: "main-coverage-${{ matrix.artifact }}-${{ inputs.concurrency-suffix }}"
      cancel-in-progress: true
    env:
      CARGO_TARGET_DIR: target/coverage-build
      COVERAGE_IGNORE_REGEX: '/(main_tests|lib_tests)/|/(parity_differential|test_game_call_ex|test_support)\.rs$'
      LLVM_PROFILE_FILE_NAME: 'clonk-%8m.profraw'
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app 1+10/12
            artifact: app-1-10
            apt: libasound2-dev libudev-dev
            command: cargo llvm-cov --no-report nextest -p clonk-app --features app-test-shard-1,app-test-shard-10 --no-fail-fast --locked
          - name: app 2+7/12
            artifact: app-2-7
            apt: libasound2-dev libudev-dev
            command: cargo llvm-cov --no-report nextest -p clonk-app --features app-test-shard-2,app-test-shard-7 --no-fail-fast --locked
          - name: app 3+12/12
            artifact: app-3-12
            apt: libasound2-dev libudev-dev
            command: cargo llvm-cov --no-report nextest -p clonk-app --features app-test-shard-3,app-test-shard-12 --no-fail-fast --locked
          - name: app 4+9/12
            artifact: app-4-9
            apt: libasound2-dev libudev-dev
            command: cargo llvm-cov --no-report nextest -p clonk-app --features app-test-shard-4,app-test-shard-9 --no-fail-fast --locked
          - name: app 5+11/12
            artifact: app-5-11
            apt: libasound2-dev libudev-dev
            command: cargo llvm-cov --no-report nextest -p clonk-app --features app-test-shard-5,app-test-shard-11 --no-fail-fast --locked
          - name: app 6+8/12
            artifact: app-6-8
            apt: libasound2-dev libudev-dev
            command: cargo llvm-cov --no-report nextest -p clonk-app --features app-test-shard-6,app-test-shard-8 --no-fail-fast --locked
          - name: engine integration 1/2
            artifact: engine-1
            apt: ''
            command: cargo llvm-cov --no-report nextest -p clonk-engine-integration-tests --test engine_it --features engine-it-shard-1 --no-fail-fast --locked
          - name: engine integration 2/2
            artifact: engine-2
            apt: ''
            command: cargo llvm-cov --no-report nextest -p clonk-engine-integration-tests --test engine_it --features engine-it-shard-2 --no-fail-fast --locked
          - name: engine and frontend units
            artifact: engine-and-frontend-units
            apt: ''
            command: cargo llvm-cov --no-report nextest -p clonk-engine-unit-tests -p clonk-frontend-unit-tests --no-fail-fast --locked
          - name: remaining workspace 1/2
            artifact: remaining-1
            apt: mesa-vulkan-drivers
            command: cargo llvm-cov --no-report nextest -p clonk-app-core -p clonk-app-netplay -p clonk-app-render -p clonk-frontend -p clonk-launcher-shell -p clonk-launcher-ui -p pixels --no-fail-fast --locked
          - name: remaining workspace 2/2
            artifact: remaining-2
            apt: libasound2-dev libxmp4
            command: cargo llvm-cov --no-report nextest -p clonk-app-menus -p clonk-audio -p clonk-c4group -p clonk-core -p clonk-engine -p clonk-engine-core -p clonk-game -p clonk-graphics -p clonk-gui -p clonk-icon -p clonk-launcher -p clonk-logging -p clonk-network -p clonk-platform -p clonk-resources -p clonk-scaling -p clonk-script -p clonk-update -p clonk-update-net -p xtask --features xtask/engine-tools --no-fail-fast --locked
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
          submodules: recursive

      - name: Install native Rust dependencies
        if: matrix.apt != ''
        env:
          APT_PACKAGES: ${{ matrix.apt }}
        run: |
          read -r -a packages <<< "$APT_PACKAGES"
          if ! sudo apt-get install --yes --no-install-recommends "${packages[@]}"; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends "${packages[@]}"
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
        with:
          components: llvm-tools-preview

      - name: Install cargo-nextest
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-nextest@0.9.91
          fallback: none

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-llvm-cov@0.8.7
          fallback: none

      # Instrumented targets are large and incompatible across collector
      # feature sets. Reuse only Cargo downloads; one trusted-main row refreshes
      # the shared registry cache after all rows restore the same snapshot.
      - name: Restore Cargo registry cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-targets: false
          shared-key: coverage-registry
          save-if: ${{ inputs.upload-diagnostics && matrix.artifact == 'app-1-10' }}

      - name: Collect instrumented coverage fragment
        env:
          SHARD_COMMAND: ${{ matrix.command }}
        run: |
          cargo llvm-cov clean --workspace
          bash -euo pipefail -c "$SHARD_COMMAND"
          mkdir -p target/coverage-fragments
          cargo llvm-cov report --lcov \
            --output-path "target/coverage-fragments/${{ matrix.artifact }}.lcov" \
            --ignore-filename-regex "$COVERAGE_IGNORE_REGEX"
          gzip --best "target/coverage-fragments/${{ matrix.artifact }}.lcov"

      - name: Hand off coverage fragment
        if: ${{ !inputs.upload-diagnostics }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/coverage-fragments/${{ matrix.artifact }}.lcov.gz
          key: rust-coverage-fragment-${{ github.run_id }}-${{ matrix.artifact }}

      # cache/save reports service failures as warnings. Verify the immutable
      # run-scoped handoff now so the collector fails closed on a cache miss.
      - name: Verify coverage fragment handoff
        if: ${{ !inputs.upload-diagnostics }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/coverage-fragments/${{ matrix.artifact }}.lcov.gz
          key: rust-coverage-fragment-${{ github.run_id }}-${{ matrix.artifact }}
          fail-on-cache-miss: true
          lookup-only: true

      - name: Upload coverage fragment
        if: inputs.upload-diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-coverage-fragment-${{ github.run_id }}-${{ matrix.artifact }}
          path: target/coverage-fragments/${{ matrix.artifact }}.lcov.gz
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  coverage:
    name: Rust code coverage
    needs: coverage-fragments
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: "main-coverage-report-${{ inputs.concurrency-suffix }}"
      cancel-in-progress: true
    env:
      # The prior LLVM JSON gate was 79%. LCOV detail omits unmergeable macro
      # expansion totals and reads 0.45 points higher on the baseline report.
      COVERAGE_MIN_LINE_PERCENT: '79.45'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false

      - name: Download coverage fragments
        if: inputs.upload-diagnostics
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rust-coverage-fragment-${{ github.run_id }}-*
          path: target/coverage-fragments
          merge-multiple: true

      - name: Restore coverage fragment / app-1-10
        if: ${{ !inputs.upload-diagnostics }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/coverage-fragments/app-1-10.lcov.gz
          key: rust-coverage-fragment-${{ github.run_id }}-app-1-10
          fail-on-cache-miss: true

      - name: Restore coverage fragment / app-2-7
        if: ${{ !inputs.upload-diagnostics }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/coverage-fragments/app-2-7.lcov.gz
          key: rust-coverage-fragment-${{ github.run_id }}-app-2-7
          fail-on-cache-miss: true

      - name: Restore coverage fragment / app-3-12
        if: ${{ !inputs.upload-diagnostics }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/coverage-fragments/app-3-12.lcov.gz
          key: rust-coverage-fragment-${{ github.run_id }}-app-3-12
          fail-on-cache-miss: true

      - name: Restore coverage fragment / app-4-9
        if: ${{ !inputs.upload-diagnostics }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/coverage-fragments/app-4-9.lcov.gz
          key: rust-coverage-fragment-${{ github.run_id }}-app-4-9
          fail-on-cache-miss: true

      - name: Restore coverage fragment / app-5-11
        if: ${{ !inputs.upload-diagnostics }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/coverage-fragments/app-5-11.lcov.gz
          key: rust-coverage-fragment-${{ github.run_id }}-app-5-11
          fail-on-cache-miss: true

      - name: Restore coverage fragment / app-6-8
        if: ${{ !inputs.upload-diagnostics }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/coverage-fragments/app-6-8.lcov.gz
          key: rust-coverage-fragment-${{ github.run_id }}-app-6-8
          fail-on-cache-miss: true

      - name: Restore coverage fragment / engine-1
        if: ${{ !inputs.upload-diagnostics }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/coverage-fragments/engine-1.lcov.gz
          key: rust-coverage-fragment-${{ github.run_id }}-engine-1
          fail-on-cache-miss: true

      - name: Restore coverage fragment / engine-2
        if: ${{ !inputs.upload-diagnostics }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/coverage-fragments/engine-2.lcov.gz
          key: rust-coverage-fragment-${{ github.run_id }}-engine-2
          fail-on-cache-miss: true

      - name: Restore coverage fragment / engine-and-frontend-units
        if: ${{ !inputs.upload-diagnostics }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/coverage-fragments/engine-and-frontend-units.lcov.gz
          key: rust-coverage-fragment-${{ github.run_id }}-engine-and-frontend-units
          fail-on-cache-miss: true

      - name: Restore coverage fragment / remaining-1
        if: ${{ !inputs.upload-diagnostics }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/coverage-fragments/remaining-1.lcov.gz
          key: rust-coverage-fragment-${{ github.run_id }}-remaining-1
          fail-on-cache-miss: true

      - name: Restore coverage fragment / remaining-2
        if: ${{ !inputs.upload-diagnostics }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/coverage-fragments/remaining-2.lcov.gz
          key: rust-coverage-fragment-${{ github.run_id }}-remaining-2
          fail-on-cache-miss: true

      - name: Enforce merged line coverage floor
        env:
          EXPECTED_FRAGMENT_COUNT: '11'
        run: |
          expected=(
            app-1-10
            app-2-7
            app-3-12
            app-4-9
            app-5-11
            app-6-8
            engine-1
            engine-2
            engine-and-frontend-units
            remaining-1
            remaining-2
          )
          shopt -s nullglob
          fragments=(target/coverage-fragments/*.lcov.gz)
          if [[ "${#fragments[@]}" -ne "$EXPECTED_FRAGMENT_COUNT" ]]; then
            echo "expected ${EXPECTED_FRAGMENT_COUNT} coverage fragments, found ${#fragments[@]}" >&2
            exit 1
          fi
          expected_names=$(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          actual_names=$(printf '%s\n' "${fragments[@]##*/}" | sed 's/\.lcov\.gz$//' | LC_ALL=C sort)
          if [[ "$actual_names" != "$expected_names" ]]; then
            diff -u <(printf '%s\n' "$expected_names") <(printf '%s\n' "$actual_names") || true
            exit 1
          fi
          gzip --decompress --keep target/coverage-fragments/*.lcov.gz
          python3 scripts/merge-rust-coverage.py \
            --fail-under-lines "$COVERAGE_MIN_LINE_PERCENT" \
            target/coverage-fragments/*.lcov

  # HTML is useful post-merge diagnostics, not part of the coverage gate. It
  # independently merges the fragments so rendering and artifact retention
  # cannot extend or fail the required release-qualification critical path.
  coverage-html:
    name: Rust coverage HTML report
    needs: coverage-fragments
    if: inputs.upload-diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: "main-coverage-html-${{ inputs.concurrency-suffix }}"
      cancel-in-progress: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false

      - name: Download Rust coverage fragments
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rust-coverage-fragment-${{ github.run_id }}-*
          path: target/coverage-fragments
          merge-multiple: true

      - name: Merge Rust coverage fragments
        env:
          EXPECTED_FRAGMENT_COUNT: '11'
        run: |
          expected=(
            app-1-10
            app-2-7
            app-3-12
            app-4-9
            app-5-11
            app-6-8
            engine-1
            engine-2
            engine-and-frontend-units
            remaining-1
            remaining-2
          )
          shopt -s nullglob
          fragments=(target/coverage-fragments/*.lcov.gz)
          if [[ "${#fragments[@]}" -ne "$EXPECTED_FRAGMENT_COUNT" ]]; then
            echo "expected ${EXPECTED_FRAGMENT_COUNT} coverage fragments, found ${#fragments[@]}" >&2
            exit 1
          fi
          expected_names=$(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          actual_names=$(printf '%s\n' "${fragments[@]##*/}" | sed 's/\.lcov\.gz$//' | LC_ALL=C sort)
          if [[ "$actual_names" != "$expected_names" ]]; then
            diff -u <(printf '%s\n' "$expected_names") <(printf '%s\n' "$actual_names") || true
            exit 1
          fi
          gzip --decompress --keep target/coverage-fragments/*.lcov.gz
          python3 scripts/merge-rust-coverage.py \
            --output target/coverage/lcov.info \
            target/coverage-fragments/*.lcov

      - name: Install LCOV report generator
        run: |
          if ! sudo apt-get install --yes --no-install-recommends lcov; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends lcov
          fi

      - name: Generate Rust coverage report
        run: |
          genhtml target/coverage/lcov.info \
            --output-directory target/coverage/html \
            --legend \
            --title "clonk-rs ${{ inputs.source-sha }}"

      - name: Upload Rust coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/coverage/lcov.info
            target/coverage/html
          if-no-files-found: warn
          retention-days: 14

  developer-feedback:
    name: Developer feedback replay
    if: inputs.upload-diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: "main-developer-feedback-${{ inputs.concurrency-suffix }}"
      cancel-in-progress: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
          submodules: recursive

      - name: Install native Rust dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libasound2-dev \
            libfreetype6-dev \
            libvulkan1 \
            libxmp4 \
            libudev-dev \
            mesa-vulkan-drivers \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1

      - name: Install cargo-nextest
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-nextest@0.9.91
          fallback: none

      - name: Restore Linux landing cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: . -> target
          shared-key: full-parity
          save-if: false

      # The ordinary landing suite runs the replay assertion. Repeat it here
      # only when retaining a fresh snapshot for the ignored render diagnostic.
      - name: Generate deterministic replay evidence
        env:
          LC_TEST_ARTIFACT_DIR: ${{ github.workspace }}/target/dev-check/replay
          LC_KEEP_PASS_ARTIFACTS: '1'
        run: |
          cargo nextest run \
            -p clonk-engine-integration-tests \
            --test engine_it \
            --locked \
            -- \
            dev_feedback_replay::real_scenario_replays_repeat_with_native_group_order \
            --exact
          snapshot=$(find target/dev-check/replay -type f -name final.json -print | sort | tail -1)
          if [[ -z "$snapshot" ]]; then
            echo "deterministic replay produced no final snapshot" >&2
            exit 1
          fi
          cp "$snapshot" target/dev-check/snapshot-final.json

      - name: Render the replay snapshot
        env:
          LC_DEV_CHECK_SNAPSHOT: ${{ github.workspace }}/target/dev-check/snapshot-final.json
          LC_DEV_CHECK_FRAME_PNG: ${{ github.workspace }}/target/dev-check/frame-final.png
          LC_DEV_CHECK_RENDER_METRICS: ${{ github.workspace }}/target/dev-check/render-metrics.json
        run: |
          cargo nextest run \
            -p clonk-frontend \
            --features dev-feedback-render \
            --test dev_feedback_render \
            --locked \
            -- \
            dev_feedback_render --ignored --exact

      - name: Upload developer-feedback artifacts
        if: ${{ always() && inputs.upload-diagnostics }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: developer-feedback-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/dev-check
          if-no-files-found: warn
          retention-days: 14

  recording-host-oracles:
    name: Recording-host material-order oracles (macOS)
    runs-on: macos-latest
    timeout-minutes: 45
    concurrency:
      group: "main-recording-host-${{ inputs.concurrency-suffix }}"
      cancel-in-progress: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1

      - name: Install cargo-nextest
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-nextest@0.9.91
          fallback: none

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: . -> target
          shared-key: recording-host-oracles
          save-if: ${{ inputs.publish-recording-host-cache }}

      # scripts/tests/test_rust_ci_recording_host_gate.py requires every test
      # carrying the recording-host marker to appear here.
      - name: Run recording-host material-order oracles
        run: |
          cargo nextest run \
            -p clonk-app \
            -p clonk-engine-integration-tests \
            -p clonk-frontend-unit-tests \
            --bin clonk-app \
            --test engine_it \
            --test frontend_inline \
            --locked \
            -E 'test(/(alchemy_real_scenario_subcases_batch_4|app_virtual_keyboard_completes_real_tutorial02_route|committed_real_scenario_replays_are_deterministic|real_tutorial_seven_acid_rain_matches_cpp_animated_pxs_sequence|tutorial02_virtual_player_completes_the_real_tutorial_route|tutorial07_seed_zero_landscape_matches_cpp_surface8)$/)'
