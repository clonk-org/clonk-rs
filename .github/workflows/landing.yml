name: Landing

# Pull requests answer only the admission question. The merge queue then tests
# the exact tree that can land across independent Linux shards and Windows
# smoke coverage; trusted post-merge validation builds the shipped MSVC apps.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "landing-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always

jobs:
  pull-request-title:
    name: Pull request title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - name: Check the title is a Conventional Commit subject
        env:
          # Untrusted text belongs in the environment, never interpolated into
          # the shell program by the Actions expression evaluator.
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|style|test)!?: .+'
          if [[ "$TITLE" == *$'\n'* || ! "$TITLE" =~ $pattern ]]; then
            echo "::error::Pull request title is not a Conventional Commit subject: ${TITLE}"
            echo "The merge queue squashes this title onto main verbatim." >&2
            exit 1
          fi

  # Preserve all 18 merge-queue Linux shards. This PR-only runner can contend
  # with a merge group; another admission leg requires revisiting the 20-runner
  # budget.
  pull-request-quality:
    name: Pull request quality
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive

      - name: Install native dependencies
        run: |
          packages=(libasound2-dev libudev-dev)
          if ! sudo apt-get install --yes --no-install-recommends "${packages[@]}"; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends "${packages[@]}"
          fi

      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
        with:
          components: clippy, rustfmt

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: . -> target
          shared-key: full-parity
          save-if: false

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint the workspace
        run: cargo clippy --profile test --workspace --lib --bins --tests --features xtask/engine-tools --locked -- -D warnings

  # The merge queue creates the exact commit that will land. Release commits
  # package there, while still read-only, so the post-merge workflow only has
  # to promote already-tested immutable artifacts.
  release-context:
    name: Resolve release candidate
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr-number: ${{ steps.release.outputs.pr-number }}
      release: ${{ steps.release.outputs.release }}
      tree-sha: ${{ steps.release.outputs.tree-sha }}
      version: ${{ steps.release.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Resolve the merge-group release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.sha }}
          # The push-only `head_commit` field is absent here. The merge-group
          # payload carries the exact candidate commit and its squash subject.
          MERGE_SUBJECT: ${{ github.event.merge_group.head_commit.message }}
          REPOSITORY: ${{ github.repository }}
        run: |
          subject=${MERGE_SUBJECT%%$'\n'*}
          if [[ "$subject" != "chore: release "* ]]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pattern='^chore: release ([0-9]+\.[0-9]+\.[0-9]+) \(#([0-9]+)\)$'
          if [[ ! "$subject" =~ $pattern ]]; then
            echo "malformed release subject: $subject" >&2
            exit 1
          fi
          version=${BASH_REMATCH[1]}
          pr_number=${BASH_REMATCH[2]}

          pr=$(gh api "repos/${REPOSITORY}/pulls/${pr_number}")
          title=$(jq -r '.title' <<<"$pr")
          state=$(jq -r '.state' <<<"$pr")
          head_ref=$(jq -r '.head.ref' <<<"$pr")
          head_repo=$(jq -r '.head.repo.full_name // ""' <<<"$pr")
          base_ref=$(jq -r '.base.ref' <<<"$pr")
          if [[ "$title" != "chore: release ${version}" || "$state" != "open" \
            || "$head_ref" != "release/next" || "$head_repo" != "$REPOSITORY" \
            || "$base_ref" != "main" ]]; then
            echo "merge-group release pull request identity is invalid" >&2
            exit 1
          fi

          merge_tree=$(gh api "repos/${REPOSITORY}/git/commits/${MERGE_SHA}" --jq '.tree.sha')
          if [[ ! "$merge_tree" =~ ^[0-9a-f]{40}$ ]]; then
            echo "merge-group release tree is invalid" >&2
            exit 1
          fi

          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "pr-number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "tree-sha=$merge_tree" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  release-prebuild:
    name: Prebuild release candidate
    needs: release-context
    if: needs.release-context.outputs.release == 'true'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/release-prebuild.yml
    with:
      source-sha: ${{ github.sha }}
      tree-sha: ${{ needs.release-context.outputs.tree-sha }}
      version: ${{ needs.release-context.outputs.version }}
      pr-number: ${{ needs.release-context.outputs.pr-number }}

  release-build:
    name: Build release candidate
    needs: [release-context, release-prebuild]
    if: needs.release-context.outputs.release == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/release-build.yml
    with:
      source-sha: ${{ github.sha }}
      tree-sha: ${{ needs.release-context.outputs.tree-sha }}
      version: ${{ needs.release-context.outputs.version }}

  release-qualification:
    name: Qualify release candidate
    needs: [release-context, linux, windows-smoke]
    if: needs.release-context.outputs.release == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/exact-sha-qualification.yml
    with:
      source-sha: ${{ github.sha }}
      concurrency-suffix: ${{ github.sha }}
      # Only trusted main publishes reusable caches. A merge-group cache is
      # scoped to its ephemeral ref and no later candidate can restore it.
      publish-recording-host-cache: false
      # Publication resolves exactly seven payload artifacts plus this run's
      # twelve non-publishable coverage handoffs.
      upload-diagnostics: false

  linux:
    name: Linux / ${{ matrix.name }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The queue admits one candidate at a time. Only the non-cancelling cache
    # producer shares a rolling lane; post-merge diagnostics can cancel their
    # own rolling predecessors but must not cancel required queue rows.
    concurrency:
      group: >-
        ${{ github.event_name == 'merge_group' && matrix.name == 'app 2/12' && 'linux-landing-cache-rolling'
          || format('landing-linux-{0}-{1}', github.run_id, matrix.name) }}
      cancel-in-progress: ${{ github.event_name == 'merge_group' }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app netplay 1/2
            apt: libasound2-dev libudev-dev
            command: cargo nextest run -p clonk-app --features app-test-shard-1 --no-fail-fast --locked
          - name: app netplay 2/2
            apt: libasound2-dev libudev-dev
            command: cargo nextest run -p clonk-app --features app-test-shard-10 --no-fail-fast --locked
          - name: app 2/12
            apt: libasound2-dev libudev-dev
            command: cargo nextest run -p clonk-app --features app-test-shard-2 --no-fail-fast --locked
          - name: app 3/12
            apt: libasound2-dev libudev-dev
            command: cargo nextest run -p clonk-app --features app-test-shard-3 --no-fail-fast --locked
          - name: app 4/12
            apt: libasound2-dev libudev-dev
            command: cargo nextest run -p clonk-app --features app-test-shard-4 --no-fail-fast --locked
          - name: app 5/12
            apt: libasound2-dev libudev-dev
            command: cargo nextest run -p clonk-app --features app-test-shard-5 --no-fail-fast --locked
          - name: app 6/12
            apt: libasound2-dev libudev-dev
            command: cargo nextest run -p clonk-app --features app-test-shard-6 --no-fail-fast --locked
          - name: app 7/12
            apt: libasound2-dev libudev-dev
            command: cargo nextest run -p clonk-app --features app-test-shard-7 --no-fail-fast --locked
          - name: app 8/12
            apt: libasound2-dev libudev-dev
            command: cargo nextest run -p clonk-app --features app-test-shard-8 --no-fail-fast --locked
          - name: app 9/12
            apt: libasound2-dev libudev-dev
            command: cargo nextest run -p clonk-app --features app-test-shard-9 --no-fail-fast --locked
          - name: app 11/12
            apt: libasound2-dev libudev-dev
            command: cargo nextest run -p clonk-app --features app-test-shard-11 --no-fail-fast --locked
          - name: app 12/12
            apt: libasound2-dev libudev-dev
            command: cargo nextest run -p clonk-app --features app-test-shard-12 --no-fail-fast --locked
          - name: engine integration 1/2
            command: cargo nextest run -p clonk-engine-integration-tests --test engine_it --features engine-it-shard-1 --no-fail-fast --locked
          - name: workspace unit and parity
            command: |
              failed=0
              cargo nextest run -p clonk-engine-unit-tests -p clonk-frontend-unit-tests -p clonk-engine-integration-tests --features clonk-engine-integration-tests/engine-it-shard-2 --no-fail-fast --locked || failed=1
              cargo xtask parity verify || failed=1
              exit "$failed"
          - name: remaining workspace 1/2
            apt: mesa-vulkan-drivers
            command: cargo nextest run -p clonk-app-core -p clonk-app-netplay -p clonk-app-render -p clonk-frontend -p clonk-launcher-shell -p clonk-launcher-ui -p clonk-surface --no-fail-fast --locked
          - name: remaining workspace 2/2
            apt: libasound2-dev libxmp4
            command: cargo nextest run -p clonk-app-menus -p clonk-audio -p clonk-c4group -p clonk-core -p clonk-engine -p clonk-engine-core -p clonk-game -p clonk-graphics -p clonk-gui -p clonk-icon -p clonk-launcher -p clonk-logging -p clonk-network -p clonk-platform -p clonk-resources -p clonk-scaling -p clonk-script -p clonk-update -p clonk-update-net -p xtask --no-fail-fast --locked
          - name: workspace quality
            apt: libasound2-dev libudev-dev python3-pil
            command: |
              failed=0
              cargo clippy --version || failed=1
              rustfmt --version || failed=1
              cargo fmt --all -- --check || failed=1
              git fetch --no-tags --depth=1 origin 7d43b47b7d789b533f32d005e64596e0a07019cd || failed=1
              # Issue references must name their repository: this one is public,
              # and a bare "#28" collides across clonk-rs and LegacyClonk. The
              # CLO- and M##-P#-L### trackers are not resolvable from this
              # repository at all -- state the fact, not the id.
              # Deliberately NOT a general bare-#N check -- object and definition
              # numbers (WIPF #564, KING #5129) use the same spelling.
              # CHANGELOG.md is exempt: git-cliff regenerates it from landed
              # commit subjects, which are frozen history on main.
              if git grep -nIE 'CLO-[0-9]+|M[0-9]{2}(-[A-Z]?[0-9]+)*-L[0-9]+|(issue|task|ticket)s? #[0-9]+' -- ':!CHANGELOG.md'; then
                echo "::error::write issue references as owner/repo#N (e.g. clonk-org/clonk-rs#50, legacyclonk/LegacyClonk#28); replace private tracker ids with the fact they stand for"
                failed=1
              fi
              python3 -m unittest discover --buffer -s scripts/tests -p 'test_*.py' || failed=1
              cargo clippy --profile test --workspace --lib --bins --tests --features xtask/engine-tools --locked -- -D warnings || failed=1
              exit "$failed"
          - name: engine contracts
            command: |
              cargo test -p xtask --features engine-tools --bin xtask-engine-tools --locked
              cargo xtask engine-snapshots verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive

      - name: Install native dependencies
        if: matrix.apt != ''
        env:
          APT_PACKAGES: ${{ matrix.apt }}
        run: |
          read -r -a packages <<< "$APT_PACKAGES"
          if ! sudo apt-get install --yes --no-install-recommends "${packages[@]}"; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends "${packages[@]}"
          fi

      - name: Reuse exact preinstalled Rust
        id: preinstalled-rust
        run: |
          required='rustc 1.97.1 '
          exact=false
          if command -v rustup >/dev/null; then
            while read -r toolchain _; do
              if version=$(rustup run "$toolchain" rustc --version 2>/dev/null) &&
                [[ "$version" == "$required"* ]]; then
                sysroot=$(rustup run "$toolchain" rustc --print sysroot)
                echo "$sysroot/bin" >> "$GITHUB_PATH"
                echo "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" >> "$GITHUB_ENV"
                exact=true
                break
              fi
            done < <(rustup toolchain list)
          fi
          echo "exact=$exact" >> "$GITHUB_OUTPUT"

      - name: Install exact Rust toolchain
        if: steps.preinstalled-rust.outputs.exact != 'true'
        uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1

      - name: Install cargo-nextest
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-nextest@0.9.91
          fallback: none

      # Restore the dependency cache produced from trusted main. Merge-queue
      # refs are short-lived and must not consume the repository's 10 GiB cache
      # quota with immutable copies that no later candidate can restore.
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: . -> target
          shared-key: full-parity
          save-if: false

      - name: Run ${{ matrix.name }}
        env:
          SHARD_COMMAND: ${{ matrix.command }}
        run: bash -euo pipefail -c "$SHARD_COMMAND"

  windows-smoke:
    name: Windows smoke tests
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 15
    # A queue candidate may preempt the rolling trusted-main producer so the
    # bounded smoke job is not delayed behind the exact post-merge app build.
    concurrency:
      group: >-
        ${{ github.event_name == 'merge_group' && 'windows-landing-cache-rolling'
          || format('landing-windows-smoke-{0}', github.run_id) }}
      cancel-in-progress: ${{ github.event_name == 'merge_group' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1

      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-nextest@0.9.91
          fallback: none

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: windows-runtime-msvc
          save-if: false

      - name: Test the launcher and path resolution
        run: cargo nextest run -p clonk-game -p clonk-c4group -p clonk-platform -p clonk-core --locked --no-fail-fast

      - name: Test the Windows crash-log descriptor
        run: cargo nextest run -p clonk-logging --test crash_log_descriptor --locked

      # clonk-network carries a Windows-only `GetAdaptersAddresses` arm for the
      # IPv6 multicast discovery fallback; without it in a required gate the
      # arm compiles nowhere.
      - name: Test the Windows multicast discovery fallback
        run: cargo nextest run -p clonk-network --lib --locked -E 'test(/^search::tests::(discovery_multicast_target_uses_cpp_default_interface|an_accepted_default_multicast_join_enumerates_no_interfaces|a_refused_default_multicast_join_keeps_every_joinable_interface|a_scoped_join_set_sends_one_probe_per_joined_interface|an_unjoinable_host_still_probes_the_cpp_default_interface|the_cpp_default_interface_never_sets_ipv6_multicast_if|enumerated_multicast_interfaces_do_not_depend_on_kernel_listing_order)$/)'

      - name: Lint Windows paths
        run: cargo clippy --profile test --no-deps -p clonk-game -p clonk-c4group -p clonk-logging -p clonk-network -p clonk-platform -p clonk-core --all-targets --locked -- -D warnings

      - name: Install NSIS
        run: |
          nsis_url='https://downloads.sourceforge.net/project/nsis/NSIS%203/3.12/nsis-3.12.zip'
          nsis_sha256='56581f90db321581c5381193d796fffcf2d24b2f8fed2160a6c6a3baa67f2c4f'
          runner_temp=$(cygpath -u "$RUNNER_TEMP")
          archive="$runner_temp/nsis-3.12.zip"
          curl -fsSL --retry 5 --retry-all-errors \
            --output "$archive" "$nsis_url"
          actual_sha256=$(sha256sum "$archive" | cut -d' ' -f1)
          if [[ "$actual_sha256" != "$nsis_sha256" ]]; then
            echo "NSIS archive digest mismatch: expected $nsis_sha256, found $actual_sha256" >&2
            exit 1
          fi
          python3 -m zipfile -e "$archive" "$runner_temp"
          nsis_dir="$runner_temp/nsis-3.12"
          if [[ ! -x "$nsis_dir/makensis.exe" ]]; then
            echo "portable NSIS archive is missing $nsis_dir/makensis.exe" >&2
            exit 1
          fi
          nsis_version=$(MSYS2_ARG_CONV_EXCL='*' "$nsis_dir/makensis.exe" /VERSION | tr -d '\r')
          if [[ "$nsis_version" != 'v3.12' ]]; then
            echo "expected NSIS v3.12, found: $nsis_version" >&2
            exit 1
          fi
          echo "$(cygpath -w "$nsis_dir")" >> "$GITHUB_PATH"

      - name: Compile the installer over a stand-in payload
        run: |
          payload_dir=target/dist/clonk-rust
          mkdir -p "$payload_dir"/bin "$payload_dir"/planet "$payload_dir"/content
          echo stand-in > "$payload_dir/bin/clonk-game.exe"
          echo stand-in > "$payload_dir/bin/clonk-app.exe"
          echo stand-in > "$payload_dir/bin/c4group.exe"
          echo stand-in > "$payload_dir/planet/System.c4g.txt"
          echo stand-in > "$payload_dir/content/Objects.txt"
          echo stand-in > "$payload_dir/README.md"

          payload=$(cygpath -w "$PWD/$payload_dir")
          outfile=$(cygpath -w "$PWD/target/dist/stand-in-setup.exe")
          icon=$(cygpath -w "$PWD/crates/clonk-icon/res/windows/c4x.ico")
          makensis -NOCD \
            -DVERSION=0.0.0 \
            -DPAYLOAD="$payload" \
            -DOUTFILE="$outfile" \
            -DICON="$icon" \
            scripts/windows-installer.nsi
          test -s target/dist/stand-in-setup.exe

  landing-gate:
    name: Landing gate
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    needs:
      - pull-request-title
      - pull-request-quality
      - release-context
      - release-prebuild
      - release-build
      - release-qualification
      - linux
      - windows-smoke
    defaults:
      run:
        shell: bash
    steps:
      - name: Enforce landing results
        env:
          EVENT_NAME: ${{ github.event_name }}
          TITLE_RESULT: ${{ needs.pull-request-title.result }}
          QUALITY_RESULT: ${{ needs.pull-request-quality.result }}
          RELEASE_CONTEXT_RESULT: ${{ needs.release-context.result }}
          RELEASE_PREBUILD_RESULT: ${{ needs.release-prebuild.result }}
          RELEASE_BUILD_RESULT: ${{ needs.release-build.result }}
          RELEASE_QUALIFICATION_RESULT: ${{ needs.release-qualification.result }}
          IS_RELEASE: ${{ needs.release-context.outputs.release }}
          LINUX_RESULT: ${{ needs.linux.result }}
          WINDOWS_SMOKE_RESULT: ${{ needs.windows-smoke.result }}
        run: |
          failed=0
          require_result() {
            local name=$1 actual=$2 expected=$3
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::$name result was '$actual', expected '$expected'"
              failed=1
            fi
          }

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            require_result title "$TITLE_RESULT" success
            require_result quality "$QUALITY_RESULT" success
            require_result release-context "$RELEASE_CONTEXT_RESULT" skipped
            require_result release-prebuild "$RELEASE_PREBUILD_RESULT" skipped
            require_result release-build "$RELEASE_BUILD_RESULT" skipped
            require_result release-qualification "$RELEASE_QUALIFICATION_RESULT" skipped
            require_result linux "$LINUX_RESULT" skipped
            require_result windows-smoke "$WINDOWS_SMOKE_RESULT" skipped
          elif [[ "$EVENT_NAME" == "merge_group" ]]; then
            require_result title "$TITLE_RESULT" skipped
            require_result quality "$QUALITY_RESULT" skipped
            require_result release-context "$RELEASE_CONTEXT_RESULT" success
            case "$IS_RELEASE" in
              true)
                require_result release-prebuild "$RELEASE_PREBUILD_RESULT" success
                require_result release-build "$RELEASE_BUILD_RESULT" success
                require_result release-qualification "$RELEASE_QUALIFICATION_RESULT" success
                ;;
              false)
                require_result release-prebuild "$RELEASE_PREBUILD_RESULT" skipped
                require_result release-build "$RELEASE_BUILD_RESULT" skipped
                require_result release-qualification "$RELEASE_QUALIFICATION_RESULT" skipped
                ;;
              *)
                echo "::error::release context output was '$IS_RELEASE'"
                failed=1
                ;;
            esac
            require_result linux "$LINUX_RESULT" success
            require_result windows-smoke "$WINDOWS_SMOKE_RESULT" success
          else
            require_result title "$TITLE_RESULT" skipped
            require_result quality "$QUALITY_RESULT" skipped
            require_result release-context "$RELEASE_CONTEXT_RESULT" skipped
            require_result release-prebuild "$RELEASE_PREBUILD_RESULT" skipped
            require_result release-build "$RELEASE_BUILD_RESULT" skipped
            require_result release-qualification "$RELEASE_QUALIFICATION_RESULT" skipped
            require_result linux "$LINUX_RESULT" success
            require_result windows-smoke "$WINDOWS_SMOKE_RESULT" success
          fi
          exit "$failed"

      # The v0.9.4 release candidate took 1,797 seconds on its critical Windows
      # lane (Landing run 31343777447). This outer job measures the complete
      # reusable build action without adding its own runtime to that span.
      - name: Enforce release build latency
        if: github.event_name == 'merge_group' && needs.release-context.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_RELEASE_BUILD_SECONDS: '898'
          REPOSITORY: ${{ github.repository }}
        run: |
          response=$(gh api \
            "repos/${REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?filter=latest&per_page=100")
          elapsed=$(jq -er '
            def expected: [
              "Build release candidate / Package linux",
              "Build release candidate / Package macos",
              "Build release candidate / Package windows"
            ] | sort;
            if (.jobs | type) != "array"
              or (.total_count | type) != "number"
              or .total_count != (.jobs | length)
            then error("incomplete workflow job inventory")
            else .jobs end
            | map(select(.name | startswith("Build release candidate / "))) as $jobs
            | ($jobs | map(.name) | sort) as $names
            | if $names != expected
              then error("unexpected release-build job inventory: \($names | join(", "))")
              else $jobs end
            | if all(.[];
                .status == "completed"
                and .conclusion == "success"
                and (.started_at | type) == "string"
                and (.completed_at | type) == "string")
              then .
              else error("release-build job is incomplete or unsuccessful") end
            | ((map(.completed_at | fromdateiso8601) | max)
              - (map(.started_at | fromdateiso8601) | min))
            | if . < 0 or . != floor
              then error("invalid release-build elapsed time")
              else . end
          ' <<< "$response")
          if [[ ! "$elapsed" =~ ^[0-9]+$ ]]; then
            echo "invalid release build elapsed time: $elapsed" >&2
            exit 1
          fi
          if [[ "$elapsed" -gt "$MAX_RELEASE_BUILD_SECONDS" ]]; then
            echo "release build took ${elapsed}s, exceeding ${MAX_RELEASE_BUILD_SECONDS}s" >&2
            exit 1
          fi
          echo "release build completed in ${elapsed}s (limit ${MAX_RELEASE_BUILD_SECONDS}s)"
