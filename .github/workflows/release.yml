name: Release

# Tags, builds and publishes a release when a `chore: release <version>` commit
# lands on main — normally by merging the pull request that `release-prepare.yml`
# opened.
#
# Tagging, building and publishing are three jobs in ONE workflow rather than
# separate workflows joined by a tag push, because GitHub does not trigger
# workflows from events created with the built-in GITHUB_TOKEN: a tag pushed
# here would never fire an `on: push: tags` workflow.

on:
  # Release preparation lives in release-prepare.yml. This workflow only reacts
  # after its App-owned pull request has passed the merge queue and landed.
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # GitHub retains only one pending run per group even when cancellation is
  # disabled. Keep each real release in its own lane so an ordinary later push
  # cannot replace it before the resolver starts; no-op pushes may coalesce.
  group: "release-${{ startsWith(github.event.head_commit.message, 'chore: release ') && github.sha || 'rolling' }}"
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always

jobs:
  resolve:
    name: Resolve the version
    runs-on: ubuntu-latest
    timeout-minutes: 190
    # Read-only: nothing is tagged or published until the builds have passed.
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      release: ${{ steps.resolve.outputs.release }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The triggering commit, never `main`, whose tip moves while a build
          # is running.
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether this commit releases
        id: resolve
        env:
          # Via env, never interpolated into the script: a commit subject is
          # attacker-influencable text.
          HEAD_SUBJECT: ${{ github.event.head_commit.message }}
          # Only the push path infers intent from the commit subject. On the
          # schedule and dispatch paths `head_commit` is absent entirely, and
          # testing the subject there would reject every scheduled release.
          EVENT_NAME: ${{ github.event_name }}
          RESOLVED_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          subject=${HEAD_SUBJECT%%$'\n'*}
          if [[ "$EVENT_NAME" == "push" && "$subject" != "chore: release "* ]]; then
            echo "not a release commit: $subject"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version=$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path("Cargo.toml").read_text(encoding="utf-8")
          section = re.search(r"^\[workspace\.package\]$(.*?)(?=^\[)", text, re.M | re.S)
          print(re.search(r'^version = "([^"]+)"$', section.group(1), re.M).group(1))
          PY
          )

          # A completed release is idempotent. A tag with no release, or a
          # draft whose asset upload failed, must resume instead of abandoning
          # this version forever.
          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            tag_sha=$(git rev-list -n 1 "refs/tags/v${version}")
            if [[ "$tag_sha" != "$RESOLVED_SHA" ]]; then
              echo "v${version} points at ${tag_sha}, not ${RESOLVED_SHA}" >&2
              exit 1
            fi

            lookup_error="${RUNNER_TEMP}/release-lookup.err"
            set +e
            release_state=$(gh api \
              "repos/${REPOSITORY}/releases/tags/v${version}" \
              --jq '.draft' 2>"$lookup_error")
            lookup_status=$?
            set -e
            if [[ "$lookup_status" -ne 0 ]]; then
              if grep -q '(HTTP 404)' "$lookup_error"; then
                release_state=missing
              else
                cat "$lookup_error" >&2
                echo "looking up v${version} failed" >&2
                exit 1
              fi
            fi

            if [[ "$release_state" == "false" ]]; then
              echo "v${version} is already published; nothing to do"
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "$release_state" != "true" && "$release_state" != "missing" ]]; then
              echo "unexpected v${version} release state: ${release_state}" >&2
              exit 1
            fi
            echo "resuming incomplete v${version} publication"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "sha=$RESOLVED_SHA" >> "$GITHUB_OUTPUT"

      # Landing proves the merge tree; main validation retains the slower
      # coverage, recording-host and release-tool diagnostics. Both must belong
      # to this exact commit before any release artifact is built.
      - name: Require exact-SHA validation
        if: steps.resolve.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SHA: ${{ steps.resolve.outputs.sha }}
          CI_POLL_ATTEMPTS: '360'
          CI_POLL_SECONDS: '30'
        run: |
          for ((attempt = 1; attempt <= CI_POLL_ATTEMPTS; attempt++)); do
            waiting=0
            for workflow in landing.yml rust.yml; do
              if [[ "$workflow" == "landing.yml" ]]; then
                event=merge_group
              else
                event=push
              fi
              args=(
                run list
                --workflow "$workflow"
                --commit "$CI_SHA"
                --event "$event"
                --limit 1
                --json status,conclusion
                --jq 'if length == 0 then "missing" else "\(.[0].status):\(.[0].conclusion // "none")" end'
              )
              if [[ "$event" == "push" ]]; then
                args+=(--branch main)
              fi
              if ! verdict=$(gh "${args[@]}" 2>/dev/null); then
                echo "$workflow lookup failed for $CI_SHA; retrying"
                waiting=1
                continue
              fi
              [[ -n "$verdict" ]] || verdict=missing
              echo "$workflow $event verdict for $CI_SHA: $verdict"
              case "$verdict" in
                completed:success) ;;
                completed:*)
                  echo "refusing to release: $workflow is $verdict" >&2
                  exit 1
                  ;;
                missing|queued:none|requested:none|waiting:none|pending:none|in_progress:none)
                  waiting=1
                  ;;
                *)
                  echo "refusing to release: unexpected $workflow state '$verdict'" >&2
                  exit 1
                  ;;
              esac
            done
            if [[ "$waiting" -eq 0 ]]; then
              exit 0
            fi
            if [[ "$attempt" -lt "$CI_POLL_ATTEMPTS" ]]; then
              sleep "$CI_POLL_SECONDS"
            fi
          done
          echo "timed out waiting for exact-SHA landing and main validation" >&2
          exit 1

  build:
    name: Build ${{ matrix.name }}
    needs: resolve
    if: needs.resolve.outputs.release == 'true'
    runs-on: ${{ matrix.runner }}
    # The Windows pass is the long pole: a native release build, a 299 MB
    # submodule checkout and solid-LZMA compression of the whole payload, all
    # on the slowest runner class.
    timeout-minutes: 120
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: ubuntu-latest
            artifact: desktop-linux
          # Windows used to be cross-compiled from the ubuntu pass with mingw,
          # because this repository was private and Windows runners billed at
          # 2x. It is public now, so they are free — and building natively
          # means the toolchain that the landing gate tests is finally the
          # toolchain that ships.
          - name: windows
            runner: windows-latest
            artifact: desktop-windows
          - name: macos
            runner: macos-latest
            artifact: desktop-macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The resolved commit, not a tag: no tag exists yet. Nothing is
          # tagged until these builds have produced real artifacts.
          ref: ${{ needs.resolve.outputs.sha }}
          # Packaging copies the tracked game data, so the submodule is required.
          # This works only while clonk-rs-content is public.
          submodules: recursive
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: release-${{ matrix.artifact }}
          cache-on-failure: true

      - name: Install Linux build dependencies
        if: matrix.runner == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libasound2-dev \
            libudev-dev \
            pkg-config

      # `makensis` is not on the Windows image. Chocolatey's `nsis` package
      # runs the upstream installer rather than shimming a binary, so its
      # directory goes on PATH by hand — which only affects *later* steps,
      # hence the existence check here rather than a version probe.
      - name: Install the Windows installer toolchain
        if: matrix.runner == 'windows-latest'
        run: |
          choco install nsis --version 3.12.0 --yes --no-progress
          nsis_dir='/c/Program Files (x86)/NSIS'
          if [[ ! -x "$nsis_dir/makensis.exe" ]]; then
            echo "chocolatey installed nsis but $nsis_dir/makensis.exe is missing" >&2
            exit 1
          fi
          nsis_version=$(MSYS2_ARG_CONV_EXCL='*' "$nsis_dir/makensis.exe" /VERSION | tr -d '\r')
          if [[ "$nsis_version" != 'v3.12' ]]; then
            echo "expected NSIS v3.12, found: $nsis_version" >&2
            exit 1
          fi
          echo 'C:\Program Files (x86)\NSIS' >> "$GITHUB_PATH"

      # The macOS pass ships one universal `.app`, so it builds both
      # architectures and `lipo`s them together. The runner is arm64, so only
      # the Intel half needs installing.
      - name: Install macOS cross target
        if: matrix.runner == 'macos-latest'
        run: rustup target add x86_64-apple-darwin

      # Built natively first and then invoked directly. Running
      # `cargo run -p xtask` with CARGO_BUILD_TARGET set would build the tool
      # *for the target* and fail to execute it.
      - name: Build the packaging tool
        run: cargo build --release --locked -p xtask --features engine-tools --bin xtask-engine-tools

      - name: Configure the shipped MSVC runtime
        if: matrix.runner == 'windows-latest'
        run: scripts/configure-msvc-runtime.sh

      - name: Restore shipped MSVC dependency cache
        if: matrix.runner == 'windows-latest'
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: shipped-msvc-runtime-v1
          save-if: false

      # The only pass that emits `planet`. Its archive is prefix-free and
      # therefore byte-identical on every triple, so emitting it from every pass
      # would spend the time to produce exact duplicates. `content` is not
      # emitted by any pass — clonk-org/clonk-rs-content publishes it.
      - name: Package Linux
        if: matrix.runner == 'ubuntu-latest'
        run: ./target/release/xtask-engine-tools package --components=all

      - name: Package Windows installer
        if: matrix.runner == 'windows-latest'
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          # freetype-sys hardcodes a relative `libz-sys/src/zlib` include that
          # does not exist in its published crate, so its bundled libpng only
          # finds zlib.h where the host happens to ship one. No Windows
          # toolchain does. Resolved dynamically rather than pinned to a
          # libz-sys version.
          cargo fetch --locked
          zlib_dir=$(find "${CARGO_HOME:-$HOME/.cargo}/registry/src" -maxdepth 2 -type d -name 'libz-sys-*' | head -1)/src/zlib
          if [[ ! -f "$zlib_dir/zlib.h" ]]; then
            echo "could not locate the vendored zlib headers under $zlib_dir" >&2
            exit 1
          fi
          export CFLAGS_x86_64_pc_windows_msvc="-I$zlib_dir"
          ./target/release/xtask-engine-tools.exe package --no-archive --components=engine

          # Native paths for a native tool: under Git Bash `$PWD` is a POSIX
          # path makensis cannot resolve, and leaving it to MSYS's implicit
          # argument rewriting would make the build depend on its heuristics.
          # The switches keep their `-` prefix for the same reason — `/NOCD`
          # would be rewritten as a path.
          payload=$(cygpath -w "$PWD/target/dist/clonk-rust")
          outfile=$(cygpath -w "$PWD/target/dist/clonk-rust-$VERSION-x86_64-windows-setup.exe")
          # `package` writes this beside the payload; the installer and
          # uninstaller are separate executables and need their own copy.
          icon=$(cygpath -w "$PWD/target/dist/clonk-rust-installer.ico")
          makensis -NOCD \
            -DVERSION="$VERSION" \
            -DPAYLOAD="$payload" \
            -DOUTFILE="$outfile" \
            -DICON="$icon" \
            scripts/windows-installer.nsi

      - name: Validate the shipped MSVC runtime
        if: matrix.runner == 'windows-latest'
        run: scripts/validate-msvc-runtime.sh

      # One pass, not one per architecture: the two builds differ only in ~20 MB
      # of executables, so a second disk image was ~340 MB of identical game
      # data. `package` builds both arches and fuses them itself, so this emits
      # one `.dmg` and one `engine` component for both macOS triples.
      - name: Package macOS
        if: matrix.runner == 'macos-latest'
        env:
          # Named rather than inferred. On a toolchain missing an architecture
          # `package` falls back to a single-architecture build — right for a
          # contributor running the README's command, wrong for a release — and
          # an explicitly named target is never downgraded. So a runner whose
          # `rustup target add` silently failed stops here, instead of
          # publishing a thin `.app` under a name promising both. Every cargo
          # invocation this triggers passes `--target` itself, which overrides
          # this variable; nothing builds *for* the pseudo-triple.
          CARGO_BUILD_TARGET: universal-apple-darwin
        run: ./target/release/xtask-engine-tools package --components=engine

      # `lipo` invalidates the signature of the slices it fuses, so the bundle
      # is signed afterwards, on the universal binaries. `package` already fails
      # if `codesign --verify --deep --strict` does; this is the other half —
      # that the thing it signed is actually fat. A single-arch regression is
      # invisible on an arm64 runner, and would ship a build no Intel Mac runs.
      - name: Check the macOS build is universal
        if: matrix.runner == 'macos-latest'
        run: |
          shopt -s nullglob
          engines=(target/dist/components/update-engine-*-universal-apple-darwin.zip)
          if [[ ${#engines[@]} -ne 1 ]]; then
            echo "expected exactly one universal engine component, found ${#engines[@]}" >&2
            exit 1
          fi
          rm -rf target/dist/universal-check
          unzip -q "${engines[0]}" -d target/dist/universal-check
          for binary in clonk-app clonk-game c4group; do
            path="target/dist/universal-check/Contents/MacOS/$binary"
            info=$(lipo -info "$path")
            echo "$info"
            for arch in arm64 x86_64; do
              case "$info" in
                *" $arch"*) ;;
                *) echo "$binary is missing the $arch slice" >&2; exit 1 ;;
              esac
            done
          done
          rm -rf target/dist/universal-check

      - name: Check the artifacts look real
        run: |
          shopt -s nullglob
          assets=(target/dist/clonk-rust-*.zip target/dist/clonk-rust-*.dmg target/dist/clonk-rust-*.exe)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "packaging produced no assets" >&2
            exit 1
          fi
          for asset in "${assets[@]}"; do
            size=$(wc -c < "$asset")
            # The payload is ~240 MB of game data; anything tiny means the
            # packaging silently produced an empty container.
            if [[ "$size" -lt 100000000 ]]; then
              echo "$asset is only $size bytes" >&2
              exit 1
            fi
            echo "ok $(basename "$asset") $size bytes"
          done

      # A gate of its own, because the 100 MB floor above is a statement about
      # whole-payload archives and would reject every update component.
      # These floors are per kind and deliberately far below the real sizes:
      # they catch an empty container, not a few megabytes of drift.
      - name: Check the update components look real
        run: |
          shopt -s nullglob
          components=(target/dist/components/*.zip)
          if [[ ${#components[@]} -eq 0 ]]; then
            echo "packaging produced no update components" >&2
            exit 1
          fi
          for component in "${components[@]}"; do
            name=$(basename "$component")
            case "$name" in
              update-planet-*) floor=10000000 ;;
              # The macOS engine carries two architectures, so its floor is
              # twice the others'. Still only an empty-container check — that
              # both slices are really present is what `lipo -info` proves, in
              # the step above.
              update-engine-*-universal-*) floor=10000000 ;;
              update-engine-*) floor=5000000 ;;
              # `content-*` is deliberately not here: that archive is built and
              # published by clonk-org/clonk-rs-content, and a second builder of
              # content-addressed bytes is exactly what must not exist. The
              # manifest generator refuses one too.
              *) echo "$name matches no known update component" >&2; exit 1 ;;
            esac
            size=$(wc -c < "$component")
            if [[ "$size" -lt "$floor" ]]; then
              echo "$name is only $size bytes, below the $floor floor" >&2
              exit 1
            fi
            echo "ok $name $size bytes"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/dist/clonk-rust-*.zip
            target/dist/clonk-rust-*.dmg
            target/dist/clonk-rust-*.exe
          if-no-files-found: error
          retention-days: 7

      # Its own artifact rather than another line in the glob above:
      # upload-artifact roots the archive at the least common ancestor of the
      # files it matched, so adding `target/dist/components/*.zip` there would
      # move every existing asset into a subdirectory and silently change what
      # `merge-multiple` produces in `publish`.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: components-${{ matrix.artifact }}
          path: target/dist/components/*.zip
          if-no-files-found: error
          retention-days: 7

      # `publish` generates the manifest with this binary instead of compiling
      # xtask a third time. It runs on ubuntu, which is where this was built.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.runner == 'ubuntu-latest'
        with:
          name: release-tool
          path: target/release/xtask-engine-tools
          if-no-files-found: error
          retention-days: 7

  # Tags only now, once every platform has produced a real artifact. Tagging
  # before the builds would strand `vX.Y.Z` on a commit that cannot package —
  # a tag is permanent, so the version has to be abandoned to recover.
  publish:
    name: Tag and publish
    needs: [resolve, build]
    if: needs.resolve.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The exact commit that was built, so the tag names the tree the
          # assets came from even if main has moved on during the build.
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Scoped by pattern rather than downloading everything: merging into one
      # directory is what the whole-payload globs below rely on, and the
      # component and tool artifacts must not land in it.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: assets
          pattern: desktop-*
          merge-multiple: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: components
          pattern: components-*
          merge-multiple: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-tool
          path: release-tool

      # `content.zip` is built and published by the repository the game data
      # lives in, so this release references that artifact instead of
      # re-uploading 225 MB of unchanged bytes daily. Resolving it here — before
      # the tag — is also the link check: a content release deleted across a
      # repository boundary would otherwise be discovered by clients, one failed
      # update at a time.
      - name: Resolve the published content release
        id: content
        env:
          GH_TOKEN: ${{ github.token }}
          CONTENT_REPOSITORY: clonk-org/clonk-rs-content
        run: |
          # The submodule is not checked out in this job; this reads the gitlink
          # straight out of the commit's tree, which *is* the pin. The content
          # repository tags one release per commit, so the pin resolves with no
          # lookup table in between.
          commit=$(git rev-parse "HEAD:content")
          tag="content-${commit}"
          echo "content is pinned at ${commit}"

          # `gh api` exits non-zero for every failure alike, so the status it
          # reports is what tells them apart. Only 404 means the release is
          # genuinely absent; a bad token, a rate limit, a network blip or the
          # content repository being made private are lookups that never
          # happened, and reporting those as "no release" sends whoever reads
          # the log to push a commit that is already pushed. Both still fail —
          # the release cannot proceed either way — but they say which it was.
          lookup_error="${RUNNER_TEMP}/content-lookup.err"
          set +e
          release=$(gh api "repos/${CONTENT_REPOSITORY}/releases/tags/${tag}" 2>"$lookup_error")
          lookup_status=$?
          set -e
          if [[ "$lookup_status" -ne 0 ]]; then
            cat "$lookup_error" >&2
            if grep -q '(HTTP 404)' "$lookup_error"; then
              echo "${CONTENT_REPOSITORY} has no ${tag} release" >&2
              echo "push that content commit to its main branch so the publish workflow runs" >&2
            else
              # Deliberately not the message above: this is not a missing
              # release, and an unrecognised failure must not be diagnosed as
              # one.
              echo "looking up ${tag} in ${CONTENT_REPOSITORY} failed" >&2
            fi
            exit 1
          fi

          size=$(jq -r '.assets[] | select(.name == "content.zip") | .size' <<<"$release")
          if [[ ! "$size" =~ ^[0-9]+$ ]]; then
            echo "${tag} exists but publishes no content.zip" >&2
            exit 1
          fi

          base="https://github.com/${CONTENT_REPOSITORY}/releases/download/${tag}"
          digest=$(curl -fsSL --retry 3 --retry-delay 5 "${base}/content.sha256" | cut -d' ' -f1)
          # Lowercase, matching `is_sha256_hex` in xtask: the manifest records
          # this verbatim and a client compares it as text.
          if [[ ! "$digest" =~ ^[0-9a-f]{64}$ ]]; then
            echo "content.sha256 in ${tag} is not a lowercase digest: ${digest}" >&2
            exit 1
          fi

          echo "resolved ${tag}: ${digest} (${size} bytes)"
          {
            echo "commit=${commit}"
            echo "sha256=${digest}"
            echo "size=${size}"
            echo "base=${base}"
          } >> "$GITHUB_OUTPUT"

      # Everything above is the producer's own account of its upload: the size
      # comes from the release API and the digest from a sidecar written beside
      # the archive. Nothing had ever compared either to the bytes, and with no
      # manifest signature that digest is the whole integrity story for 225 MB —
      # so a truncated, corrupted or mismatched content release would be
      # recorded as authoritative and discovered by clients, each after a 225 MB
      # download that then fails its own check.
      #
      # Downloading it here costs a couple of runner-minutes on a job that
      # already pulls ~1 GB of build artifacts. It runs before the tag and
      # before `gh release create`, so a bad content release fails the run
      # instead of stranding `vX.Y.Z` on a commit that can never be released.
      - name: Verify the published content archive
        env:
          CONTENT_BASE: ${{ steps.content.outputs.base }}
          CONTENT_SHA256: ${{ steps.content.outputs.sha256 }}
          CONTENT_SIZE: ${{ steps.content.outputs.size }}
        run: |
          # Into RUNNER_TEMP, not the workspace: `assets/` and `components/` are
          # globbed wholesale into the release, and a stray 225 MB archive there
          # would be published as one of this repository's own assets — exactly
          # the duplicate upload that referencing the content release removed.
          #
          # The same URL and the same redirect a client follows, so this also
          # subsumes the one-byte reachability probe that used to stand in for
          # a real fetch.
          archive="${RUNNER_TEMP}/content.zip"
          curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors \
            --output "$archive" "${CONTENT_BASE}/content.zip"

          # Numeric, not string: `wc` pads its output on some platforms, and the
          # resolve step has already proved both sides are digits.
          actual_size=$(wc -c < "$archive")
          if [[ "$actual_size" -ne "$CONTENT_SIZE" ]]; then
            echo "content.zip is ${actual_size} bytes but the release API says ${CONTENT_SIZE}" >&2
            exit 1
          fi

          actual_sha256=$(sha256sum "$archive" | cut -d' ' -f1)
          if [[ "$actual_sha256" != "$CONTENT_SHA256" ]]; then
            echo "content.zip hashes to ${actual_sha256}" >&2
            echo "but content.sha256 claims ${CONTENT_SHA256}" >&2
            echo "refusing to publish a manifest pointing at unverified bytes" >&2
            exit 1
          fi

          echo "verified content.zip: ${actual_sha256} (${actual_size} bytes)"
          # The rest of the job has no use for it, and the runner still has to
          # hold every platform's assets.
          rm -f "$archive"

      # Before the tag: a manifest that cannot be generated must not strand
      # `vX.Y.Z` on a commit whose release can then never be completed.
      - name: Generate the update manifest
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          CONTENT_COMMIT: ${{ steps.content.outputs.commit }}
          CONTENT_SHA256: ${{ steps.content.outputs.sha256 }}
          CONTENT_SIZE: ${{ steps.content.outputs.size }}
        run: |
          # upload-artifact does not preserve the executable bit.
          chmod +x release-tool/xtask-engine-tools
          # Publish time, which is the client's replay guard: a manifest older
          # than the one already applied is refused.
          released_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # Refuses to write anything unless all six triples in
          # UPDATE_TARGET_TRIPLES can complete an install, so a build pass that
          # uploaded nothing fails here.
          ./release-tool/xtask-engine-tools update-manifest generate \
            --version "$VERSION" \
            --released-at "$released_at" \
            --components components \
            --out-dir manifest \
            --content-commit "$CONTENT_COMMIT" \
            --content-sha256 "$CONTENT_SHA256" \
            --content-size "$CONTENT_SIZE"
          cat manifest/manifest.json

      # Created through the API rather than `git push`. GITHUB_TOKEN is refused
      # any ref push whose commits add or update a file under
      # `.github/workflows/`, and there is no permission that grants it — so a
      # release whose history happens to touch a workflow could never be
      # tagged. The commit itself is already on main, pushed by a human token;
      # this only points a ref at it, which the restriction does not cover.
      - name: Tag the built commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
          SHA: ${{ needs.resolve.outputs.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # Idempotent: a re-run after a partial publish must not fail here.
          if gh api "repos/${REPOSITORY}/git/ref/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "v${VERSION} is already tagged"
            exit 0
          fi

          # Annotated, matching what `git tag -a` produced before: a tag object
          # first, then the ref that points at it.
          tag_sha=$(gh api "repos/${REPOSITORY}/git/tags" \
            -f tag="v${VERSION}" \
            -f message="v${VERSION}" \
            -f object="${SHA}" \
            -f type=commit \
            --jq '.sha')

          gh api "repos/${REPOSITORY}/git/refs" \
            -f ref="refs/tags/v${VERSION}" \
            -f sha="${tag_sha}" >/dev/null

          echo "tagged v${VERSION} at ${SHA}"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          # Release notes: this version's CHANGELOG.md section, without heading.
          python3 - "$VERSION" > release-notes.md <<'PY'
          import sys
          from pathlib import Path

          version = sys.argv[1]
          lines = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          start = next(
              (i for i, line in enumerate(lines) if line.startswith(f"## [{version}]")),
              None,
          )
          if start is None:
              print(f"Release v{version}.")
          else:
              end = next(
                  (i for i in range(start + 1, len(lines)) if lines[i].startswith("## [")),
                  len(lines),
              )
              print("\n".join(lines[start + 1 : end]).strip())
          PY

          # No SHA256SUMS.txt. Releases here are published immutable, and GitHub
          # attests them: a Sigstore bundle binding each asset digest to the run
          # that produced it, fetched by digest with
          #
          #   gh api repos/{repo}/attestations/sha256:{digest}
          #
          # Deliberately not `gh attestation verify`. That command looks for
          # SLSA build provenance over an artifact and 404s here — the immutable
          # release predicate is `https://in-toto.io/attestation/release/v0.2`,
          # whose subject is the release rather than any one file, so it does
          # not match even when asked for by name.
          #
          # The sums file added nothing this does not: it sat beside the assets
          # it vouched for, so whoever could replace an asset could replace the
          # sums. Nothing read it either — a client checks each component
          # against the SHA-256 in `manifest.json`, and `content.zip` against
          # the `content.sha256` its own repository publishes.

          # Create a draft first so a failed asset upload is never public and a
          # rerun can repair it. Publish only after the whole payload exists, so
          # `latest/download/manifest.json` cannot resolve before its archives.
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" \
              assets/clonk-rust-* \
              components/*.zip manifest/manifest.json --clobber
            gh release edit "v${VERSION}" --draft=false --latest
          else
            gh release create "v${VERSION}" --draft \
              --title "Clonk Rust ${VERSION}" \
              --notes-file release-notes.md \
              assets/clonk-rust-* \
              components/*.zip manifest/manifest.json
            gh release edit "v${VERSION}" --draft=false --latest
          fi
