name: Release

# Promotes the exact artifacts already built by a release commit's successful
# merge-group Landing run, then tags and publishes that commit. Release builds
# happen before merge so this post-merge path stays below two minutes.

on:
  # Release preparation lives in release-prepare.yml. This workflow only reacts
  # after its App-owned pull request has passed the merge queue and landed.
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # GitHub retains only one pending run per group even when cancellation is
  # disabled. Keep each real release in its own lane so an ordinary later push
  # cannot replace it before the resolver starts; no-op pushes may coalesce.
  group: "release-${{ startsWith(github.event.head_commit.message, 'chore: release ') && github.sha || 'rolling' }}"
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Tag and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
      pull-requests: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The triggering commit, never `main`, whose tip moves while a build
          # is running.
          ref: ${{ github.sha }}
          # Release metadata lives in this tree. Tag idempotency is checked
          # through the API below, so downloading the repository's complete
          # history and tag set would spend most of the publication budget for
          # no consumer.
          fetch-depth: 1
          persist-credentials: false

      - name: Decide whether this commit releases
        id: resolve
        env:
          # Via env, never interpolated into the script: a commit subject is
          # attacker-influencable text.
          HEAD_SUBJECT: ${{ github.event.head_commit.message }}
          # Only the push path infers intent from the commit subject. On the
          # schedule and dispatch paths `head_commit` is absent entirely, and
          # testing the subject there would reject every scheduled release.
          EVENT_NAME: ${{ github.event_name }}
          RESOLVED_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          subject=${HEAD_SUBJECT%%$'\n'*}
          if [[ "$EVENT_NAME" == "push" && "$subject" != "chore: release "* ]]; then
            echo "not a release commit: $subject"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$RESOLVED_SHA" >> "$GITHUB_OUTPUT"

          # A completed release is idempotent. A tag with no release, or a
          # draft whose asset upload failed, must resume instead of abandoning
          # this version forever.
          tag_lookup_error="${RUNNER_TEMP}/tag-lookup.err"
          set +e
          tag_object=$(gh api \
            "repos/${REPOSITORY}/git/ref/tags/v${version}" \
            --jq '[.object.type, .object.sha] | @tsv' 2>"$tag_lookup_error")
          tag_lookup_status=$?
          set -e
          if [[ "$tag_lookup_status" -ne 0 ]]; then
            if grep -q '(HTTP 404)' "$tag_lookup_error"; then
              tag_object=
            else
              cat "$tag_lookup_error" >&2
              echo "looking up tag v${version} failed" >&2
              exit 1
            fi
          fi

          if [[ -n "$tag_object" ]]; then
            IFS=$'\t' read -r tag_type tag_sha <<<"$tag_object"
            if [[ "$tag_type" == "tag" ]]; then
              tag_sha=$(gh api \
                "repos/${REPOSITORY}/git/tags/${tag_sha}" --jq '.object.sha')
            elif [[ "$tag_type" != "commit" ]]; then
              echo "v${version} has unexpected git object type ${tag_type}" >&2
              exit 1
            fi
            if [[ "$tag_sha" != "$RESOLVED_SHA" ]]; then
              echo "v${version} points at ${tag_sha}, not ${RESOLVED_SHA}" >&2
              exit 1
            fi

            lookup_error="${RUNNER_TEMP}/release-lookup.err"
            set +e
            release_state=$(gh api \
              "repos/${REPOSITORY}/releases/tags/v${version}" \
              --jq '.draft' 2>"$lookup_error")
            lookup_status=$?
            set -e
            if [[ "$lookup_status" -ne 0 ]]; then
              if grep -q '(HTTP 404)' "$lookup_error"; then
                release_state=missing
              else
                cat "$lookup_error" >&2
                echo "looking up v${version} failed" >&2
                exit 1
              fi
            fi

            if [[ "$release_state" == "false" ]]; then
              echo "v${version} is already published; nothing to do"
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "$release_state" != "true" && "$release_state" != "missing" ]]; then
              echo "unexpected v${version} release state: ${release_state}" >&2
              exit 1
            fi
            echo "resuming incomplete v${version} publication"
          fi

          echo "release=true" >> "$GITHUB_OUTPUT"

      # A release merge group cannot pass Landing until every platform has
      # built and uploaded its exact-SHA artifacts. The landed commit has the
      # same SHA, so publication promotes those immutable artifacts instead of
      # serializing another validation pass and another set of builds here.
      - name: Resolve exact-SHA release artifacts
        id: artifacts
        if: steps.resolve.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SHA: ${{ steps.resolve.outputs.sha }}
          REPOSITORY: ${{ github.repository }}
          # Landing has already concluded successfully before this push can
          # exist. Allow brief API-index lag, but keep the full retry envelope
          # within the measured two-minute publication budget.
          CI_POLL_ATTEMPTS: '5'
          CI_POLL_SECONDS: '1'
        run: |
          expected_payloads=(
            desktop-linux
            desktop-windows
            desktop-macos
            components-desktop-linux
            components-desktop-windows
            components-desktop-macos
            release-tool
          )
          coverage_fragment_suffixes=(
            app-1-10
            app-2-7
            app-3
            app-4-9
            app-5
            app-11-12
            app-6-8
            engine-1
            engine-2-3
            engine-and-frontend-units
            remaining-1
            remaining-2
          )

          for ((attempt = 1; attempt <= CI_POLL_ATTEMPTS; attempt++)); do
            if ! runs=$(gh run list \
              --repo "$REPOSITORY" \
              --workflow landing.yml \
              --commit "$CI_SHA" \
              --event merge_group \
              --limit 20 \
              --json databaseId,headSha,status,conclusion \
              --jq '.[] | [.databaseId, .headSha, .status, (.conclusion // "none")] | @tsv' \
              2>/dev/null); then
              echo "landing run lookup failed for $CI_SHA; retrying"
              runs=
            fi

            while IFS=$'\t' read -r run_id head_sha status conclusion; do
              [[ -n "$run_id" ]] || continue
              if [[ "$head_sha" != "$CI_SHA" || "$status" != "completed" || "$conclusion" != "success" ]]; then
                continue
              fi
              if ! artifacts=$(gh api \
                "repos/${REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" \
                2>/dev/null); then
                echo "artifact lookup failed for Landing run $run_id; retrying"
                continue
              fi

              expected_artifacts=("${expected_payloads[@]}")
              for suffix in "${coverage_fragment_suffixes[@]}"; do
                expected_artifacts+=("rust-coverage-fragment-${run_id}-${suffix}")
              done
              expected_inventory=$(printf '%s\tfalse\n' "${expected_artifacts[@]}" | LC_ALL=C sort)
              # Failed-shard diagnostics use the same Landing run so they can
              # be downloaded with the release qualification logs. They are
              # deliberately outside the immutable release payload contract;
              # filter only this run's diagnostic prefix before the exact
              # payload/coverage comparison.
              diagnostic_prefix="rust-test-diagnostics-${run_id}-"
              actual_inventory=$(jq -r --arg diagnostic_prefix "$diagnostic_prefix" \
                '.artifacts[] | select((.name | startswith($diagnostic_prefix)) == false) | [.name, (.expired | tostring)] | @tsv' \
                <<<"$artifacts" | LC_ALL=C sort)
              if [[ "$actual_inventory" == "$expected_inventory" ]]; then
                echo "resolved exact-SHA artifacts from Landing run $run_id"
                echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "Landing run $run_id artifact inventory is not exact"
              diff -u \
                <(printf '%s\n' "$expected_inventory") \
                <(printf '%s\n' "$actual_inventory") || true
            done <<<"$runs"

            if [[ "$attempt" -lt "$CI_POLL_ATTEMPTS" ]]; then
              sleep "$CI_POLL_SECONDS"
            fi
          done
          echo "timed out resolving successful exact-SHA Landing artifacts" >&2
          exit 1

      # Scoped by pattern rather than downloading everything: merging into one
      # directory is what the whole-payload globs below rely on, and the
      # component and tool artifacts must not land in it.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.resolve.outputs.release == 'true'
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.artifacts.outputs.run-id }}
          path: assets
          pattern: desktop-*
          merge-multiple: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.resolve.outputs.release == 'true'
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.artifacts.outputs.run-id }}
          path: components
          pattern: components-*
          merge-multiple: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.resolve.outputs.release == 'true'
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.artifacts.outputs.run-id }}
          name: release-tool
          path: release-tool

      # `content.zip` is built and published by the repository the game data
      # lives in, so this release references that artifact instead of
      # re-uploading 225 MB of unchanged bytes daily. Resolving it here — before
      # the tag — is also the link check: a content release deleted across a
      # repository boundary would otherwise be discovered by clients, one failed
      # update at a time.
      - name: Resolve the published content release
        if: steps.resolve.outputs.release == 'true'
        id: content
        env:
          GH_TOKEN: ${{ github.token }}
          CONTENT_REPOSITORY: clonk-org/clonk-rs-content
        run: |
          # The submodule is not checked out in this job; this reads the gitlink
          # straight out of the commit's tree, which *is* the pin. The content
          # repository tags one release per commit, so the pin resolves with no
          # lookup table in between.
          commit=$(git rev-parse "HEAD:content")
          tag="content-${commit}"
          echo "content is pinned at ${commit}"

          # `gh api` exits non-zero for every failure alike, so the status it
          # reports is what tells them apart. Only 404 means the release is
          # genuinely absent; a bad token, a rate limit, a network blip or the
          # content repository being made private are lookups that never
          # happened, and reporting those as "no release" sends whoever reads
          # the log to push a commit that is already pushed. Both still fail —
          # the release cannot proceed either way — but they say which it was.
          lookup_error="${RUNNER_TEMP}/content-lookup.err"
          set +e
          release=$(gh api "repos/${CONTENT_REPOSITORY}/releases/tags/${tag}" 2>"$lookup_error")
          lookup_status=$?
          set -e
          if [[ "$lookup_status" -ne 0 ]]; then
            cat "$lookup_error" >&2
            if grep -q '(HTTP 404)' "$lookup_error"; then
              echo "${CONTENT_REPOSITORY} has no ${tag} release" >&2
              echo "push that content commit to its main branch so the publish workflow runs" >&2
            else
              # Deliberately not the message above: this is not a missing
              # release, and an unrecognised failure must not be diagnosed as
              # one.
              echo "looking up ${tag} in ${CONTENT_REPOSITORY} failed" >&2
            fi
            exit 1
          fi

          size=$(jq -r '.assets[] | select(.name == "content.zip") | .size' <<<"$release")
          if [[ ! "$size" =~ ^[0-9]+$ ]]; then
            echo "${tag} exists but publishes no content.zip" >&2
            exit 1
          fi

          base="https://github.com/${CONTENT_REPOSITORY}/releases/download/${tag}"
          digest=$(curl -fsSL --retry 3 --retry-delay 5 "${base}/content.sha256" | cut -d' ' -f1)
          # Lowercase, matching `is_sha256_hex` in xtask: the manifest records
          # this verbatim and a client compares it as text.
          if [[ ! "$digest" =~ ^[0-9a-f]{64}$ ]]; then
            echo "content.sha256 in ${tag} is not a lowercase digest: ${digest}" >&2
            exit 1
          fi

          echo "resolved ${tag}: ${digest} (${size} bytes)"
          {
            echo "commit=${commit}"
            echo "sha256=${digest}"
            echo "size=${size}"
            echo "base=${base}"
          } >> "$GITHUB_OUTPUT"

      # Everything above is the producer's own account of its upload: the size
      # comes from the release API and the digest from a sidecar written beside
      # the archive. Nothing had ever compared either to the bytes, and with no
      # manifest signature that digest is the whole integrity story for 225 MB —
      # so a truncated, corrupted or mismatched content release would be
      # recorded as authoritative and discovered by clients, each after a 225 MB
      # download that then fails its own check.
      #
      # Downloading it here costs a couple of runner-minutes on a job that
      # already pulls ~1 GB of build artifacts. It runs before the tag and
      # before `gh release create`, so a bad content release fails the run
      # instead of stranding `vX.Y.Z` on a commit that can never be released.
      - name: Verify the published content archive
        if: steps.resolve.outputs.release == 'true'
        env:
          CONTENT_BASE: ${{ steps.content.outputs.base }}
          CONTENT_SHA256: ${{ steps.content.outputs.sha256 }}
          CONTENT_SIZE: ${{ steps.content.outputs.size }}
        run: |
          # Into RUNNER_TEMP, not the workspace: `assets/` and `components/` are
          # globbed wholesale into the release, and a stray 225 MB archive there
          # would be published as one of this repository's own assets — exactly
          # the duplicate upload that referencing the content release removed.
          #
          # The same URL and the same redirect a client follows, so this also
          # subsumes the one-byte reachability probe that used to stand in for
          # a real fetch.
          archive="${RUNNER_TEMP}/content.zip"
          curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors \
            --output "$archive" "${CONTENT_BASE}/content.zip"

          # Numeric, not string: `wc` pads its output on some platforms, and the
          # resolve step has already proved both sides are digits.
          actual_size=$(wc -c < "$archive")
          if [[ "$actual_size" -ne "$CONTENT_SIZE" ]]; then
            echo "content.zip is ${actual_size} bytes but the release API says ${CONTENT_SIZE}" >&2
            exit 1
          fi

          actual_sha256=$(sha256sum "$archive" | cut -d' ' -f1)
          if [[ "$actual_sha256" != "$CONTENT_SHA256" ]]; then
            echo "content.zip hashes to ${actual_sha256}" >&2
            echo "but content.sha256 claims ${CONTENT_SHA256}" >&2
            echo "refusing to publish a manifest pointing at unverified bytes" >&2
            exit 1
          fi

          echo "verified content.zip: ${actual_sha256} (${actual_size} bytes)"
          # The rest of the job has no use for it, and the runner still has to
          # hold every platform's assets.
          rm -f "$archive"

      # Before the tag: a manifest that cannot be generated must not strand
      # `vX.Y.Z` on a commit whose release can then never be completed.
      - name: Generate the update manifest
        if: steps.resolve.outputs.release == 'true'
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          CONTENT_COMMIT: ${{ steps.content.outputs.commit }}
          CONTENT_SHA256: ${{ steps.content.outputs.sha256 }}
          CONTENT_SIZE: ${{ steps.content.outputs.size }}
        run: |
          # upload-artifact does not preserve the executable bit.
          chmod +x release-tool/xtask-engine-tools
          # Publish time, which is the client's replay guard: a manifest older
          # than the one already applied is refused.
          released_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # Refuses to write anything unless all six triples in
          # UPDATE_TARGET_TRIPLES can complete an install, so a build pass that
          # uploaded nothing fails here.
          ./release-tool/xtask-engine-tools update-manifest generate \
            --version "$VERSION" \
            --released-at "$released_at" \
            --components components \
            --out-dir manifest \
            --content-commit "$CONTENT_COMMIT" \
            --content-sha256 "$CONTENT_SHA256" \
            --content-size "$CONTENT_SIZE"
          cat manifest/manifest.json

      # Created through the API rather than `git push`. GITHUB_TOKEN is refused
      # any ref push whose commits add or update a file under
      # `.github/workflows/`, and there is no permission that grants it — so a
      # release whose history happens to touch a workflow could never be
      # tagged. The commit itself is already on main, pushed by a human token;
      # this only points a ref at it, which the restriction does not cover.
      - name: Tag the built commit
        if: steps.resolve.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.resolve.outputs.version }}
          SHA: ${{ steps.resolve.outputs.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # Idempotent: a re-run after a partial publish must not fail here.
          if gh api "repos/${REPOSITORY}/git/ref/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "v${VERSION} is already tagged"
            exit 0
          fi

          # Annotated, matching what `git tag -a` produced before: a tag object
          # first, then the ref that points at it.
          tag_sha=$(gh api "repos/${REPOSITORY}/git/tags" \
            -f tag="v${VERSION}" \
            -f message="v${VERSION}" \
            -f object="${SHA}" \
            -f type=commit \
            --jq '.sha')

          gh api "repos/${REPOSITORY}/git/refs" \
            -f ref="refs/tags/v${VERSION}" \
            -f sha="${tag_sha}" >/dev/null

          echo "tagged v${VERSION} at ${SHA}"

      - name: Publish the release
        if: steps.resolve.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          # Release notes: this version's CHANGELOG.md section, without heading.
          python3 - "$VERSION" > release-notes.md <<'PY'
          import sys
          from pathlib import Path

          version = sys.argv[1]
          lines = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          start = next(
              (i for i, line in enumerate(lines) if line.startswith(f"## [{version}]")),
              None,
          )
          if start is None:
              print(f"Release v{version}.")
          else:
              end = next(
                  (i for i in range(start + 1, len(lines)) if lines[i].startswith("## [")),
                  len(lines),
              )
              print("\n".join(lines[start + 1 : end]).strip())
          PY

          # No SHA256SUMS.txt. Releases here are published immutable, and GitHub
          # attests them: a Sigstore bundle binding each asset digest to the run
          # that produced it, fetched by digest with
          #
          #   gh api repos/{repo}/attestations/sha256:{digest}
          #
          # Deliberately not `gh attestation verify`. That command looks for
          # SLSA build provenance over an artifact and 404s here — the immutable
          # release predicate is `https://in-toto.io/attestation/release/v0.2`,
          # whose subject is the release rather than any one file, so it does
          # not match even when asked for by name.
          #
          # The sums file added nothing this does not: it sat beside the assets
          # it vouched for, so whoever could replace an asset could replace the
          # sums. Nothing read it either — a client checks each component
          # against the SHA-256 in `manifest.json`, and `content.zip` against
          # the `content.sha256` its own repository publishes.

          # Create a draft first so a failed asset upload is never public and a
          # rerun can repair it. Publish only after the whole payload exists, so
          # `latest/download/manifest.json` cannot resolve before its archives.
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" \
              assets/clonk-rust-* \
              components/*.zip manifest/manifest.json --clobber
            gh release edit "v${VERSION}" --draft=false --latest
          else
            gh release create "v${VERSION}" --draft \
              --title "Clonk Rust ${VERSION}" \
              --notes-file release-notes.md \
              assets/clonk-rust-* \
              components/*.zip manifest/manifest.json
            gh release edit "v${VERSION}" --draft=false --latest
          fi

      - name: Enforce release publication SLO
        # Also runs on an idempotent rerun after publication, so a slow first
        # run cannot be turned green merely by observing its existing release.
        if: steps.resolve.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ steps.resolve.outputs.sha }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          pulls=$(gh api "repos/${REPOSITORY}/commits/${SHA}/pulls")
          landed_at=$(jq -r --arg sha "$SHA" \
            '[.[] | select(.merge_commit_sha == $sha and .merged_at != null)]
             | if length == 1 then .[0].merged_at else empty end' \
            <<<"$pulls")
          if [[ -z "$landed_at" ]]; then
            echo "could not resolve the unique merged pull request for ${SHA}" >&2
            exit 1
          fi
          published_at=$(gh api "repos/${REPOSITORY}/releases/tags/v${VERSION}" \
            --jq '.published_at')
          landed=$(date -u -d "$landed_at" +%s)
          published=$(date -u -d "$published_at" +%s)
          elapsed=$((published - landed))
          echo "release published ${elapsed}s after its commit landed"
          if [[ "$elapsed" -lt 0 ]]; then
            echo "release publication predates its commit" >&2
            exit 1
          fi
          if [[ "$elapsed" -gt 120 ]]; then
            echo "release publication exceeded its 120s SLO" >&2
            exit 1
          fi
