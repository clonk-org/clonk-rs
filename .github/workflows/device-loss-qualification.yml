name: Live GPU device-loss qualification

on:
  workflow_call:
    inputs:
      source-sha:
        description: Exact source revision to qualify
        type: string
        required: true
      platforms:
        description: JSON platform list; releases qualify every desktop platform
        type: string
        default: '["linux", "windows", "macos"]'

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always

jobs:
  recover:
    name: Device loss / ${{ matrix.platform }}
    runs-on: ${{ matrix.platform == 'linux' && 'ubuntu-24.04' || matrix.platform == 'windows' && 'windows-latest' || 'macos-latest' }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false

      - name: Materialize verified pinned content
        uses: ./.github/actions/verified-content

      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1

      - name: Configure the shipped MSVC runtime
        if: runner.os == 'Windows'
        run: scripts/configure-msvc-runtime.sh

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ${{ runner.os == 'Windows' && 'shipped-msvc-runtime-v1' || 'device-loss-release' }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Locate the vendored zlib headers
        if: runner.os == 'Windows'
        run: |
          cargo fetch --locked
          zlib_dir=$(find "${CARGO_HOME:-$HOME/.cargo}/registry/src" -maxdepth 2 -type d -name 'libz-sys-*' | head -1)/src/zlib
          test -f "$zlib_dir/zlib.h"
          echo "CFLAGS_x86_64_pc_windows_msvc=-I$zlib_dir" >> "$GITHUB_ENV"

      - name: Qualify every requested backend
        uses: ./.github/actions/device-loss
        with:
          source-sha: ${{ inputs.source-sha }}

      - name: Validate the shipped MSVC runtime
        if: runner.os == 'Windows'
        run: scripts/validate-msvc-runtime.sh
