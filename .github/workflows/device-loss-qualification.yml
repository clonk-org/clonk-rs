name: Live GPU device-loss qualification

on:
  workflow_call:
    inputs:
      source-sha:
        description: Exact source revision to qualify
        type: string
        required: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always

jobs:
  recover:
    name: Device loss / ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux Vulkan and GL
            runner: ubuntu-24.04
            backends: vulkan gl
          - name: Windows DX12
            runner: windows-latest
            backends: dx12
          - name: macOS Metal
            runner: macos-latest
            backends: metal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-sha }}
          submodules: recursive
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1

      - name: Install Linux window and graphics dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: scripts/install-apt-packages.sh libasound2-dev libudev-dev mesa-vulkan-drivers libegl1-mesa-dev libgl1-mesa-dri xvfb xauth

      - name: Configure the shipped MSVC runtime
        if: runner.os == 'Windows'
        run: scripts/configure-msvc-runtime.sh

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ${{ runner.os == 'Windows' && 'shipped-msvc-runtime-v1' || 'device-loss-release' }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Locate the vendored zlib headers
        if: runner.os == 'Windows'
        run: |
          cargo fetch --locked
          zlib_dir=$(find "${CARGO_HOME:-$HOME/.cargo}/registry/src" -maxdepth 2 -type d -name 'libz-sys-*' | head -1)/src/zlib
          test -f "$zlib_dir/zlib.h"
          echo "CFLAGS_x86_64_pc_windows_msvc=-I$zlib_dir" >> "$GITHUB_ENV"

      - name: Qualify every requested backend
        env:
          PROBE_BACKENDS: ${{ matrix.backends }}
        run: |
          python -m venv "$RUNNER_TEMP/device-loss-venv"
          if [[ "$RUNNER_OS" == Windows ]]; then
            probe_python="$RUNNER_TEMP/device-loss-venv/Scripts/python.exe"
          else
            probe_python="$RUNNER_TEMP/device-loss-venv/bin/python"
          fi
          "$probe_python" -m pip install Pillow
          status=0
          for backend in $PROBE_BACKENDS; do
            "$probe_python" scripts/run_device_loss_probe.py --release \
              --backend "$backend" --artifact-dir "target/device-loss/$backend" || status=1
          done
          exit "$status"

      - name: Validate the shipped MSVC runtime
        if: runner.os == 'Windows'
        run: scripts/validate-msvc-runtime.sh

      - name: Retain reports, images, and failure diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: device-loss-${{ runner.os }}-${{ inputs.source-sha }}
          path: target/device-loss
          if-no-files-found: warn
          retention-days: 30
