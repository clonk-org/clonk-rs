name: Dependency guard

# Fast, submodule-free compile guard for dependency-shaped changes. It exists
# because a Renovate security pull request once moved `rand` 0.8 -> 0.9,
# removed `SmallRng::from_entropy()`, and broke the workspace build. The full
# Landing workflow owns the behavioral checks on the merge-group tree; this
# path-filtered workflow keeps the earlier locked-graph signal without
# compiling that same optimized test harness twice.

on:
  pull_request:
    paths:
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/dependency-guard.yml'
  workflow_dispatch:

# Least privilege: this workflow only reads the repository. No job raises it.
permissions:
  contents: read

concurrency:
  # Preserve the exact-SHA verdict recorded for a release commit. Ordinary
  # pushes supersede stale work on the same ref.
  group: "dependency-guard-${{ startsWith(github.event.head_commit.message, 'chore: release ') && github.sha || github.ref }}"
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always

jobs:
  guard:
    name: Build and dependency invariants
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      # Pinned to a full commit SHA, not a tag: a mutable ref is the vector the
      # tj-actions/changed-files compromise used.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No `submodules:` key. These targets need no game data, so fetching
          # the 299 MB content checkout would add latency without coverage.
          persist-credentials: false

      # alsa-sys and libudev-sys run pkg-config in their build scripts, which
      # `cargo check` executes, so these are needed even without codegen.
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libasound2-dev \
            libudev-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
        with:
          targets: x86_64-pc-windows-msvc

      # No build cache. A pull request restores only from its own ref or from
      # main, and this workflow never runs on main, so the 466 MB entry it used
      # to publish was unrestorable by construction: every live copy carried
      # `last_accessed_at` equal to `created_at`, saved and never once read. It
      # still spent the repository's 10 GiB budget and evicted, by LRU, the
      # `full-parity` and `shipped-msvc-runtime-v1` entries the merge queue and
      # the shipped Windows build do restore.
      #
      # Borrowing a scope that has a main producer would not warm this job
      # either: the cost here is codegen, not fetching (crates download in ~2 s
      # of a ~280 s run), and `full-parity` holds host build-mode units, which
      # `cargo check --target x86_64-pc-windows-msvc` cannot reuse. A warm
      # guard needs a producer on main of its own — another ~466 MB plus a
      # main-branch job — which the budget has no room for while the queue is
      # the workflow missing its latency target.

      # Pixels is the smallest package that enables wgpu's DX12 allocator.
      # Cross-check it because incompatible `windows` crate identities compile
      # on Linux but fail when Direct3D types cross the allocator boundary.
      - name: Check Windows renderer dependencies
        run: cargo check --locked --target x86_64-pc-windows-msvc -p pixels

      # Check clonk-platform separately so pixels cannot mask a missing direct
      # Windows feature through Cargo's feature unification.
      - name: Check Windows platform bindings
        run: cargo check --locked --target x86_64-pc-windows-msvc -p clonk-platform

      # Type-checks every library and binary, including the optional release
      # tooling, without optimized codegen. `--locked` additionally fails when
      # a manifest moved without its lockfile, which is the shape a bad
      # dependency update takes.
      #
      # Deliberately NOT `--all-targets`: test targets `include_bytes!` real
      # game data (crates/clonk-resources/src/definition.rs,
      # crates/clonk-engine/src/map_creator_s2.rs), so checking them would
      # require the content submodule.
      - name: Check workspace libraries and binaries
        run: cargo check --workspace --features xtask/engine-tools --locked
