name: Release prepare

# Opens a release pull request: works out the next version from Conventional
# Commit subjects, bumps the single workspace version, refreshes the lockfile
# and prepends a CHANGELOG.md section.
#
# Needs no game content, so it runs while `content/` access is irrelevant to it.
#
# Preparation targets opening the pull request within two minutes. Its merge
# group builds and qualifies the exact release commit before it lands; after
# landing, `release.yml` promotes those artifacts, tags the commit and publishes
# the GitHub Release.

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Explicit version (MAJOR.MINOR.PATCH). Leave blank to infer from commits.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-prepare
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Open release pull request
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      release-candidate: ${{ steps.existing.outputs.open == 'true' || steps.existing.outputs.create == 'true' }}
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Create release App token
        id: release-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check for an in-flight release
        id: existing
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          pull_requests=$(gh pr list \
            --repo "$REPOSITORY" \
            --base main \
            --head release/next \
            --state all \
            --limit 100 \
            --json url,number,state,createdAt,body,headRefOid)

          # A rerun keeps the same run id. Find its pull request even when the
          # first attempt already merged it; otherwise the rerun would recreate
          # the same release from the original, now-stale main SHA.
          pr=$(jq -c --arg run "Prepared by workflow run ${RUN_URL}." \
            '[.[] | select((.body // "") | contains($run))]
             | sort_by(.createdAt) | last // empty' <<<"$pull_requests")
          if [[ -z "$pr" ]]; then
            # An existing candidate keeps its PR, version and original clock.
            pr=$(jq -c \
              '[.[] | select(.state == "OPEN")]
               | sort_by(.createdAt) | last // empty' <<<"$pull_requests")
          fi

          if [[ -n "$pr" ]]; then
            url=$(jq -r '.url' <<<"$pr")
            state=$(jq -r '.state' <<<"$pr")
            if [[ "$state" == "CLOSED" ]]; then
              echo "release pull request from this workflow run was closed: $url" >&2
              exit 1
            fi
            if [[ "$state" != "OPEN" && "$state" != "MERGED" ]]; then
              echo "unexpected release pull request state '$state': $url" >&2
              exit 1
            fi
            echo "release pull request is already in state $state: $url"
            echo "open=true" >> "$GITHUB_OUTPUT"
            echo "url=$url" >> "$GITHUB_OUTPUT"
            echo "state=$state" >> "$GITHUB_OUTPUT"
            echo "number=$(jq -r '.number // empty' <<<"$pr")" >> "$GITHUB_OUTPUT"
            echo "head-sha=$(jq -r '.headRefOid // empty' <<<"$pr")" >> "$GITHUB_OUTPUT"
            echo "create=false" >> "$GITHUB_OUTPUT"
            echo "process=$([[ "$state" == 'OPEN' ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          else
            echo "open=false" >> "$GITHUB_OUTPUT"
            if [[ "${GITHUB_EVENT_NAME:-workflow_dispatch}" == 'push' ]]; then
              echo "create=false" >> "$GITHUB_OUTPUT"
              echo "process=false" >> "$GITHUB_OUTPUT"
            else
              echo "create=true" >> "$GITHUB_OUTPUT"
              echo "process=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.existing.outputs.process == 'true'
        with:
          # git-cliff derives the bump from every commit since the last v* tag,
          # so the full history and all tags must be present.
          fetch-depth: 0
          ref: ${{ github.sha }}
          token: ${{ steps.release-app.outputs.token }}

      - name: Validate existing release candidate
        id: refresh-context
        if: steps.existing.outputs.state == 'OPEN'
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ steps.existing.outputs.number }}
          EXPECTED_HEAD: ${{ steps.existing.outputs.head-sha }}
          REQUESTED_VERSION: ${{ inputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [[ "$PR_NUMBER" =~ ^[0-9]+$ && "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$BASE_SHA" ]]
          bot='clonk-rs-release[bot]'
          email='311066358+clonk-rs-release[bot]@users.noreply.github.com'
          details=$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")
          if [[ "$(jq -r '.merged' <<<"$details")" == 'true' ]]; then
            echo 'release candidate merged before refresh validation'
            echo 'refresh=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! jq -e --arg repo "$REPOSITORY" --arg bot "$bot" --arg head "$EXPECTED_HEAD" \
            --argjson number "$PR_NUMBER" '
            .number == $number and .state == "open" and .commits == 1 and
            .user.login == $bot and .user.type == "Bot" and
            .base.ref == "main" and .base.repo.full_name == $repo and
            .head.ref == "release/next" and .head.repo.full_name == $repo and
            .head.sha == $head' <<<"$details" >/dev/null; then
            echo 'refusing to refresh a changed, forked, manual or non-single-commit release candidate' >&2
            exit 1
          fi
          head=$(jq -r '.head.sha' <<<"$details")
          [[ "$head" =~ ^[0-9a-f]{40}$ ]]
          prefix="Prepared by workflow run ${RUN_URL%/*}/"
          prepared_run=$(jq -er --arg prefix "$prefix" '
            [(.body // "" | split("\n")[]) | select(startswith($prefix)) |
             ltrimstr($prefix) | select(test("^[0-9]+\\.$")) | rtrimstr(".")]
            | if length == 1 then .[0] else error("missing unique original preparation anchor") end' <<<"$details")
          git fetch --no-tags origin "$head"
          parents=$(git rev-list --parents -n 1 "$head")
          read -r -a ancestry <<<"$parents"
          [[ "${#ancestry[@]}" == 2 ]]
          parent=${ancestry[1]}
          identity=$(git show -s --format='%an%n%ae%n%cn%n%ce' "$head")
          expected=$(printf '%s\n%s\n%s\n%s' "$bot" "$email" "$bot" "$email")
          if [[ "$identity" != "$expected" ]]; then
            echo 'release commit identity is not the release automation' >&2
            exit 1
          fi
          commit=$(gh api "repos/${REPOSITORY}/commits/${head}")
          jq -e --arg bot "$bot" '.author.login == $bot and .committer.login == $bot and
            .author.type == "Bot" and .committer.type == "Bot"' <<<"$commit" >/dev/null
          message=$(git show -s --format=%B "$head")
          if [[ ! "$message" =~ ^chore:\ release\ ([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo 'release commit is not the sole generated release message' >&2
            exit 1
          fi
          version=${BASH_REMATCH[1]}
          manifest_version=$(git show "$head:Cargo.toml" | python3 -c \
            'import sys,tomllib; print(tomllib.loads(sys.stdin.read())["workspace"]["package"]["version"])')
          [[ "$manifest_version" == "$version" ]]
          if [[ -n "$REQUESTED_VERSION" && "${REQUESTED_VERSION#v}" != "$version" ]]; then
            echo "requested version differs from existing release version ${version}" >&2
            exit 1
          fi
          changed=$(git -c core.quotePath=true diff-tree --no-commit-id --name-only -r "$head")
          [[ -n "$changed" ]]
          while IFS= read -r path; do
            case "$path" in Cargo.toml|Cargo.lock|CHANGELOG.md) ;; *) echo "illegal generated release file: $path" >&2; exit 1 ;; esac
          done <<<"$changed"
          refresh=false
          if [[ "$parent" != "$BASE_SHA" ]]; then
            if git merge-base --is-ancestor "$parent" "$BASE_SHA"; then
              refresh=true
            elif git merge-base --is-ancestor "$BASE_SHA" "$parent"; then
              echo 'candidate is already prepared on newer main; older rerun will not rewind it'
            else
              echo 'release parent is outside selected main history' >&2
              exit 1
            fi
          fi
          echo "refresh=$refresh" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "head-sha=$head" >> "$GITHUB_OUTPUT"
          echo "prepared-parent=$parent" >> "$GITHUB_OUTPUT"
          echo "prepared-run-id=$prepared_run" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        if: steps.existing.outputs.create == 'true' || steps.refresh-context.outputs.refresh == 'true'

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: steps.existing.outputs.create == 'true' || steps.refresh-context.outputs.refresh == 'true'
        with:
          shared-key: release-prepare
          cache-on-failure: true

      # prepare-release.sh `cargo install`s git-cliff when it finds no binary,
      # which costs 2m36s and blows the SLO below. Caching that build was the
      # first answer and it failed twice over: this repository sits against the
      # 10 GiB Actions cache cap, so an entry touched once a day is evicted
      # ahead of caches touched on every push, and once the missing cache had
      # failed the job `actions/cache` no longer saved what it had just built.
      # Every run after 2026-08-11 rebuilt it and failed identically.
      #
      # git-cliff publishes prebuilt binaries, so take one: seconds, not
      # minutes, and no cache to lose. `--version` is still checked by the
      # script.
      - name: Install git-cliff
        if: steps.existing.outputs.create == 'true' || steps.refresh-context.outputs.refresh == 'true'
        env:
          GIT_CLIFF_VERSION: '2.13.1'
          GIT_CLIFF_SHA256: '200d2535da6d9703f3bcc8a4d159c3b55eacdb01cf2148c55b3eee9dd04d5249'
        run: |
          archive="${RUNNER_TEMP}/git-cliff.tar.gz"
          curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors \
            --output "$archive" \
            "https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-musl.tar.gz"

          # `cargo install --locked` at least resolved a version through
          # crates.io; a release asset is whatever the URL serves today, so the
          # pinned digest is the whole integrity story for a binary that then
          # writes this repository's changelog.
          actual=$(sha256sum "$archive" | cut -d' ' -f1)
          if [[ "$actual" != "$GIT_CLIFF_SHA256" ]]; then
            echo "git-cliff ${GIT_CLIFF_VERSION} hashes to ${actual}" >&2
            echo "but this workflow pins ${GIT_CLIFF_SHA256}" >&2
            exit 1
          fi

          # Exactly where prepare-release.sh probes: land it anywhere else and
          # the script silently falls back to building it from source.
          bin="target/release-tools/git-cliff-${GIT_CLIFF_VERSION}/bin"
          mkdir -p "$bin"
          tar -xzf "$archive" -C "$bin" --strip-components=1 \
            "git-cliff-${GIT_CLIFF_VERSION}/git-cliff"

      - name: Populate the cargo registry
        if: steps.existing.outputs.create == 'true' || steps.refresh-context.outputs.refresh == 'true'
        run: cargo fetch --locked

      - name: Prepare the release
        id: prepare
        if: steps.existing.outputs.create == 'true' || steps.refresh-context.outputs.refresh == 'true'
        env:
          REQUESTED_VERSION: ${{ steps.refresh-context.outputs.version || inputs.version }}
          REFRESHING_RELEASE: ${{ steps.refresh-context.outputs.refresh }}
        run: |
          if [[ "${REFRESHING_RELEASE:-false}" == 'true' ]]; then
            # An explicit version preserves the original release intent, but
            # main may have advanced past it while the candidate was open.
            python3 - "$REQUESTED_VERSION" <<'PY'
          import sys, tomllib
          current = tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"]
          original = sys.argv[1].removeprefix("v")
          if tuple(map(int, original.split("."))) <= tuple(map(int, current.split("."))):
              sys.exit(f"existing release version {original} is no longer newer than main {current}")
          PY
          fi
          # Quoted expansion, and the input reaches the script as an argument
          # rather than being interpolated into the command line.
          set +e
          if [[ -n "$REQUESTED_VERSION" ]]; then
            scripts/prepare-release.sh "$REQUESTED_VERSION"
          else
            scripts/prepare-release.sh
          fi
          status=$?
          set -e
          if [[ "$status" -eq 3 ]]; then
            echo "no releasable commits since the last tag"
            echo "prepared=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$status" -ne 0 ]]; then
            exit "$status"
          fi
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prepared=true" >> "$GITHUB_OUTPUT"

      - name: Refresh existing release pull request
        id: refresh
        if: steps.refresh-context.outputs.refresh == 'true' && steps.prepare.outputs.prepared == 'true'
        env:
          BASE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.existing.outputs.number }}
          EXPECTED_HEAD: ${{ steps.refresh-context.outputs.head-sha }}
          VERSION: ${{ steps.refresh-context.outputs.version }}
          PREPARED_RUN_ID: ${{ steps.refresh-context.outputs.prepared-run-id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [[ "$(git rev-parse HEAD)" == "$BASE_SHA" ]]
          bot='clonk-rs-release[bot]'
          email='311066358+clonk-rs-release[bot]@users.noreply.github.com'
          details=$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")
          anchor="Prepared by workflow run ${RUN_URL%/*}/${PREPARED_RUN_ID}."
          if ! jq -e --arg repo "$REPOSITORY" --arg bot "$bot" --arg head "$EXPECTED_HEAD" \
            --arg anchor "$anchor" --argjson number "$PR_NUMBER" '
            .number == $number and .state == "open" and .merged == false and .commits == 1 and
            .user.login == $bot and .user.type == "Bot" and
            .base.ref == "main" and .base.repo.full_name == $repo and
            .head.ref == "release/next" and .head.repo.full_name == $repo and
            .head.sha == $head and
            ([((.body // "") | split("\n")[]) | select(. == $anchor)] | length == 1)
            ' <<<"$details" >/dev/null; then
            echo 'release candidate changed before refresh; refusing to replace it' >&2
            exit 1
          fi
          git config user.name "$bot"
          git config user.email "$email"
          git add -- Cargo.toml Cargo.lock CHANGELOG.md
          changed=$(git -c core.quotePath=true diff --cached --name-only)
          [[ -n "$changed" ]]
          while IFS= read -r path; do
            case "$path" in Cargo.toml|Cargo.lock|CHANGELOG.md) ;; *) echo "illegal refreshed release file: $path" >&2; exit 1 ;; esac
          done <<<"$changed"
          git commit -m "chore: release ${VERSION}"
          new_head=$(git rev-parse HEAD)
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          nonce=$(python3 -c 'import secrets; print(secrets.token_hex(8))')
          temporary_ref="refs/heads/ci-release-refresh/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${nonce}"
          receipt="$RUNNER_TEMP/release-refresh-ref.json"
          request="$RUNNER_TEMP/release-refresh-request.json"
          zero=0000000000000000000000000000000000000000
          seeded=false
          seed_started=false
          complete=false
          cleanup_expected=$BASE_SHA
          mutation='mutation($input: UpdateRefsInput!) { updateRefs(input: $input) { clientMutationId } }'
          make_request() {
            jq -n --arg query "$mutation" --arg repo "$repository_id" --arg id "$1" --argjson updates "$2" \
              '{query: $query, variables: {input: {repositoryId: $repo, clientMutationId: $id, refUpdates: $updates}}}' > "$request"
          }
          accepted() {
            jq -e --arg id "$1" '((.errors // []) | length) == 0 and .data.updateRefs.clientMutationId == $id' <<<"$2" >/dev/null
          }
          cleanup() {
            status=$?
            trap - EXIT
            set +e
            cleanup_state=complete
            if [[ "$complete" != 'true' && "$seeded" == 'true' ]]; then
              operation="cleanup-${nonce}"
              if updates=$(jq -cn --arg ref "$temporary_ref" --arg before "$cleanup_expected" --arg zero "$zero" \
                '[{name: $ref, beforeOid: $before, afterOid: $zero}]') && make_request "$operation" "$updates" && \
                response=$(timeout --kill-after=5s 30s gh api graphql --input "$request") && accepted "$operation" "$response"; then
                echo 'owned temporary release ref removed after failed refresh'
              else
                cleanup_state=pending
              fi
            elif [[ "$complete" != 'true' && "$seed_started" == 'true' ]]; then
              # An ambiguous create response does not prove ref ownership.
              cleanup_state=pending
            fi
            jq -n --arg ref "$temporary_ref" --arg before "$EXPECTED_HEAD" --arg generated "$new_head" \
              --arg expected "$cleanup_expected" --arg cleanup "$cleanup_state" --argjson complete "$complete" \
              '{schema_version: 1, temporary_ref: $ref, temporary_expected_oid: $expected,
                candidate_expected_before: $before, generated_commit: $generated,
                candidate_update: (if $complete then "confirmed" else "pending" end), cleanup: $cleanup}' > "$receipt"
            echo "cleanup=$cleanup_state" >> "$GITHUB_OUTPUT"
            if [[ "$cleanup_state" == 'pending' ]]; then
              echo "::warning::temporary release ref cleanup remains pending: $temporary_ref at expected $cleanup_expected; receipt $receipt"
            fi
            exit "$status"
          }
          trap cleanup EXIT
          repository_id=$(timeout --kill-after=5s 30s gh api "repos/${REPOSITORY}" --jq .node_id)
          [[ -n "$repository_id" && "$repository_id" != 'null' ]]
          # Seed only a unique temporary ref at a commit already on main.
          # Its Git fast-forward adds just the three generated release files,
          # so the push does not transport intervening workflow changes.
          seed_started=true
          seed=$(timeout --kill-after=5s 30s gh api --method POST "repos/${REPOSITORY}/git/refs" \
            -f ref="$temporary_ref" -f sha="$BASE_SHA")
          jq -e --arg ref "$temporary_ref" --arg sha "$BASE_SHA" \
            '.ref == $ref and .object.type == "commit" and .object.sha == $sha' <<<"$seed" >/dev/null
          seeded=true
          timeout --kill-after=5s 60s git push --force-with-lease="$temporary_ref:$BASE_SHA" origin "HEAD:$temporary_ref"
          cleanup_expected=$new_head
          # updateRefs compares both beforeOid values atomically. The existing
          # candidate never resets to main, and a concurrent candidate or
          # temporary-ref change prevents both replacement and deletion.
          # https://docs.github.com/en/graphql/reference/git#updaterefs
          updates=$(jq -cn --arg before "$EXPECTED_HEAD" --arg after "$new_head" --arg temporary "$temporary_ref" --arg zero "$zero" \
            '[{name: "refs/heads/release/next", beforeOid: $before, afterOid: $after, force: true},
              {name: $temporary, beforeOid: $after, afterOid: $zero}]')
          operation="refresh-${nonce}"
          make_request "$operation" "$updates"
          response=$(timeout --kill-after=5s 30s gh api graphql --input "$request")
          accepted "$operation" "$response"
          complete=true
          echo "head-sha=$new_head" >> "$GITHUB_OUTPUT"

      - name: Retain unresolved release refresh cleanup receipt
        if: always() && steps.refresh.outputs.cleanup == 'pending'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-refresh-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-refresh-ref.json
          if-no-files-found: warn
          retention-days: 30

      - name: Open the pull request
        id: pull-request
        if: steps.existing.outputs.create == 'true' && steps.prepare.outputs.prepared == 'true'
        env:
          BASE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          branch="release/next"
          git config user.name "clonk-rs-release[bot]"
          git config user.email "311066358+clonk-rs-release[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -- Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "chore: release ${VERSION}"

          # Seed the protected branch at an existing main commit, then push
          # only the three generated release files. This keeps the App's
          # permissions limited to Contents and Pull requests.
          #
          # Seeding has to tolerate a branch an earlier run left behind: if
          # anything fails between this step and `gh pr create` the ref
          # survives with no pull request to consume it, and a ruleset forbids
          # deleting it. A create-only seed then wedges every later run --
          # including the daily schedule -- on "Reference already exists".
          # Resetting to the base commit is safe because the branch carries no
          # unique work: only the push below adds the release commit, and it
          # keeps the lease that push expects.
          if gh api "repos/${REPOSITORY}/git/ref/heads/${branch}" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${REPOSITORY}/git/refs/heads/${branch}" \
              -f sha="${BASE_SHA}" \
              -F force=true >/dev/null
          else
            gh api --method POST "repos/${REPOSITORY}/git/refs" \
              -f ref="refs/heads/${branch}" \
              -f sha="${BASE_SHA}" >/dev/null
          fi
          git push \
            --force-with-lease="refs/heads/${branch}:${BASE_SHA}" \
            origin "HEAD:refs/heads/${branch}"

          # The title must keep the `chore: release` prefix: a squash merge uses
          # it as the commit subject, and release.yml keys off exactly that.
          pr=$(
            gh pr create \
            --title "chore: release ${VERSION}" \
            --body "Automated release preparation for v${VERSION}.

          The merge queue builds and qualifies the exact release commit before it lands. After landing, \`release.yml\` promotes those artifacts, tags the commit and publishes the GitHub Release.

          Required checks and the merge queue gate this pull request.

          Prepared by workflow run ${RUN_URL}." \
            --base main \
            --head "$branch"
          )
          echo "opened $pr"
          echo "url=$pr" >> "$GITHUB_OUTPUT"
          echo "head-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Ensure the release pull request is queued
        if: steps.pull-request.outputs.url != '' || steps.existing.outputs.state == 'OPEN'
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          PR_URL: ${{ steps.pull-request.outputs.url || steps.existing.outputs.url }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_HEAD: ${{ steps.refresh.outputs.head-sha || steps.pull-request.outputs.head-sha || steps.refresh-context.outputs.head-sha }}
        run: |
          details=$(gh pr view "$PR_URL" --repo "$REPOSITORY" \
            --json state,headRefOid --jq '[.state, .headRefOid] | @tsv')
          IFS=$'\t' read -r state head_sha <<<"$details"
          if [[ "$state" == "MERGED" ]]; then
            echo "release pull request merged before queue verification"
            exit 0
          fi
          if [[ "$state" != "OPEN" || -z "$head_sha" || "$head_sha" != "$EXPECTED_HEAD" ]]; then
            echo "cannot queue a changed release pull request in state '$state'" >&2
            exit 1
          fi
          gh pr merge "$PR_URL" --repo "$REPOSITORY" \
            --auto --squash \
            --match-head-commit "$head_sha"

      - name: Enforce release preparation SLO
        continue-on-error: true
        # A rerun after this gate failed must measure the already-opened pull
        # request against the original run timestamp instead of turning green
        # by skipping every preparation step.
        if: steps.pull-request.outputs.url != '' || steps.existing.outputs.url != ''
        env:
          ACTIONS_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          PR_URL: ${{ steps.pull-request.outputs.url || steps.existing.outputs.url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          run_created_at=$(GH_TOKEN="$ACTIONS_TOKEN" gh api \
            "repos/${REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --jq '.created_at')
          pr_created_at=$(gh pr view "$PR_URL" --repo "$REPOSITORY" \
            --json createdAt --jq '.createdAt')
          run_created=$(date -u -d "$run_created_at" +%s)
          pr_created=$(date -u -d "$pr_created_at" +%s)
          elapsed=$((pr_created - run_created))
          if [[ "$elapsed" -lt 0 ]]; then
            echo "existing release pull request predates this workflow dispatch; no new preparation latency sample"
            if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
              echo 'Existing release PR reused; this dispatch is excluded from preparation latency samples.' >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi
          echo "release pull request opened ${elapsed}s after workflow dispatch"
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            printf 'Release preparation latency: %ss from original dispatch to PR creation (target 120s).\n' "$elapsed" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "$elapsed" -gt 120 ]]; then
            echo "::warning::release preparation exceeded its 120s SLO (${elapsed}s); the pull request was prepared successfully"
          fi

  prepare-latency-report:
    name: Release preparation latency report
    continue-on-error: true
    if: always() && (github.event_name != 'push' || needs.prepare.outputs.release-candidate == 'true')
    needs: [prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Measure release preparation clocks and comparable history
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/ci-latency-report.py --repository "$REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" --phase prepare --allow-running true \
            --release true --history-limit 20 \
            --output "$RUNNER_TEMP/ci-latency.json"

      - name: Retain release preparation latency evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-latency-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-latency.json
          if-no-files-found: warn
          overwrite: true
          retention-days: 30
