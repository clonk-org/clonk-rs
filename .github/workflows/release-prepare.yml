name: Release prepare

# Opens a release pull request: works out the next version from Conventional
# Commit subjects, bumps the single workspace version, refreshes the lockfile
# and prepends a CHANGELOG.md section.
#
# Needs no game content, so it runs while `content/` access is irrelevant to it.
#
# Preparation targets opening the pull request within two minutes. Its merge
# group builds and qualifies the exact release commit before it lands; after
# landing, `release.yml` promotes those artifacts, tags the commit and publishes
# the GitHub Release.

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Explicit version (MAJOR.MINOR.PATCH). Leave blank to infer from commits.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-prepare
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Open release pull request
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Create release App token
        id: release-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check for an in-flight release
        id: existing
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          pull_requests=$(gh pr list \
            --repo "$REPOSITORY" \
            --base main \
            --head release/next \
            --state all \
            --limit 100 \
            --json url,state,createdAt,body)

          # A rerun keeps the same run id. Find its pull request even when the
          # first attempt already merged it; otherwise the rerun would recreate
          # the same release from the original, now-stale main SHA.
          pr=$(jq -c --arg run "$RUN_URL" \
            '[.[] | select((.body // "") | contains($run))]
             | sort_by(.createdAt) | last // empty' <<<"$pull_requests")
          if [[ -z "$pr" ]]; then
            # A different run may already own release/next. Do not replace its
            # release commit; resume its queue request below instead.
            pr=$(jq -c \
              '[.[] | select(.state == "OPEN")]
               | sort_by(.createdAt) | last // empty' <<<"$pull_requests")
          fi

          if [[ -n "$pr" ]]; then
            url=$(jq -r '.url' <<<"$pr")
            state=$(jq -r '.state' <<<"$pr")
            if [[ "$state" == "CLOSED" ]]; then
              echo "release pull request from this workflow run was closed: $url" >&2
              exit 1
            fi
            if [[ "$state" != "OPEN" && "$state" != "MERGED" ]]; then
              echo "unexpected release pull request state '$state': $url" >&2
              exit 1
            fi
            echo "release pull request is already in state $state: $url"
            echo "open=true" >> "$GITHUB_OUTPUT"
            echo "url=$url" >> "$GITHUB_OUTPUT"
            echo "state=$state" >> "$GITHUB_OUTPUT"
          else
            echo "open=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.existing.outputs.open != 'true'
        with:
          # git-cliff derives the bump from every commit since the last v* tag,
          # so the full history and all tags must be present.
          fetch-depth: 0
          token: ${{ steps.release-app.outputs.token }}

      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
        if: steps.existing.outputs.open != 'true'

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: steps.existing.outputs.open != 'true'
        with:
          shared-key: release-prepare
          cache-on-failure: true

      # prepare-release.sh `cargo install`s git-cliff when it finds no binary,
      # which costs 2m36s and blows the SLO below. Caching that build was the
      # first answer and it failed twice over: this repository sits against the
      # 10 GiB Actions cache cap, so an entry touched once a day is evicted
      # ahead of caches touched on every push, and once the missing cache had
      # failed the job `actions/cache` no longer saved what it had just built.
      # Every run after 2026-08-11 rebuilt it and failed identically.
      #
      # git-cliff publishes prebuilt binaries, so take one: seconds, not
      # minutes, and no cache to lose. `--version` is still checked by the
      # script.
      - name: Install git-cliff
        if: steps.existing.outputs.open != 'true'
        env:
          GIT_CLIFF_VERSION: '2.13.1'
          GIT_CLIFF_SHA256: '200d2535da6d9703f3bcc8a4d159c3b55eacdb01cf2148c55b3eee9dd04d5249'
        run: |
          archive="${RUNNER_TEMP}/git-cliff.tar.gz"
          curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors \
            --output "$archive" \
            "https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-musl.tar.gz"

          # `cargo install --locked` at least resolved a version through
          # crates.io; a release asset is whatever the URL serves today, so the
          # pinned digest is the whole integrity story for a binary that then
          # writes this repository's changelog.
          actual=$(sha256sum "$archive" | cut -d' ' -f1)
          if [[ "$actual" != "$GIT_CLIFF_SHA256" ]]; then
            echo "git-cliff ${GIT_CLIFF_VERSION} hashes to ${actual}" >&2
            echo "but this workflow pins ${GIT_CLIFF_SHA256}" >&2
            exit 1
          fi

          # Exactly where prepare-release.sh probes: land it anywhere else and
          # the script silently falls back to building it from source.
          bin="target/release-tools/git-cliff-${GIT_CLIFF_VERSION}/bin"
          mkdir -p "$bin"
          tar -xzf "$archive" -C "$bin" --strip-components=1 \
            "git-cliff-${GIT_CLIFF_VERSION}/git-cliff"

      - name: Populate the cargo registry
        if: steps.existing.outputs.open != 'true'
        run: cargo fetch --locked

      - name: Prepare the release
        id: prepare
        if: steps.existing.outputs.open != 'true'
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          # Quoted expansion, and the input reaches the script as an argument
          # rather than being interpolated into the command line.
          set +e
          if [[ -n "$REQUESTED_VERSION" ]]; then
            scripts/prepare-release.sh "$REQUESTED_VERSION"
          else
            scripts/prepare-release.sh
          fi
          status=$?
          set -e
          if [[ "$status" -eq 3 ]]; then
            echo "no releasable commits since the last tag"
            echo "prepared=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$status" -ne 0 ]]; then
            exit "$status"
          fi
          version=$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path("Cargo.toml").read_text(encoding="utf-8")
          section = re.search(r"^\[workspace\.package\]$(.*?)(?=^\[)", text, re.M | re.S)
          print(re.search(r'^version = "([^"]+)"$', section.group(1), re.M).group(1))
          PY
          )
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prepared=true" >> "$GITHUB_OUTPUT"

      - name: Open the pull request
        id: pull-request
        if: steps.prepare.outputs.prepared == 'true'
        env:
          BASE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          branch="release/next"
          git config user.name "clonk-rs-release[bot]"
          git config user.email "311066358+clonk-rs-release[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -- Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "chore: release ${VERSION}"

          # Seed the protected branch at an existing main commit, then push
          # only the three generated release files. This keeps the App's
          # permissions limited to Contents and Pull requests.
          #
          # Seeding has to tolerate a branch an earlier run left behind: if
          # anything fails between this step and `gh pr create` the ref
          # survives with no pull request to consume it, and a ruleset forbids
          # deleting it. A create-only seed then wedges every later run --
          # including the daily schedule -- on "Reference already exists".
          # Resetting to the base commit is safe because the branch carries no
          # unique work: only the push below adds the release commit, and it
          # keeps the lease that push expects.
          if gh api "repos/${REPOSITORY}/git/ref/heads/${branch}" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${REPOSITORY}/git/refs/heads/${branch}" \
              -f sha="${BASE_SHA}" \
              -F force=true >/dev/null
          else
            gh api --method POST "repos/${REPOSITORY}/git/refs" \
              -f ref="refs/heads/${branch}" \
              -f sha="${BASE_SHA}" >/dev/null
          fi
          git push \
            --force-with-lease="refs/heads/${branch}:${BASE_SHA}" \
            origin "HEAD:refs/heads/${branch}"

          # The title must keep the `chore: release` prefix: a squash merge uses
          # it as the commit subject, and release.yml keys off exactly that.
          pr=$(
            gh pr create \
            --title "chore: release ${VERSION}" \
            --body "Automated release preparation for v${VERSION}.

          The merge queue builds and qualifies the exact release commit before it lands. After landing, \`release.yml\` promotes those artifacts, tags the commit and publishes the GitHub Release.

          Required checks and the merge queue gate this pull request.

          Prepared by workflow run ${RUN_URL}." \
            --base main \
            --head "$branch"
          )
          echo "opened $pr"
          echo "url=$pr" >> "$GITHUB_OUTPUT"

      - name: Ensure the release pull request is queued
        if: steps.pull-request.outputs.url != '' || steps.existing.outputs.state == 'OPEN'
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          PR_URL: ${{ steps.pull-request.outputs.url || steps.existing.outputs.url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          details=$(gh pr view "$PR_URL" --repo "$REPOSITORY" \
            --json state,headRefOid --jq '[.state, .headRefOid] | @tsv')
          IFS=$'\t' read -r state head_sha <<<"$details"
          if [[ "$state" == "MERGED" ]]; then
            echo "release pull request merged before queue verification"
            exit 0
          fi
          if [[ "$state" != "OPEN" || -z "$head_sha" ]]; then
            echo "cannot queue release pull request in state '$state'" >&2
            exit 1
          fi
          gh pr merge "$PR_URL" --repo "$REPOSITORY" \
            --auto --squash \
            --match-head-commit "$head_sha"

      - name: Enforce release preparation SLO
        # A rerun after this gate failed must measure the already-opened pull
        # request against the original run timestamp instead of turning green
        # by skipping every preparation step.
        if: steps.pull-request.outputs.url != '' || steps.existing.outputs.url != ''
        env:
          ACTIONS_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          PR_URL: ${{ steps.pull-request.outputs.url || steps.existing.outputs.url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          run_created_at=$(GH_TOKEN="$ACTIONS_TOKEN" gh api \
            "repos/${REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --jq '.created_at')
          pr_created_at=$(gh pr view "$PR_URL" --repo "$REPOSITORY" \
            --json createdAt --jq '.createdAt')
          run_created=$(date -u -d "$run_created_at" +%s)
          pr_created=$(date -u -d "$pr_created_at" +%s)
          elapsed=$((pr_created - run_created))
          echo "release pull request opened ${elapsed}s after workflow dispatch"
          if [[ "$elapsed" -lt 0 ]]; then
            echo "existing release pull request predates this workflow dispatch; SLO already satisfied"
            exit 0
          fi
          if [[ "$elapsed" -gt 120 ]]; then
            echo "release preparation exceeded its 120s SLO" >&2
            exit 1
          fi
