name: Clonk Rust CI

# Automatic triggers are disabled while the `content/` submodule lives in a
# separate private repository: the built-in GITHUB_TOKEN is scoped to the
# repository running the workflow, so `actions/checkout` cannot clone
# syb0rg/clonk-rs-content and every job fails at checkout with
# "Repository not found". Runs were also billing private-repo Actions minutes
# on every push and on each open dependency-update pull request.
#
# To re-enable, first give checkout access to the content repository — make it
# public, or add a fine-grained PAT with Contents:read on both repositories as
# a secret and pass it to `actions/checkout` via `token:` — then restore:
#
#   push:
#     branches: [main]
#   pull_request:
#     branches: [main]
#
# The gates below are otherwise current; they run locally via the commands in
# CLAUDE.md, and `workflow_dispatch` still allows a manual run.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always

jobs:
  focused-feedback:
    name: Focused developer feedback
    runs-on: ubuntu-latest
    # Was 15, which a cold-cache run of the full command set can exceed.
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Install native Rust dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libasound2-dev \
            libfreetype6-dev \
            libxmp4 \
            libudev-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
        with:
          components: clippy, rustfmt

      - name: Install cargo-nextest
        uses: taiki-e/install-action@7572810d7dd469b651bb7793945692cf78da5dd7 # v2
        with:
          tool: cargo-nextest@0.9.91

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: . -> target
          shared-key: focused-feedback
          cache-on-failure: true

      - name: Select comparison revision
        id: comparison
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PULL_REQUEST_BASE"
          elif [[ -n "$PUSH_BEFORE" ]] &&
            [[ ! "$PUSH_BEFORE" =~ ^0+$ ]] &&
            git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            base="$PUSH_BEFORE"
          elif base="$(git rev-parse HEAD^ 2>/dev/null)"; then
            :
          else
            base="$(git rev-parse HEAD)"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"

      # No `--budget-seconds`: dev-check treats an exhausted budget as a
      # failure, and the local fast-feedback budget cannot be met from a cold
      # runner cache. CI wants every selected command to run; the job timeout
      # is the real bound.
      - name: Run change-aware checks
        env:
          COMPARISON_BASE: ${{ steps.comparison.outputs.base }}
        run: cargo dev-check --base "$COMPARISON_BASE"

      - name: Upload developer-feedback artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-dev-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/dev-check
          if-no-files-found: warn
          retention-days: 14

  full-parity:
    name: Full Rust parity gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Install native Rust dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libasound2-dev \
            libfreetype6-dev \
            libxmp4 \
            libudev-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
        with:
          components: clippy, rustfmt

      - name: Install cargo-nextest
        uses: taiki-e/install-action@7572810d7dd469b651bb7793945692cf78da5dd7 # v2
        with:
          tool: cargo-nextest@0.9.91

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: . -> target
          shared-key: full-parity
          cache-on-failure: true

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run repository script tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Run packaging and release-tool tests
        run: cargo test -p xtask --features engine-tools --bin xtask-engine-tools --locked

      - name: Run workspace tests
        run: cargo test --workspace --locked

      - name: Run workspace lints
        run: cargo clippy --profile test --workspace --lib --bins --tests --features xtask/engine-tools --locked -- -D warnings

      - name: Verify deterministic engine snapshots
        run: cargo xtask engine-snapshots verify

      - name: Verify pinned C++ oracle parity
        run: cargo xtask parity verify
