name: Main validation

# Long diagnostics and trusted cache producers run asynchronously after the
# merge queue has exercised the exact landing tree. Release merge groups call
# the same reusable exact-SHA qualification before Landing is allowed to pass.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cache_only:
        description: Publish landing caches without post-merge diagnostics
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always

jobs:
  # Swatinem saves in a post-job hook and reports cache-service failures
  # without failing its producer. A cache-only bootstrap therefore proves both
  # Rust entries are visible from fresh dependent jobs before reporting green.
  verify-landing-cache-bootstrap:
    name: Verify landing cache bootstrap / ${{ matrix.name }}
    needs:
      - linux-landing-cache
      - windows-landing-cache
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.cache_only }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
          - name: Windows
            runner: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1

      - name: Look up the published Linux cache
        if: matrix.name == 'Linux'
        id: linux-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: . -> target
          shared-key: full-parity
          lookup-only: true
          save-if: false

      - name: Look up the published Windows cache
        if: matrix.name == 'Windows'
        id: windows-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: . -> target
          shared-key: windows-runtime-msvc-v2
          lookup-only: true
          save-if: false

      - name: Require the published ${{ matrix.name }} cache
        env:
          CACHE_HIT: >-
            ${{ matrix.name == 'Linux'
              && steps.linux-cache.outputs.cache-hit
              || steps.windows-cache.outputs.cache-hit }}
        run: '[[ "$CACHE_HIT" == "true" ]]'

  # This short publisher is never preempted by Landing. Ordinary pushes
  # coalesce to one rolling lane; an explicit bootstrap keeps an exact-SHA lane
  # so a newer push cannot replace its pending prerequisite.
  content-landing-cache:
    name: Publish the pinned content checkout
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: >-
        main-content-landing-cache-${{ github.event_name == 'workflow_dispatch'
          && github.sha || 'rolling' }}
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve pinned content revision
        id: content
        run: |
          revision=$(git rev-parse HEAD:content)
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid content gitlink: $revision" >&2
            exit 1
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Find the pinned content checkout
        id: content-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/modules/content
          key: clonk-content-git-v1-${{ runner.os }}-${{ hashFiles('.gitmodules') }}-${{ steps.content.outputs.revision }}
          lookup-only: true

      - name: Materialize pinned content checkout
        if: steps.content-cache.outputs.cache-hit != 'true'
        run: git submodule update --init --force --depth=1 --filter=blob:none content

      - name: Verify pinned content checkout
        if: steps.content-cache.outputs.cache-hit != 'true'
        env:
          CONTENT_REVISION: ${{ steps.content.outputs.revision }}
        run: |
          actual=$(git -C content rev-parse HEAD)
          [[ "$actual" == "$CONTENT_REVISION" ]]
          [[ -z "$(git -C content status --porcelain --untracked-files=all)" ]]

      - name: Publish pinned content checkout
        if: steps.content-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/modules/content
          key: clonk-content-git-v1-${{ runner.os }}-${{ hashFiles('.gitmodules') }}-${{ steps.content.outputs.revision }}

      # cache/save reports service failures as warnings. Fail this producer if
      # the immutable object store was not actually published.
      - name: Verify pinned content checkout publication
        if: steps.content-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/modules/content
          key: clonk-content-git-v1-${{ runner.os }}-${{ hashFiles('.gitmodules') }}-${{ steps.content.outputs.revision }}
          fail-on-cache-miss: true
          lookup-only: true

  linux-landing-cache:
    name: Warm the Linux landing cache
    needs: content-landing-cache
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      # Ordinary main runs finish the current authoritative cache before moving
      # on. A queue candidate may preempt this rolling lane; releases and
      # explicit cache-bootstrap dispatches keep an exact-SHA lane.
      group: "linux-landing-cache-${{ (github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'chore: release ')) && github.sha || 'rolling' }}"
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve pinned content revision
        id: content
        run: |
          revision=$(git rev-parse HEAD:content)
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid content gitlink: $revision" >&2
            exit 1
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Restore pinned content checkout
        id: content-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/modules/content
          key: clonk-content-git-v1-${{ runner.os }}-${{ hashFiles('.gitmodules') }}-${{ steps.content.outputs.revision }}

      - name: Materialize pinned content checkout
        run: git submodule update --init --force --depth=1 --filter=blob:none content

      - name: Verify pinned content checkout
        env:
          CONTENT_REVISION: ${{ steps.content.outputs.revision }}
        run: |
          actual=$(git -C content rev-parse HEAD)
          [[ "$actual" == "$CONTENT_REVISION" ]]
          [[ -z "$(git -C content status --porcelain --untracked-files=all)" ]]

      - name: Install native Rust dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libasound2-dev \
            libfreetype6-dev \
            libvulkan1 \
            libxmp4 \
            libudev-dev \
            mesa-vulkan-drivers \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1

      - name: Install cargo-nextest
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: cargo-nextest@0.9.91
          fallback: none

      - name: Restore or publish the exhaustive Linux cache
        id: linux-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: . -> target
          shared-key: full-parity

      - name: Compile the complete landing dependency graph
        if: steps.linux-cache.outputs.cache-hit != 'true'
        run: cargo nextest run --workspace --features xtask/engine-tools --no-run --locked

  # Usually the Linux cache producer is preempted by an active merge group. If
  # it finishes during the small gap before the next candidate, check again
  # before admitting the expensive diagnostic fan-out. The shared concurrency
  # lane below closes the race between this read and the next Landing run.
  diagnostic-admission:
    name: Admit post-merge diagnostics
    needs: linux-landing-cache
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.cache_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
    outputs:
      run_diagnostics: ${{ steps.queue.outputs.run_diagnostics }}
    steps:
      - name: Check merge-group activity
        id: queue
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          active=$(
            gh api --method GET \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${REPOSITORY}/actions/workflows/landing.yml/runs" \
              -f event=merge_group \
              -f per_page=100 \
              --jq '.workflow_runs[]
                | select(.status != "completed")
                | .id'
          )
          if [[ -z "$active" ]]; then
            run_diagnostics=true
          else
            run_diagnostics=false
          fi
          printf 'run_diagnostics=%s\n' "$run_diagnostics" >> "$GITHUB_OUTPUT"

  exact-sha-qualification:
    name: Exact-SHA qualification
    needs: diagnostic-admission
    if: >-
      ${{ (github.event_name != 'workflow_dispatch' || !inputs.cache_only)
        && needs.diagnostic-admission.outputs.run_diagnostics == 'true' }}
    concurrency:
      group: landing-runner-priority
      cancel-in-progress: false
    permissions:
      contents: read
    uses: ./.github/workflows/exact-sha-qualification.yml
    with:
      source-sha: ${{ github.sha }}
      # Landing already qualified release commits at their exact SHA. All
      # post-merge diagnostics yield their runner slots to the next candidate.
      concurrency-suffix: rolling
      publish-recording-host-cache: true
      upload-diagnostics: true

  windows-landing-cache:
    name: Warm the Windows landing cache
    runs-on: windows-latest
    timeout-minutes: 45
    concurrency:
      # Queue Windows smoke may preempt this rolling producer. Releases and
      # explicit cache-bootstrap dispatches use an exact-SHA lane.
      group: "windows-landing-cache-${{ (github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'chore: release ')) && github.sha || 'rolling' }}"
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1

      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: cargo-nextest@0.9.91
          fallback: none

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        id: windows-cache
        with:
          shared-key: windows-runtime-msvc-v2

      # Swatinem intentionally drops workspace crates whose checkout mtimes
      # make them stale. Compiling every landing package here still publishes
      # their reusable registry and non-workspace dependency artifacts.
      - name: Warm dependencies for the Windows landing graph
        if: steps.windows-cache.outputs.cache-hit != 'true'
        run: |
          cargo nextest run -p clonk-game -p clonk-c4group -p clonk-platform -p clonk-core -p clonk-logging -p clonk-network --locked --no-run
          cargo clippy --profile test --no-deps -p clonk-game -p clonk-c4group -p clonk-logging -p clonk-network -p clonk-platform -p clonk-core --all-targets --locked -- -D warnings

  windows-release-tools:
    name: Windows release tooling
    needs: windows-landing-cache
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.cache_only }}
    runs-on: windows-latest
    timeout-minutes: 45
    concurrency:
      # Smoke may also preempt this post-cache validation so the next queue
      # candidate never waits behind the longer shipped-runtime build.
      group: "windows-landing-cache-${{ (github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'chore: release ')) && github.sha || 'rolling' }}"
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1

      # Release invokes this binary on the Windows host. Build its real release
      # graph here without serializing it ahead of the merge-critical runtime.
      - name: Build the Windows packaging tool
        run: cargo build --release --locked -p xtask --features engine-tools --bin xtask-engine-tools

      - name: Configure the shipped MSVC runtime
        run: scripts/configure-msvc-runtime.sh

      - name: Restore trusted ThinLTO cache
        id: thinlto-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/clonk-msvc-thinlto
          # Release preparation changes Cargo package versions without changing
          # bitcode. Key the trusted cache by compiler/config/source instead;
          # LLD independently hashes every input before reusing an entry.
          key: clonk-msvc-thinlto-v2-windows-x64-rustc-1.97.1-llvm-22.1.6-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml', 'scripts/configure-msvc-runtime.sh', 'crates/**/*.rs') }}

      # Keep the shipped graph in its own write-capable cache action. Swatinem
      # cleans target in its post step, so nesting it with the landing-cache
      # producer would erase that producer's artifacts before publication.
      - name: Restore or publish the shipped MSVC dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: shipped-msvc-runtime-v1

      # Build the exact shipped graph on trusted main after bounded queue smoke.
      # This fail-closed validation also keeps release dependency and ThinLTO
      # caches current without letting ephemeral queue refs publish caches.
      - name: Refresh the shipped MSVC runtime cache
        run: |
          cargo fetch --locked
          zlib_dir=$(find "${CARGO_HOME:-$HOME/.cargo}/registry/src" -maxdepth 2 -type d -name 'libz-sys-*' | head -1)/src/zlib
          if [[ ! -f "$zlib_dir/zlib.h" ]]; then
            echo "could not locate the vendored zlib headers under $zlib_dir" >&2
            exit 1
          fi
          export CFLAGS_x86_64_pc_windows_msvc="-I$zlib_dir"
          cargo build --release -p clonk-app -p clonk-game -p clonk-c4group --locked --timings

      - name: Validate the shipped MSVC runtime
        run: scripts/validate-msvc-runtime.sh

      - name: Publish trusted ThinLTO cache
        if: >-
          success()
          && github.ref == 'refs/heads/main'
          && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
          && steps.thinlto-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/clonk-msvc-thinlto
          key: ${{ steps.thinlto-cache.outputs.cache-primary-key }}
