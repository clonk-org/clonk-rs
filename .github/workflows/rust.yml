name: Clonk Rust CI

# The full parity gate. Runs the whole suite, so it needs the `content/`
# submodule; that is why it was trigger-disabled while clonk-rs-content was
# private, and why it works again now that the repository is public.
#
# `dependency-guard.yml` stays separate: it is submodule-free and cheap, and
# fires on dependency-shaped changes only.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always

jobs:
  # Deliberately its own job. While this was the first step of `full-parity`,
  # every step after it was `skipped` whenever it failed, so ~82 hunks of
  # cosmetic whitespace drift hid the workspace tests, the lints, the engine
  # snapshots and the C++ oracle parity check for as long as the drift lasted.
  # A formatting failure must never mask a determinism failure again.
  #
  # rustfmt only parses, so this needs no submodule, no build cache and no
  # dependency download — it reports in well under a minute.
  formatting:
    name: Rust formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
        with:
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

  focused-feedback:
    name: Focused developer feedback
    runs-on: ubuntu-latest
    # Was 15, which a cold-cache run of the full command set can exceed.
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Install native Rust dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libasound2-dev \
            libfreetype6-dev \
            libvulkan1 \
            libxmp4 \
            libudev-dev \
            mesa-vulkan-drivers \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
        with:
          components: clippy, rustfmt

      - name: Install cargo-nextest
        uses: taiki-e/install-action@7572810d7dd469b651bb7793945692cf78da5dd7 # v2
        with:
          tool: cargo-nextest@0.9.91

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: . -> target
          shared-key: focused-feedback
          cache-on-failure: true

      - name: Select comparison revision
        id: comparison
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PULL_REQUEST_BASE"
          elif [[ -n "$PUSH_BEFORE" ]] &&
            [[ ! "$PUSH_BEFORE" =~ ^0+$ ]] &&
            git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            base="$PUSH_BEFORE"
          elif base="$(git rev-parse HEAD^ 2>/dev/null)"; then
            :
          else
            base="$(git rev-parse HEAD)"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"

      # No `--budget-seconds`: dev-check treats an exhausted budget as a
      # failure, and the local fast-feedback budget cannot be met from a cold
      # runner cache. CI wants every selected command to run; the job timeout
      # is the real bound.
      - name: Run change-aware checks
        env:
          COMPARISON_BASE: ${{ steps.comparison.outputs.base }}
        run: cargo dev-check --base "$COMPARISON_BASE"

      - name: Upload developer-feedback artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-dev-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/dev-check
          if-no-files-found: warn
          retention-days: 14

  # Unpacked C4Groups intentionally expose the host filesystem's native entry
  # order, exactly like C++. The checked-in raw material-index oracles were
  # recorded on APFS, so they cannot be compared to an ext4 enumeration. Keep
  # those oracle values as a visible required job instead of silently sorting
  # the engine or accepting Linux-specific replacements. Ubuntu still runs the
  # same real scenarios through host-repeatability and semantic assertions.
  recording-host-oracles:
    name: Recording-host material-order oracles (macOS)
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1

      - name: Install cargo-nextest
        uses: taiki-e/install-action@7572810d7dd469b651bb7793945692cf78da5dd7 # v2
        with:
          tool: cargo-nextest@0.9.91

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: . -> target
          shared-key: recording-host-oracles
          cache-on-failure: true

      # scripts/tests/test_rust_ci_recording_host_gate.py requires every test
      # carrying the recording-host ignore marker to appear in this block.
      - name: Run recording-host material-order oracles
        run: |
          cargo nextest run -p clonk-app --bin clonk-app --locked -- \
            tests::app_virtual_keyboard_completes_real_tutorial02_route --exact
          cargo nextest run -p clonk-engine-integration-tests --test engine_it --locked -- \
            real_tutorial02_virtual_play::tutorial02_virtual_player_completes_the_real_tutorial_route --exact
          cargo nextest run -p clonk-engine-integration-tests --test engine_it --locked -- \
            dev_feedback_replay::committed_real_scenario_replays_are_deterministic --exact
          cargo nextest run -p clonk-engine-integration-tests --test engine_it --locked -- \
            elevator_motion_oracle::tutorial07_seed_zero_landscape_matches_cpp_surface8 --exact
          cargo nextest run -p clonk-engine-integration-tests --test engine_it --locked -- \
            real_scenario_harness::alchemy_real_scenario_subcases_batch_4 --exact
          cargo nextest run -p clonk-frontend-unit-tests --test frontend_inline --locked -- \
            tests::real_tutorial_seven_acid_rain_matches_cpp_animated_pxs_sequence --exact

  full-parity:
    name: Full Rust parity gate
    runs-on: ubuntu-latest
    # Was 60, which a cold-cache run exceeded: the first run after the gate was
    # re-enabled was killed at 60m31s during `Run workspace tests`. The
    # scheduled release refuses to publish unless this gate is green, so a
    # timeout here silently stops releases.
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Install native Rust dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libasound2-dev \
            libfreetype6-dev \
            libvulkan1 \
            libxmp4 \
            libudev-dev \
            mesa-vulkan-drivers \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
        with:
          components: clippy, rustfmt

      - name: Install cargo-nextest
        uses: taiki-e/install-action@7572810d7dd469b651bb7793945692cf78da5dd7 # v2
        with:
          tool: cargo-nextest@0.9.91

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: . -> target
          shared-key: full-parity
          cache-on-failure: true

      - name: Run repository script tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Run packaging and release-tool tests
        run: cargo test -p xtask --features engine-tools --bin xtask-engine-tools --locked

      # nextest, not `cargo test`: this job already installs cargo-nextest, and
      # only nextest reads `.config/nextest.toml`, where the retries for the
      # known load-sensitive socket tests and the priority order that front-loads
      # the long scenario routes live. Under `cargo test` both were silently
      # inert. `--no-fail-fast` reports every failure instead of stopping at the
      # first failing binary, which is what CLAUDE.md documents as the gate.
      - name: Run workspace tests
        run: cargo nextest run --workspace --no-fail-fast --locked

      - name: Run workspace lints
        run: cargo clippy --profile test --workspace --lib --bins --tests --features xtask/engine-tools --locked -- -D warnings

      - name: Verify deterministic engine snapshots
        run: cargo xtask engine-snapshots verify

      - name: Verify pinned C++ oracle parity
        run: cargo xtask parity verify
