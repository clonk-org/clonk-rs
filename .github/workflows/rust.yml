name: Main validation

# Long diagnostics and trusted cache producers run asynchronously after the
# merge queue has exercised the exact landing tree. Release merge groups call
# the same reusable exact-SHA qualification before Landing is allowed to pass.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always

jobs:
  linux-landing-cache:
    name: Warm the Linux landing cache
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      # Ordinary main runs finish the current authoritative cache before moving
      # on. A queue candidate may preempt this rolling lane; release commits
      # keep an exact-SHA lane of their own.
      group: "linux-landing-cache-${{ startsWith(github.event.head_commit.message, 'chore: release ') && github.sha || 'rolling' }}"
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install native Rust dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libasound2-dev \
            libfreetype6-dev \
            libvulkan1 \
            libxmp4 \
            libudev-dev \
            mesa-vulkan-drivers \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1

      - name: Install cargo-nextest
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-nextest@0.9.91
          fallback: none

      - name: Restore or publish the exhaustive Linux cache
        id: linux-cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: . -> target
          shared-key: full-parity

      - name: Compile the complete landing dependency graph
        if: steps.linux-cache.outputs.cache-hit != 'true'
        run: cargo nextest run --workspace --features xtask/engine-tools --no-run --locked

  exact-sha-qualification:
    name: Exact-SHA qualification
    needs: linux-landing-cache
    permissions:
      contents: read
    uses: ./.github/workflows/exact-sha-qualification.yml
    with:
      source-sha: ${{ github.sha }}
      # Landing already qualified release commits at their exact SHA. All
      # post-merge diagnostics yield their runner slots to the next candidate.
      concurrency-suffix: rolling
      publish-recording-host-cache: true
      upload-diagnostics: true

  windows-release-tools:
    name: Windows release tooling
    runs-on: windows-latest
    timeout-minutes: 45
    concurrency:
      # Ordinary main runs do not interrupt this authoritative cache producer.
      # Queue Windows smoke may preempt its rolling lane; release commits use
      # an exact-SHA lane that cannot be interrupted.
      group: "windows-landing-cache-${{ startsWith(github.event.head_commit.message, 'chore: release ') && github.sha || 'rolling' }}"
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1

      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-nextest@0.9.91
          fallback: none

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: windows-runtime-msvc

      - name: Refresh Windows smoke-test cache
        run: cargo nextest run -p clonk-game -p clonk-c4group -p clonk-platform -p clonk-core -p clonk-logging --locked --no-fail-fast

      # Release invokes this binary on the Windows host. Build its real release
      # graph here without serializing it ahead of the merge-critical runtime.
      - name: Build the Windows packaging tool
        run: cargo build --release --locked -p xtask --features engine-tools --bin xtask-engine-tools

      - name: Configure the shipped MSVC runtime
        run: scripts/configure-msvc-runtime.sh

      - name: Restore trusted ThinLTO cache
        id: thinlto-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/clonk-msvc-thinlto
          # Release preparation changes Cargo package versions without changing
          # bitcode. Key the trusted cache by compiler/config/source instead;
          # LLD independently hashes every input before reusing an entry.
          key: clonk-msvc-thinlto-v2-windows-x64-rustc-1.97.1-llvm-22.1.6-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml', 'scripts/configure-msvc-runtime.sh', 'crates/**/*.rs') }}

      # The earlier cache serves smoke tests and the native packaging tool.
      # Re-enter it after setting target flags so this producer has the same
      # dependency-cache identity as the merge queue's shipped build.
      - name: Restore or publish the shipped MSVC dependency cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: shipped-msvc-runtime-v1

      # Build the exact shipped graph on trusted main after bounded queue smoke.
      # This fail-closed validation also keeps release dependency and ThinLTO
      # caches current without letting ephemeral queue refs publish caches.
      - name: Refresh the shipped MSVC runtime cache
        run: |
          cargo fetch --locked
          zlib_dir=$(find "${CARGO_HOME:-$HOME/.cargo}/registry/src" -maxdepth 2 -type d -name 'libz-sys-*' | head -1)/src/zlib
          if [[ ! -f "$zlib_dir/zlib.h" ]]; then
            echo "could not locate the vendored zlib headers under $zlib_dir" >&2
            exit 1
          fi
          export CFLAGS_x86_64_pc_windows_msvc="-I$zlib_dir"
          cargo build --release -p clonk-app -p clonk-game -p clonk-c4group --locked --timings

      - name: Validate the shipped MSVC runtime
        run: scripts/validate-msvc-runtime.sh

      - name: Publish trusted ThinLTO cache
        if: >-
          success()
          && github.ref == 'refs/heads/main'
          && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
          && steps.thinlto-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/clonk-msvc-thinlto
          key: ${{ steps.thinlto-cache.outputs.cache-primary-key }}
