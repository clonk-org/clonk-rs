name: Main validation

# Long diagnostics and trusted cache producers run asynchronously after the
# merge queue has exercised the exact landing tree. Release merge groups call
# the same reusable exact-SHA qualification before Landing is allowed to pass.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cache_only:
        description: Publish landing caches without post-merge diagnostics
        required: false
        type: boolean
        default: false
      software_presentation:
        description: Qualify forced and automatic software presentation on Windows
        required: false
        type: boolean
        default: false
      device_loss:
        description: Qualify live device-loss recovery on desktop GPU backends
        required: false
        type: boolean
        default: false
      device_loss_platform:
        description: Platform to qualify when device_loss is selected
        required: false
        type: choice
        default: all
        options: [all, linux, windows, macos]

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always
  NEXTEST_PROFILE: ci

jobs:
  device-loss:
    if: inputs.device_loss
    uses: ./.github/workflows/device-loss-qualification.yml
    with:
      source-sha: ${{ github.sha }}
      platforms: ${{ inputs.device_loss_platform == 'all' && '["linux", "windows", "macos"]' || format('["{0}"]', inputs.device_loss_platform) }}

  # Swatinem saves in a post-job hook and reports cache-service failures
  # without failing its producer. A cache-only bootstrap therefore proves both
  # Rust entries are visible from fresh dependent jobs before reporting green.
  verify-landing-cache-bootstrap:
    name: Verify landing cache bootstrap / ${{ matrix.name }}
    needs:
      - linux-landing-cache
      - windows-landing-cache
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.cache_only }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
          - name: Windows
            runner: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1

      - name: Look up the published Linux cache
        if: matrix.name == 'Linux'
        id: linux-cache
        uses: ./.github/actions/workspace-cache
        with:
          operation: lookup
          lane: landing-linux
          target: target
          ledger: .ci-cache-ledgers/landing.json
          recipe: landing-v1

      - name: Look up the published Windows cache
        if: matrix.name == 'Windows'
        id: windows-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: . -> target
          shared-key: windows-runtime-msvc-v2
          lookup-only: true
          save-if: false

      - name: Require the published ${{ matrix.name }} cache
        env:
          CACHE_HIT: >-
            ${{ matrix.name == 'Linux'
              && steps.linux-cache.outputs.cache-hit
              || steps.windows-cache.outputs.cache-hit }}
        run: '[[ "$CACHE_HIT" == "true" ]]'

  # This short publisher is never preempted by Landing. Ordinary pushes
  # coalesce to one rolling lane; an explicit bootstrap keeps an exact-SHA lane
  # so a newer push cannot replace its pending prerequisite.
  content-landing-cache:
    if: ${{ !inputs.device_loss }}
    name: Publish the pinned content checkout
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: >-
        main-content-landing-cache-${{ github.event_name == 'workflow_dispatch'
          && github.sha || 'rolling' }}
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Publish verified pinned content
        uses: ./.github/actions/verified-content
        with:
          publish: 'true'

  linux-landing-cache:
    name: Warm the Linux landing cache
    needs: content-landing-cache
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      # Ordinary main runs finish the current authoritative cache before moving
      # on. A queue candidate may preempt this rolling lane; releases and
      # explicit cache-bootstrap dispatches keep an exact-SHA lane.
      group: "linux-landing-cache-${{ (github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'chore: release ')) && github.sha || 'rolling' }}"
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare verified content, dependencies, and exact Rust
        id: preinstalled-rust
        uses: ./.github/actions/verified-content
        with:
          apt-packages: libasound2-dev libfreetype6-dev libvulkan1 libxmp4 libudev-dev mesa-vulkan-drivers pkg-config
          probe-rust: 'true'

      - name: Install Rust toolchain
        if: steps.preinstalled-rust.outputs.exact != 'true'
        uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1

      - name: Install cargo-nextest
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-nextest@0.9.91
          fallback: none

      - name: Restore or publish the exhaustive Linux cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-targets: false
          shared-key: full-parity

      - name: Restore verified workspace build inputs
        uses: ./.github/actions/workspace-cache
        with:
          operation: restore
          lane: landing-linux
          target: target
          ledger: .ci-cache-ledgers/landing.json
          recipe: landing-v1

      - name: Verify restored workspace artifacts
        id: workspace-inputs
        run: python3 scripts/ci-workspace-cache.py prepare --target target --recipe landing-v1 --ledger .ci-cache-ledgers/landing.json --github-output "$GITHUB_OUTPUT"

      - name: 'CI cache receipt: ${{ steps.workspace-inputs.outputs.cache-state }}'
        run: 'true'

      - name: Compile the complete landing dependency graph
        run: cargo nextest run --workspace --features xtask/engine-tools --no-run --locked

      # `presentation captures` restores this same cache and then builds the
      # shipped `release` profile, which the test-profile compile above never
      # produces. That row cold-built 589 crates for 511s of its 953s in queue
      # run 33582557701 -- the longest job in the queue, on the critical path of
      # every merge, restoring a cache that could not cover it. Warm the exact
      # argv `rust_current_build_recipe` runs, under its environment, so the
      # fingerprints match and the restore hits. Cache warming is this job's
      # stated purpose and it blocks neither the next merge nor a release, so
      # the compile moves off the critical path rather than being removed.
      # `test_acquire_presentation_oracle.py` pins this to the recipe.
      - name: Warm the release-profile presentation capture build
        env:
          CARGO_INCREMENTAL: '0'
          LANG: C
          LC_ALL: C
          TZ: UTC
        run: cargo build --locked --release -p clonk-app --features presentation-capture

  # Usually the Linux cache producer is preempted by an active merge group. If
  # it finishes during the small gap before the next candidate, check again
  # before admitting the expensive diagnostic fan-out. The shared concurrency
  # lane below closes the race between this read and the next Landing run.
      - name: Record verified workspace build inputs
        run: python3 scripts/ci-workspace-cache.py record --target target --recipe landing-v1 --ledger .ci-cache-ledgers/landing.json

      - name: Publish verified workspace build inputs
        id: workspace-cache
        uses: ./.github/actions/workspace-cache
        with:
          operation: save
          lane: landing-linux
          target: target
          ledger: .ci-cache-ledgers/landing.json
          recipe: landing-v1

      - name: Verify the exhaustive compiled input handoff
        if: github.event_name == 'workflow_dispatch' && inputs.cache_only
        uses: ./.github/actions/verify-cache-handoff
        with:
          path: |
            target
            .ci-cache-ledgers/landing.json
          key: ${{ steps.workspace-cache.outputs.key }}

  diagnostic-admission:
    name: Admit post-merge diagnostics
    needs: linux-landing-cache
    if: >-
      ${{ (github.event_name != 'workflow_dispatch' || !inputs.cache_only)
        && !inputs.software_presentation && !inputs.device_loss }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
    outputs:
      run_diagnostics: ${{ steps.queue.outputs.run_diagnostics }}
    steps:
      - name: Check merge-group activity
        id: queue
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          active=$(
            gh api --method GET \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${REPOSITORY}/actions/workflows/landing.yml/runs" \
              -f event=merge_group \
              -f per_page=100 \
              --jq '.workflow_runs[]
                | select(.status != "completed")
                | .id'
          )
          if [[ -z "$active" ]]; then
            run_diagnostics=true
          else
            run_diagnostics=false
          fi
          printf 'run_diagnostics=%s\n' "$run_diagnostics" >> "$GITHUB_OUTPUT"

  qualification-reuse:
    name: Resolve landed release qualification
    if: >-
      ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore: release ') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      run-id: ${{ steps.evidence.outputs.run-id }}
      run-attempt: ${{ steps.evidence.outputs.run-attempt }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Materialize verified pinned content
        uses: ./.github/actions/verified-content

      - name: Resolve complete exact-SHA qualification receipt
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/release-qualification-evidence.py resolve \
            --repository "$REPOSITORY" --source-sha "$SOURCE_SHA" \
            --output "$RUNNER_TEMP/qualification-reuse.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Retain reuse decision and fallback reason
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-reuse-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualification-reuse.json
          if-no-files-found: error
          retention-days: 14

  exact-sha-qualification:
    name: Exact-SHA qualification
    needs: [diagnostic-admission, qualification-reuse]
    if: >-
      ${{ always() && (github.event_name != 'workflow_dispatch' || !inputs.cache_only)
        && needs.diagnostic-admission.outputs.run_diagnostics == 'true' }}
    concurrency:
      group: landing-runner-priority
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/exact-sha-qualification.yml
    with:
      source-sha: ${{ github.sha }}
      qualification-run-id: ${{ needs.qualification-reuse.outputs.run-id }}
      # Landing already qualified release commits at their exact SHA. All
      # post-merge diagnostics yield their runner slots to the next candidate.
      concurrency-suffix: rolling
      publish-recording-host-cache: true
      upload-diagnostics: true

  windows-landing-cache:
    if: ${{ !inputs.device_loss }}
    name: Warm the Windows landing cache
    runs-on: windows-latest
    timeout-minutes: 45
    concurrency:
      # Queue Windows smoke may preempt this rolling producer. Releases and
      # explicit cache-bootstrap dispatches use an exact-SHA lane.
      group: "windows-landing-cache-${{ (github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'chore: release ')) && github.sha || 'rolling' }}"
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1

      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-nextest@0.9.91
          fallback: none

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        id: windows-cache
        with:
          shared-key: windows-runtime-msvc-v2

      # Swatinem intentionally drops workspace crates whose checkout mtimes
      # make them stale. Compiling every landing package here still publishes
      # their reusable registry and non-workspace dependency artifacts.
      - name: Warm dependencies for the Windows landing graph
        if: steps.windows-cache.outputs.cache-hit != 'true'
        run: |
          cargo nextest run -p clonk-game -p clonk-c4group -p clonk-platform -p clonk-core -p clonk-logging -p clonk-network --locked --no-run
          cargo clippy --profile test --no-deps -p clonk-game -p clonk-c4group -p clonk-logging -p clonk-network -p clonk-platform -p clonk-core --all-targets --locked -- -D warnings

  windows-release-tools:
    name: Windows release tooling
    needs: [windows-landing-cache, qualification-reuse]
    if: >-
      ${{ always() && !cancelled()
        && needs.windows-landing-cache.result == 'success'
        && (needs.qualification-reuse.result == 'success' || needs.qualification-reuse.result == 'skipped')
        && (github.event_name != 'workflow_dispatch' || !inputs.cache_only) }}
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    concurrency:
      # Smoke may also preempt this post-cache validation so the next queue
      # candidate never waits behind the longer shipped-runtime build.
      group: "windows-landing-cache-${{ (github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'chore: release ')) && github.sha || 'rolling' }}"
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1

      # The packaging tool is a host tool, not a shipped runtime. Match the
      # non-LTO prebuild recipe while preserving its real packaging checks.
      - name: Build the Windows packaging tool
        if: ${{ !inputs.software_presentation && needs.qualification-reuse.outputs.run-id == '' }}
        run: cargo build --profile test --locked -p xtask --features engine-tools --bin xtask-engine-tools

      - name: Configure the shipped MSVC runtime
        run: scripts/configure-msvc-runtime.sh

      - name: Restore trusted ThinLTO cache
        id: thinlto-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/clonk-msvc-thinlto
          # Release preparation changes Cargo package versions without changing
          # bitcode. Key the trusted cache by compiler/config/source instead;
          # LLD independently hashes every input before reusing an entry.
          key: clonk-msvc-thinlto-v2-windows-x64-rustc-1.98.1-llvm-22.1.8-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml', 'scripts/configure-msvc-runtime.sh', 'crates/**/*.rs') }}

      # Keep the shipped graph in its own write-capable cache action. Swatinem
      # cleans target in its post step, so nesting it with the landing-cache
      # producer would erase that producer's artifacts before publication.
      - name: Restore or publish the shipped MSVC dependency cache
        id: shipped-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: shipped-msvc-runtime-v1

      # A verified release reuses its packaged runtime. Preserve dependency and
      # ThinLTO warming when either cache is absent; install the independently
      # verified binaries after warming so validation always checks that payload.
      - name: Refresh the shipped MSVC runtime cache
        if: >-
          needs.qualification-reuse.outputs.run-id == ''
          || steps.thinlto-cache.outputs.cache-hit != 'true'
          || steps.shipped-cache.outputs.cache-hit != 'true'
        run: |
          cargo fetch --locked
          zlib_dir=$(find "${CARGO_HOME:-$HOME/.cargo}/registry/src" -maxdepth 2 -type d -name 'libz-sys-*' | head -1)/src/zlib
          if [[ ! -f "$zlib_dir/zlib.h" ]]; then
            echo "could not locate the vendored zlib headers under $zlib_dir" >&2
            exit 1
          fi
          export CFLAGS_x86_64_pc_windows_msvc="-I$zlib_dir"
          echo "CFLAGS_x86_64_pc_windows_msvc=$CFLAGS_x86_64_pc_windows_msvc" >> "$GITHUB_ENV"
          cargo build --release -p clonk-app -p clonk-game -p clonk-c4group --locked --timings

      - name: Download the independently qualified Windows runtime
        if: needs.qualification-reuse.outputs.run-id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-qualified-runtime-windows-${{ github.sha }}-${{ needs.qualification-reuse.outputs.run-id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.qualification-reuse.outputs.run-id }}
          path: target/release-qualified/windows

      - name: Verify and install the qualified Windows runtime
        if: needs.qualification-reuse.outputs.run-id != ''
        env:
          SOURCE_SHA: ${{ github.sha }}
          BUILD_RUN_ID: ${{ needs.qualification-reuse.outputs.run-id }}
          BUILD_RUN_ATTEMPT: ${{ needs.qualification-reuse.outputs.run-attempt }}
        run: |
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          tree_sha=$(git rev-parse HEAD^{tree})
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          qualified_root=target/release-qualified/windows
          python3 scripts/release-prebuild-manifest.py verify \
            --provenance-root "$GITHUB_WORKSPACE" \
            --root "$qualified_root" --manifest "$qualified_root/manifest.json" \
            --head-sha "$SOURCE_SHA" --tree-sha "$tree_sha" --version "$version" \
            --build-run-id "$BUILD_RUN_ID" --build-run-attempt "$BUILD_RUN_ATTEMPT" \
            --kind runtime --target x86_64-pc-windows-msvc \
            --file payload/c4group.exe --file payload/clonk-app.exe --file payload/clonk-game.exe
          runtime_root=target/x86_64-pc-windows-msvc/release
          mkdir -p "$runtime_root"
          for binary in c4group clonk-app clonk-game; do
            cp "$qualified_root/payload/$binary.exe" "$runtime_root/$binary.exe"
          done

      - name: Validate the shipped MSVC runtime
        run: scripts/validate-msvc-runtime.sh

      - name: Materialize verified Windows presentation content
        if: inputs.software_presentation
        uses: ./.github/actions/verified-content

      - name: Prepare Windows software presentation qualification
        if: inputs.software_presentation
        run: |
          python -m pip install Pillow

      - name: Qualify forced Windows software presentation
        if: inputs.software_presentation
        run: >-
          python scripts/run_software_presentation_smoke.py --release --check-input
          --artifact-dir target/windows-software-presentation/forced

      - name: Qualify automatic Windows software presentation
        if: ${{ !cancelled() && inputs.software_presentation }}
        run: >-
          python scripts/run_software_presentation_smoke.py --release --check-input
          --automatic-fallback --artifact-dir target/windows-software-presentation/automatic

      - name: Preserve Windows software presentation evidence
        if: ${{ always() && inputs.software_presentation }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-software-presentation
          path: target/windows-software-presentation
          if-no-files-found: error
          retention-days: 90

      - name: Publish trusted ThinLTO cache
        if: >-
          success()
          && github.ref == 'refs/heads/main'
          && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
          && steps.thinlto-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/clonk-msvc-thinlto
          key: ${{ steps.thinlto-cache.outputs.cache-primary-key }}

  cache-retention:
    name: Bound trusted workspace caches
    needs: [linux-landing-cache, exact-sha-qualification]
    if: >-
      ${{ always() && !cancelled() && github.ref == 'refs/heads/main'
        && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      actions: write
    concurrency:
      group: main-workspace-cache-retention
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bound trusted workspace build caches
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/ci-cache-retention.py --repository "$REPOSITORY" \
            --prefix clonk-ci-target-v1- --keep-per-lane 2 --max-bytes 4294967296 --apply \
            --output "$RUNNER_TEMP/ci-cache-retention.json"

      - name: Retain the cache retention receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-cache-retention-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-cache-retention.json
          if-no-files-found: error
          retention-days: 14

  latency-report:
    name: CI latency report (postmerge)
    needs:
      - device-loss
      - verify-landing-cache-bootstrap
      - content-landing-cache
      - linux-landing-cache
      - diagnostic-admission
      - qualification-reuse
      - exact-sha-qualification
      - windows-landing-cache
      - windows-release-tools
      - cache-retention
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report completed post-merge work
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          subject=$(git log -1 --format=%s)
          if [[ "$subject" == 'chore: release '* ]]; then
            release=true
          else
            release=false
          fi
          python3 scripts/ci-latency-report.py --repository "$REPOSITORY" \
            --run-id "$RUN_ID" --phase postmerge --allow-running true --history-limit 20 \
            --release "$release" --output "$RUNNER_TEMP/ci-latency-postmerge.json" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Retain the post-merge latency report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-latency-postmerge-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-latency-postmerge.json
          if-no-files-found: error
          retention-days: 14
