name: Main validation

# Long diagnostics run after the merge queue has exercised the exact landing
# tree. Their exact-SHA result blocks releases, while the next candidate can
# use the standard runner fleet immediately.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always

jobs:
  linux-landing-cache:
    name: Warm the Linux landing cache
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      # Finish the current authoritative cache before moving to the newest
      # main revision. Release commits keep an exact-SHA lane of their own.
      group: "linux-landing-cache-${{ startsWith(github.event.head_commit.message, 'chore: release ') && github.sha || 'rolling' }}"
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install native Rust dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libasound2-dev \
            libfreetype6-dev \
            libvulkan1 \
            libxmp4 \
            libudev-dev \
            mesa-vulkan-drivers \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1

      - name: Install cargo-nextest
        uses: taiki-e/install-action@7572810d7dd469b651bb7793945692cf78da5dd7 # v2.85.0
        with:
          tool: cargo-nextest@0.9.91
          fallback: none

      - name: Restore or publish the exhaustive Linux cache
        id: linux-cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: . -> target
          shared-key: full-parity

      - name: Compile the complete landing dependency graph
        if: steps.linux-cache.outputs.cache-hit != 'true'
        run: cargo nextest run --workspace --features xtask/engine-tools --no-run --locked

  coverage:
    name: Rust code coverage
    needs: linux-landing-cache
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: "main-coverage-${{ startsWith(github.event.head_commit.message, 'chore: release ') && github.sha || 'rolling' }}"
      cancel-in-progress: true
    env:
      COVERAGE_MIN_LINE_PERCENT: '79'
      COVERAGE_IGNORE_REGEX: '/(main_tests|lib_tests)/|/(parity_differential|test_game_call_ex|test_support)\.rs$'
      LLVM_PROFILE_FILE_NAME: 'clonk-%8m.profraw'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install native Rust dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libasound2-dev \
            libfreetype6-dev \
            libvulkan1 \
            libxmp4 \
            libudev-dev \
            mesa-vulkan-drivers \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
        with:
          components: llvm-tools-preview

      - name: Install cargo-nextest
        uses: taiki-e/install-action@7572810d7dd469b651bb7793945692cf78da5dd7 # v2.85.0
        with:
          tool: cargo-nextest@0.9.91
          fallback: none

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@7572810d7dd469b651bb7793945692cf78da5dd7 # v2.85.0
        with:
          tool: cargo-llvm-cov@0.8.7
          fallback: none

      # Replay/render use the ordinary landing target while coverage keeps its
      # instrumented artifacts elsewhere. This diagnostic never publishes a
      # partial cache if a newer main commit supersedes it.
      - name: Restore Linux landing cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: . -> target
          shared-key: full-parity
          save-if: false

      # The ordinary landing suite runs the replay assertion. Repeat it here
      # only to retain a fresh snapshot for the ignored render diagnostic.
      - name: Generate deterministic replay evidence
        env:
          LC_TEST_ARTIFACT_DIR: target/dev-check/replay
          LC_KEEP_PASS_ARTIFACTS: '1'
        run: |
          cargo nextest run \
            -p clonk-engine-integration-tests \
            --test engine_it \
            --locked \
            -- \
            dev_feedback_replay::real_scenario_replays_repeat_with_native_group_order \
            --exact
          snapshot=$(find target/dev-check/replay -type f -name final.json -print | sort | tail -1)
          if [[ -z "$snapshot" ]]; then
            echo "deterministic replay produced no final snapshot" >&2
            exit 1
          fi
          cp "$snapshot" target/dev-check/snapshot-final.json

      - name: Render the replay snapshot
        env:
          LC_DEV_CHECK_SNAPSHOT: target/dev-check/snapshot-final.json
          LC_DEV_CHECK_FRAME_PNG: target/dev-check/frame-final.png
          LC_DEV_CHECK_RENDER_METRICS: target/dev-check/render-metrics.json
        run: |
          cargo nextest run \
            -p clonk-frontend \
            --features dev-feedback-render \
            --test dev_feedback_render \
            --locked \
            -- \
            dev_feedback_render --ignored --exact

      - name: Collect instrumented workspace coverage
        env:
          CARGO_TARGET_DIR: target/coverage-build
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --no-report nextest \
            --workspace \
            --no-fail-fast \
            --features xtask/engine-tools \
            --locked

      - name: Generate Rust coverage reports
        env:
          CARGO_TARGET_DIR: target/coverage-build
        run: |
          mkdir -p target/coverage
          cargo llvm-cov report --lcov --output-path target/coverage/lcov.info \
            --ignore-filename-regex "$COVERAGE_IGNORE_REGEX"
          cargo llvm-cov report --html --output-dir target/coverage \
            --ignore-filename-regex "$COVERAGE_IGNORE_REGEX"

      - name: Enforce line coverage floor
        env:
          CARGO_TARGET_DIR: target/coverage-build
        run: |
          cargo llvm-cov report --fail-under-lines "$COVERAGE_MIN_LINE_PERCENT" \
            --ignore-filename-regex "$COVERAGE_IGNORE_REGEX"

      - name: Upload developer-feedback artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: developer-feedback-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/dev-check
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Rust coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/coverage
          if-no-files-found: warn
          retention-days: 14

  recording-host-oracles:
    name: Recording-host material-order oracles (macOS)
    needs: linux-landing-cache
    runs-on: macos-latest
    timeout-minutes: 45
    concurrency:
      group: "main-recording-host-${{ startsWith(github.event.head_commit.message, 'chore: release ') && github.sha || 'rolling' }}"
      cancel-in-progress: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1

      - name: Install cargo-nextest
        uses: taiki-e/install-action@7572810d7dd469b651bb7793945692cf78da5dd7 # v2.85.0
        with:
          tool: cargo-nextest@0.9.91
          fallback: none

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: . -> target
          shared-key: recording-host-oracles

      # scripts/tests/test_rust_ci_recording_host_gate.py requires every test
      # carrying the recording-host marker to appear here.
      - name: Run recording-host material-order oracles
        run: |
          cargo nextest run \
            -p clonk-app \
            -p clonk-engine-integration-tests \
            -p clonk-frontend-unit-tests \
            --bin clonk-app \
            --test engine_it \
            --test frontend_inline \
            --locked \
            -E 'test(/(alchemy_real_scenario_subcases_batch_4|app_virtual_keyboard_completes_real_tutorial02_route|committed_real_scenario_replays_are_deterministic|real_tutorial_seven_acid_rain_matches_cpp_animated_pxs_sequence|tutorial02_virtual_player_completes_the_real_tutorial_route|tutorial07_seed_zero_landscape_matches_cpp_surface8)$/)'

  windows-release-tools:
    name: Windows release tooling
    runs-on: windows-latest
    timeout-minutes: 45
    concurrency:
      # This job is the authoritative producer for the cache consumed by both
      # Windows landing jobs, so a newer push must not interrupt its save.
      group: "windows-landing-cache-${{ startsWith(github.event.head_commit.message, 'chore: release ') && github.sha || 'rolling' }}"
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1

      - uses: taiki-e/install-action@7572810d7dd469b651bb7793945692cf78da5dd7 # v2.85.0
        with:
          tool: cargo-nextest@0.9.91
          fallback: none

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: windows-runtime-msvc

      - name: Refresh Windows smoke-test cache
        run: cargo nextest run -p clonk-game -p clonk-c4group -p clonk-platform -p clonk-core -p clonk-logging --locked --no-fail-fast

      # Release invokes this binary on the Windows host. Build its real release
      # graph here without serializing it ahead of the merge-critical runtime.
      - name: Build the Windows packaging tool
        run: cargo build --release --locked -p xtask --features engine-tools --bin xtask-engine-tools

      # This exact graph is the merge queue's long Windows path. Rebuilding it
      # after landing keeps the trusted cache current without letting ephemeral
      # queue refs consume the repository cache quota.
      - name: Refresh the shipped MSVC runtime cache
        env:
          CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
          RUSTFLAGS: -C target-feature=+crt-static
          _LINK_: /DEBUG:NONE /OPT:REF,ICF /TIME
        run: |
          cargo fetch --locked
          zlib_dir=$(find "${CARGO_HOME:-$HOME/.cargo}/registry/src" -maxdepth 2 -type d -name 'libz-sys-*' | head -1)/src/zlib
          if [[ ! -f "$zlib_dir/zlib.h" ]]; then
            echo "could not locate the vendored zlib headers under $zlib_dir" >&2
            exit 1
          fi
          export CFLAGS_x86_64_pc_windows_msvc="-I$zlib_dir"
          cargo build --release -p clonk-app -p clonk-game -p clonk-c4group --locked --timings
