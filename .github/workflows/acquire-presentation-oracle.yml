# Temporary: re-records the presentation oracle on macOS, the platform the
# accepted bundle was originally captured on, so the only variable that changes
# is the staged runtime content order (clonk-org/clonk-rs#1466).
#
# Delete this workflow once the bundle it produces has landed.
name: Acquire presentation oracle

on:
  push:
    branches:
      - acquire/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    name: Acquire presentation oracle (macOS)
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pinned oracle commit lives in this repository's history, so the
          # clone cannot be shallow: `git worktree add` has to reach it.
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Check out the pinned oracle
        run: |
          set -euo pipefail
          revision="$(grep -oE '^ORACLE_SOURCE_COMMIT = "[0-9a-f]{40}"' \
            scripts/acquire_presentation_oracle.py | grep -oE '[0-9a-f]{40}')"
          echo "oracle revision: $revision"
          git worktree add --detach "$RUNNER_TEMP/oracle" "$revision"

      - name: Install build dependencies
        run: |
          set -euo pipefail
          brew install ninja fmt openssl@3 sdl2 libpng jpeg freetype
          ls -d /opt/homebrew/opt/fmt/lib/cmake/fmt

      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0

      - name: Acquire
        run: |
          set -euo pipefail
          python3 scripts/acquire_presentation_oracle.py acquire \
            --oracle-root "$RUNNER_TEMP/oracle" \
            --output-dir "$RUNNER_TEMP/presentation-acquire" \
            --accept

      - name: Show what changed
        if: always()
        run: git status --porcelain -- compat/presentation | head -50

      - name: Upload the acquired bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5.0.0
        with:
          name: presentation-oracle-bundle
          path: |
            compat/presentation
          if-no-files-found: error
          retention-days: 7

      - name: Upload the acquisition working tree on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5.0.0
        with:
          name: presentation-acquire-debug
          path: ${{ runner.temp }}/presentation-acquire
          if-no-files-found: warn
          retention-days: 7
