name: Release build

on:
  workflow_call:
    inputs:
      source-sha:
        description: The exact commit to package
        required: true
        type: string
      version:
        description: The release version used in platform artifact names
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always

jobs:
  # The host packaging tools do not contain shipped code. Build them with the
  # non-LTO test profile, in parallel with the release runtimes they package.
  tool:
    name: Build packaging tool / ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: ubuntu-latest
            tool_path: target/debug/xtask-engine-tools
          - name: windows
            runner: windows-latest
            tool_path: target/debug/xtask-engine-tools.exe
          - name: macos
            runner: macos-latest
            tool_path: target/debug/xtask-engine-tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1

      # A merge-group ref cannot publish a reusable build cache. Restore only
      # from the trusted-main producers that own each platform's build graph.
      - name: Restore trusted-main Linux build cache
        if: matrix.name == 'linux'
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: full-parity
          save-if: false

      - name: Restore trusted-main Windows build cache
        if: matrix.name == 'windows'
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: windows-runtime-msvc
          save-if: false

      - name: Restore trusted-main macOS build cache
        if: matrix.name == 'macos'
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: recording-host-oracles
          save-if: false

      - name: Install Linux build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libasound2-dev \
            libudev-dev \
            pkg-config

      # Running `cargo run` with CARGO_BUILD_TARGET set would build the tool
      # for a shipped target and then try to execute it on the host.
      - name: Build the packaging tool
        run: cargo build --profile test --locked -p xtask --features engine-tools --bin xtask-engine-tools

      # These caches are immutable, exact inputs to this workflow run. Omitting
      # the attempt lets "re-run failed jobs" reuse successful producer jobs;
      # the run ID still prevents any other candidate from restoring them.
      - name: Hand off the packaging tool
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.tool_path }}
          key: release-tool-${{ inputs.source-sha }}-${{ github.run_id }}-${{ matrix.name }}

  # Four independent compile lanes keep each shipped target byte-for-byte
  # native while removing tool builds and the other macOS architecture from
  # its critical path.
  runtime:
    name: Build runtime / ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: ubuntu-latest
            runtime_path: |
              target/release/clonk-app
              target/release/clonk-game
              target/release/c4group
          - name: windows
            runner: windows-latest
            runtime_path: |
              target/x86_64-pc-windows-msvc/release/clonk-app.exe
              target/x86_64-pc-windows-msvc/release/clonk-game.exe
              target/x86_64-pc-windows-msvc/release/c4group.exe
          - name: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            runtime_path: |
              target/aarch64-apple-darwin/release/clonk-app
              target/aarch64-apple-darwin/release/clonk-game
              target/aarch64-apple-darwin/release/c4group
          - name: macos-x86_64
            runner: macos-latest
            target: x86_64-apple-darwin
            runtime_path: |
              target/x86_64-apple-darwin/release/clonk-app
              target/x86_64-apple-darwin/release/clonk-game
              target/x86_64-apple-darwin/release/c4group
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1

      - name: Restore trusted-main Linux runtime cache
        if: matrix.name == 'linux'
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: full-parity
          save-if: false

      - name: Restore trusted-main Windows runtime cache
        if: matrix.name == 'windows'
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: windows-runtime-msvc
          save-if: false

      - name: Restore trusted-main macOS runtime cache
        if: startsWith(matrix.name, 'macos-')
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: recording-host-oracles
          save-if: false

      - name: Install Linux build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libasound2-dev \
            libudev-dev \
            pkg-config

      - name: Install the macOS runtime target
        if: startsWith(matrix.name, 'macos-')
        run: rustup target add ${{ matrix.target }}

      - name: Configure the shipped MSVC runtime
        if: matrix.name == 'windows'
        run: scripts/configure-msvc-runtime.sh

      - name: Restore trusted-main ThinLTO cache
        if: matrix.name == 'windows'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/clonk-msvc-thinlto
          # Release preparation changes Cargo package versions without changing
          # bitcode. LLD independently hashes every input before reusing it.
          key: clonk-msvc-thinlto-v2-windows-x64-rustc-1.97.1-llvm-22.1.6-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml', 'scripts/configure-msvc-runtime.sh', 'crates/**/*.rs', 'third_party/**/*.rs') }}

      - name: Restore shipped MSVC dependency cache
        if: matrix.name == 'windows'
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: shipped-msvc-runtime-v1
          save-if: false

      - name: Build the Linux runtime
        if: matrix.name == 'linux'
        run: cargo build --release --locked -p clonk-app -p clonk-game -p clonk-c4group

      - name: Build the Windows runtime
        if: matrix.name == 'windows'
        run: |
          # freetype-sys hardcodes a relative `libz-sys/src/zlib` include that
          # is absent from its published crate. Point it at the vendored copy.
          cargo fetch --locked
          zlib_dir=$(find "${CARGO_HOME:-$HOME/.cargo}/registry/src" -maxdepth 2 -type d -name 'libz-sys-*' | head -1)/src/zlib
          if [[ ! -f "$zlib_dir/zlib.h" ]]; then
            echo "could not locate the vendored zlib headers under $zlib_dir" >&2
            exit 1
          fi
          export CFLAGS_x86_64_pc_windows_msvc="-I$zlib_dir"
          cargo build --release --locked -p clonk-app -p clonk-game -p clonk-c4group

      - name: Build the macOS arm64 runtime
        if: matrix.name == 'macos-arm64'
        run: cargo build --release --locked -p clonk-app -p clonk-game -p clonk-c4group --target aarch64-apple-darwin

      - name: Build the macOS x86_64 runtime
        if: matrix.name == 'macos-x86_64'
        run: cargo build --release --locked -p clonk-app -p clonk-game -p clonk-c4group --target x86_64-apple-darwin

      # The audit runs on the runner that produced the binaries, while its LLD
      # cache and Visual Studio inspection tools are still present.
      - name: Validate the shipped MSVC runtime
        if: matrix.name == 'windows'
        run: scripts/validate-msvc-runtime.sh

      - name: Hand off the validated runtime
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.runtime_path }}
          key: release-runtime-${{ inputs.source-sha }}-${{ github.run_id }}-${{ matrix.name }}

  # Packaging waits for every compile lane so no partial platform set can be
  # published. The only cross-job inputs are immutable caches named for this
  # exact workflow run; a miss fails closed.
  package:
    name: Package ${{ matrix.name }}
    needs: [tool, runtime]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: ubuntu-latest
            artifact: desktop-linux
            tool_path: target/debug/xtask-engine-tools
          - name: windows
            runner: windows-latest
            artifact: desktop-windows
            tool_path: target/debug/xtask-engine-tools.exe
          - name: macos
            runner: macos-latest
            artifact: desktop-macos
            tool_path: target/debug/xtask-engine-tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The resolved commit, not a tag: no tag exists until these exact
          # builds have produced and qualified real artifacts.
          ref: ${{ inputs.source-sha }}
          # Packaging copies the tracked game data. This works only while the
          # clonk-rs-content submodule remains public.
          submodules: recursive
          persist-credentials: false

      - name: Validate the release source
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "requested release version is invalid: ${REQUESTED_VERSION}" >&2
            exit 1
          fi
          actual_version=$(python3 - <<'PY'
          import re
          from pathlib import Path

          text = Path("Cargo.toml").read_text(encoding="utf-8")
          section = re.search(r"^\[workspace\.package\]$(.*?)(?=^\[)", text, re.M | re.S)
          print(re.search(r'^version = "([^"]+)"$', section.group(1), re.M).group(1))
          PY
          )
          if [[ "$actual_version" != "$REQUESTED_VERSION" ]]; then
            echo "workspace version ${actual_version} does not match requested release ${REQUESTED_VERSION}" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1

      - name: Install Linux packaging dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libasound2-dev \
            libudev-dev \
            pkg-config

      # `makensis` is not on the Windows image. Chocolatey's package runs the
      # upstream installer rather than shimming a binary, so add it to PATH.
      - name: Install the Windows installer toolchain
        if: matrix.name == 'windows'
        run: |
          for attempt in 1 2 3; do
            if choco install nsis --version 3.12.0 --yes --no-progress; then
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "Chocolatey failed to install pinned NSIS after $attempt attempts" >&2
              exit 1
            fi
            echo "Chocolatey NSIS install failed on attempt $attempt; retrying" >&2
            sleep "$((attempt * 10))"
          done
          nsis_dir='/c/Program Files (x86)/NSIS'
          if [[ ! -x "$nsis_dir/makensis.exe" ]]; then
            echo "chocolatey installed nsis but $nsis_dir/makensis.exe is missing" >&2
            exit 1
          fi
          nsis_version=$(MSYS2_ARG_CONV_EXCL='*' "$nsis_dir/makensis.exe" /VERSION | tr -d '\r')
          if [[ "$nsis_version" != 'v3.12' ]]; then
            echo "expected NSIS v3.12, found: $nsis_version" >&2
            exit 1
          fi
          echo 'C:\Program Files (x86)\NSIS' >> "$GITHUB_PATH"

      - name: Restore the packaging tool
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.tool_path }}
          key: release-tool-${{ inputs.source-sha }}-${{ github.run_id }}-${{ matrix.name }}
          fail-on-cache-miss: true

      - name: Restore the Linux runtime
        if: matrix.name == 'linux'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/release/clonk-app
            target/release/clonk-game
            target/release/c4group
          key: release-runtime-${{ inputs.source-sha }}-${{ github.run_id }}-linux
          fail-on-cache-miss: true

      - name: Restore the Windows runtime
        if: matrix.name == 'windows'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/x86_64-pc-windows-msvc/release/clonk-app.exe
            target/x86_64-pc-windows-msvc/release/clonk-game.exe
            target/x86_64-pc-windows-msvc/release/c4group.exe
          key: release-runtime-${{ inputs.source-sha }}-${{ github.run_id }}-windows
          fail-on-cache-miss: true

      - name: Restore the macOS arm64 runtime
        if: matrix.name == 'macos'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/aarch64-apple-darwin/release/clonk-app
            target/aarch64-apple-darwin/release/clonk-game
            target/aarch64-apple-darwin/release/c4group
          key: release-runtime-${{ inputs.source-sha }}-${{ github.run_id }}-macos-arm64
          fail-on-cache-miss: true

      - name: Restore the macOS x86_64 runtime
        if: matrix.name == 'macos'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/x86_64-apple-darwin/release/clonk-app
            target/x86_64-apple-darwin/release/clonk-game
            target/x86_64-apple-darwin/release/c4group
          key: release-runtime-${{ inputs.source-sha }}-${{ github.run_id }}-macos-x86_64
          fail-on-cache-miss: true

      # The only pass that emits `planet`. Its archive is prefix-free and
      # therefore byte-identical on every triple. `content` is published by
      # clonk-org/clonk-rs-content and is deliberately not duplicated here.
      - name: Package Linux
        if: matrix.name == 'linux'
        run: ./target/debug/xtask-engine-tools package --skip-build --components=all

      - name: Package Windows installer
        if: matrix.name == 'windows'
        env:
          CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
          VERSION: ${{ inputs.version }}
        run: |
          ./target/debug/xtask-engine-tools.exe package --skip-build --no-archive --components=engine

          # Native paths for a native tool: under Git Bash `$PWD` is a POSIX
          # path makensis cannot resolve, and implicit MSYS rewriting would
          # make the build depend on heuristics.
          payload=$(cygpath -w "$PWD/target/dist/clonk-rust")
          outfile=$(cygpath -w "$PWD/target/dist/clonk-rust-$VERSION-x86_64-windows-setup.exe")
          icon=$(cygpath -w "$PWD/target/dist/clonk-rust-installer.ico")
          makensis -NOCD \
            -DVERSION="$VERSION" \
            -DPAYLOAD="$payload" \
            -DOUTFILE="$outfile" \
            -DICON="$icon" \
            scripts/windows-installer.nsi

      # The prebuilt architecture slices are fused once, then the universal
      # bundle is signed and used for both the component and disk image.
      - name: Package macOS
        if: matrix.name == 'macos'
        env:
          CARGO_BUILD_TARGET: universal-apple-darwin
        run: ./target/debug/xtask-engine-tools package --skip-build --components=engine

      # `lipo` invalidates each slice's linker signature, so package signs the
      # fused binaries. This separately proves every shipped binary is fat.
      - name: Check the macOS build is universal
        if: matrix.name == 'macos'
        run: |
          shopt -s nullglob
          engines=(target/dist/components/update-engine-*-universal-apple-darwin.zip)
          if [[ ${#engines[@]} -ne 1 ]]; then
            echo "expected exactly one universal engine component, found ${#engines[@]}" >&2
            exit 1
          fi
          rm -rf target/dist/universal-check
          unzip -q "${engines[0]}" -d target/dist/universal-check
          for binary in clonk-app clonk-game c4group; do
            path="target/dist/universal-check/Contents/MacOS/$binary"
            info=$(lipo -info "$path")
            echo "$info"
            for arch in arm64 x86_64; do
              case "$info" in
                *" $arch"*) ;;
                *) echo "$binary is missing the $arch slice" >&2; exit 1 ;;
              esac
            done
          done
          rm -rf target/dist/universal-check

      - name: Check the artifacts look real
        run: |
          shopt -s nullglob
          assets=(target/dist/clonk-rust-*.zip target/dist/clonk-rust-*.dmg target/dist/clonk-rust-*.exe)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "packaging produced no assets" >&2
            exit 1
          fi
          for asset in "${assets[@]}"; do
            size=$(wc -c < "$asset")
            # The payload is ~240 MB of game data; anything tiny means the
            # packaging silently produced an empty container.
            if [[ "$size" -lt 100000000 ]]; then
              echo "$asset is only $size bytes" >&2
              exit 1
            fi
            echo "ok $(basename "$asset") $size bytes"
          done

      # Update archives are smaller, so each kind has its own deliberately low
      # empty-container floor. Unknown kinds fail closed.
      - name: Check the update components look real
        run: |
          shopt -s nullglob
          components=(target/dist/components/*.zip)
          if [[ ${#components[@]} -eq 0 ]]; then
            echo "packaging produced no update components" >&2
            exit 1
          fi
          for component in "${components[@]}"; do
            name=$(basename "$component")
            case "$name" in
              update-planet-*) floor=10000000 ;;
              update-engine-*-universal-*) floor=10000000 ;;
              update-engine-*) floor=5000000 ;;
              *) echo "$name matches no known update component" >&2; exit 1 ;;
            esac
            size=$(wc -c < "$component")
            if [[ "$size" -lt "$floor" ]]; then
              echo "$name is only $size bytes, below the $floor floor" >&2
              exit 1
            fi
            echo "ok $name $size bytes"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/dist/clonk-rust-*.zip
            target/dist/clonk-rust-*.dmg
            target/dist/clonk-rust-*.exe
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

      # Keep update components separate so upload-artifact's least-common-
      # ancestor rule cannot silently add a directory to the desktop assets.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: components-${{ matrix.artifact }}
          path: target/dist/components/*.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

      # publish generates the manifest with this exact Linux host tool instead
      # of compiling xtask again. The other two matrix legs skip this step.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.name == 'linux'
        with:
          name: release-tool
          path: target/debug/xtask-engine-tools
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true
