name: Release build

on:
  workflow_call:
    inputs:
      source-sha:
        description: The exact merge-group commit to package
        required: true
        type: string
      tree-sha:
        description: The exact merge-group tree compiled by the sibling prebuild
        required: true
        type: string
      version:
        description: The release version used in platform artifact names
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always

jobs:
  # The sibling exact-SHA prebuild owns compilation. This action only restores,
  # verifies and packages the immutable same-run inputs.
  package:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: ubuntu-latest
            artifact: desktop-linux
            runtime_artifact: release-prebuild-runtime-linux
            runtime_target: x86_64-unknown-linux-gnu
            runtime_suffix: ''
            tool_artifact: release-prebuild-tool-linux
            tool_filename: xtask-engine-tools
            tool_path: target/debug/xtask-engine-tools
          - name: windows
            runner: windows-latest
            artifact: desktop-windows
            runtime_artifact: release-prebuild-runtime-windows
            runtime_target: x86_64-pc-windows-msvc
            runtime_suffix: .exe
            tool_artifact: release-prebuild-tool-windows
            tool_filename: xtask-engine-tools.exe
            tool_path: target/debug/xtask-engine-tools.exe
          - name: macos
            runner: macos-latest
            artifact: desktop-macos
            runtime_artifact: release-prebuild-runtime-macos-arm64
            runtime_target: aarch64-apple-darwin
            runtime_suffix: ''
            runtime_artifact_2: release-prebuild-runtime-macos-x86_64
            runtime_target_2: x86_64-apple-darwin
            tool_artifact: release-prebuild-tool-macos
            tool_filename: xtask-engine-tools
            tool_path: target/debug/xtask-engine-tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The resolved commit, not a tag: no tag exists until these exact
          # builds have produced and qualified real artifacts.
          ref: ${{ inputs.source-sha }}
          # Packaging copies the tracked game data. This works only while the
          # clonk-rs-content submodule remains public.
          submodules: recursive
          persist-credentials: false

      - name: Validate the release source
        env:
          MERGE_SHA: ${{ github.sha }}
          REQUESTED_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source-sha }}
          TREE_SHA: ${{ inputs.tree-sha }}
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ || ! "$TREE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release source identity is malformed" >&2
            exit 1
          fi
          if [[ "$SOURCE_SHA" != "$MERGE_SHA" ]]; then
            echo "release package source is not the active merge-group commit" >&2
            exit 1
          fi
          actual_sha=$(git rev-parse HEAD)
          actual_tree=$(git rev-parse 'HEAD^{tree}')
          if [[ "$actual_sha" != "$SOURCE_SHA" || "$actual_tree" != "$TREE_SHA" ]]; then
            echo "checked-out merge candidate does not match the prebuilt release tree" >&2
            exit 1
          fi
          if [[ ! "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "requested release version is invalid: ${REQUESTED_VERSION}" >&2
            exit 1
          fi
          actual_version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [[ "$actual_version" != "$REQUESTED_VERSION" ]]; then
            echo "workspace version ${actual_version} does not match requested release ${REQUESTED_VERSION}" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0

      - name: Install Linux packaging dependencies
        if: matrix.name == 'linux'
        timeout-minutes: 10
        run: scripts/install-apt-packages.sh libasound2-dev libudev-dev pkg-config

      # The hosted image does not carry the required NSIS version, so install
      # the verified upstream portable distribution and add it to PATH.
      - name: Install the Windows installer toolchain
        if: matrix.name == 'windows'
        run: scripts/install-nsis.sh

      - name: Restore the packaging tool
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/release-prebuild/${{ matrix.tool_artifact }}
          key: release-prebuild-${{ matrix.tool_artifact }}-${{ inputs.source-sha }}-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Restore the runtime
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/release-prebuild/${{ matrix.runtime_artifact }}
          key: release-prebuild-${{ matrix.runtime_artifact }}-${{ inputs.source-sha }}-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Restore the macOS x86_64 runtime
        if: matrix.name == 'macos'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/release-prebuild/${{ matrix.runtime_artifact_2 }}
          key: release-prebuild-${{ matrix.runtime_artifact_2 }}-${{ inputs.source-sha }}-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Verify and install the prebuilt inputs
        env:
          SOURCE_SHA: ${{ inputs.source-sha }}
          TREE_SHA: ${{ inputs.tree-sha }}
          VERSION: ${{ inputs.version }}
        run: |
          tool_root="target/release-prebuild/${{ matrix.tool_artifact }}"
          runtime_root="target/release-prebuild/${{ matrix.runtime_artifact }}"
          python3 scripts/release-prebuild-manifest.py verify \
            --root "$tool_root" \
            --manifest "$tool_root/manifest.json" \
            --head-sha "$SOURCE_SHA" \
            --tree-sha "$TREE_SHA" \
            --version "$VERSION" \
            --kind tool \
            --target host \
            --file "payload/${{ matrix.tool_filename }}"
          python3 scripts/release-prebuild-manifest.py verify \
            --root "$runtime_root" \
            --manifest "$runtime_root/manifest.json" \
            --head-sha "$SOURCE_SHA" \
            --tree-sha "$TREE_SHA" \
            --version "$VERSION" \
            --kind runtime \
            --target "${{ matrix.runtime_target }}" \
            --file "payload/c4group${{ matrix.runtime_suffix }}" \
            --file "payload/clonk-app${{ matrix.runtime_suffix }}" \
            --file "payload/clonk-game${{ matrix.runtime_suffix }}"

          case "${{ matrix.name }}" in
            linux)
              mkdir -p target/debug target/release
              cp "$tool_root/payload/xtask-engine-tools" target/debug/
              cp "$runtime_root"/payload/{c4group,clonk-app,clonk-game} target/release/
              chmod +x target/debug/xtask-engine-tools target/release/{c4group,clonk-app,clonk-game}
              ;;
            windows)
              mkdir -p target/debug target/x86_64-pc-windows-msvc/release
              cp "$tool_root/payload/xtask-engine-tools.exe" target/debug/
              cp "$runtime_root"/payload/{c4group,clonk-app,clonk-game}.exe \
                target/x86_64-pc-windows-msvc/release/
              ;;
            macos)
              runtime_root_2="target/release-prebuild/${{ matrix.runtime_artifact_2 }}"
              python3 scripts/release-prebuild-manifest.py verify \
                --root "$runtime_root_2" \
                --manifest "$runtime_root_2/manifest.json" \
                --head-sha "$SOURCE_SHA" \
                --tree-sha "$TREE_SHA" \
                --version "$VERSION" \
                --kind runtime \
                --target "${{ matrix.runtime_target_2 }}" \
                --file payload/c4group \
                --file payload/clonk-app \
                --file payload/clonk-game
              mkdir -p target/debug \
                target/aarch64-apple-darwin/release \
                target/x86_64-apple-darwin/release
              cp "$tool_root/payload/xtask-engine-tools" target/debug/
              cp "$runtime_root"/payload/{c4group,clonk-app,clonk-game} \
                target/aarch64-apple-darwin/release/
              cp "$runtime_root_2"/payload/{c4group,clonk-app,clonk-game} \
                target/x86_64-apple-darwin/release/
              chmod +x target/debug/xtask-engine-tools \
                target/aarch64-apple-darwin/release/{c4group,clonk-app,clonk-game} \
                target/x86_64-apple-darwin/release/{c4group,clonk-app,clonk-game}
              ;;
            *)
              echo "unsupported release platform: ${{ matrix.name }}" >&2
              exit 1
              ;;
          esac

      # The only pass that emits `planet`. Its archive is prefix-free and
      # therefore byte-identical on every triple. `content` is published by
      # clonk-org/clonk-rs-content and is deliberately not duplicated here.
      - name: Package Linux
        if: matrix.name == 'linux'
        run: ./target/debug/xtask-engine-tools package --skip-build --components=all

      - name: Package Windows installer
        if: matrix.name == 'windows'
        env:
          CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
          VERSION: ${{ inputs.version }}
        run: |
          ./target/debug/xtask-engine-tools.exe package --skip-build --no-archive --components=engine

          # Native paths for a native tool: under Git Bash `$PWD` is a POSIX
          # path makensis cannot resolve, and implicit MSYS rewriting would
          # make the build depend on heuristics.
          payload=$(cygpath -w "$PWD/target/dist/clonk-rust")
          outfile=$(cygpath -w "$PWD/target/dist/clonk-rust-$VERSION-x86_64-windows-setup.exe")
          icon=$(cygpath -w "$PWD/target/dist/clonk-rust-installer.ico")
          makensis -NOCD \
            -DVERSION="$VERSION" \
            -DPAYLOAD="$payload" \
            -DOUTFILE="$outfile" \
            -DICON="$icon" \
            scripts/windows-installer.nsi

      # The prebuilt architecture slices are fused once, then the universal
      # bundle is signed and used for both the component and disk image.
      - name: Package macOS
        if: matrix.name == 'macos'
        env:
          CARGO_BUILD_TARGET: universal-apple-darwin
        run: ./target/debug/xtask-engine-tools package --skip-build --components=engine

      # `lipo` invalidates each slice's linker signature, so package signs the
      # fused binaries. This separately proves every shipped binary is fat.
      - name: Check the macOS build is universal
        if: matrix.name == 'macos'
        run: |
          shopt -s nullglob
          engines=(target/dist/components/update-engine-*-universal-apple-darwin.zip)
          if [[ ${#engines[@]} -ne 1 ]]; then
            echo "expected exactly one universal engine component, found ${#engines[@]}" >&2
            exit 1
          fi
          rm -rf target/dist/universal-check
          unzip -q "${engines[0]}" -d target/dist/universal-check
          for binary in clonk-app clonk-game c4group; do
            path="target/dist/universal-check/Contents/MacOS/$binary"
            info=$(lipo -info "$path")
            echo "$info"
            for arch in arm64 x86_64; do
              case "$info" in
                *" $arch"*) ;;
                *) echo "$binary is missing the $arch slice" >&2; exit 1 ;;
              esac
            done
          done
          rm -rf target/dist/universal-check

      - name: Check the artifacts look real
        run: |
          shopt -s nullglob
          assets=(target/dist/clonk-rust-*.zip target/dist/clonk-rust-*.dmg target/dist/clonk-rust-*.exe)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "packaging produced no assets" >&2
            exit 1
          fi
          for asset in "${assets[@]}"; do
            size=$(wc -c < "$asset")
            # The payload is ~240 MB of game data; anything tiny means the
            # packaging silently produced an empty container.
            if [[ "$size" -lt 100000000 ]]; then
              echo "$asset is only $size bytes" >&2
              exit 1
            fi
            echo "ok $(basename "$asset") $size bytes"
          done

      # Update archives are smaller, so each kind has its own deliberately low
      # empty-container floor. Unknown kinds fail closed.
      - name: Check the update components look real
        run: |
          shopt -s nullglob
          components=(target/dist/components/*.zip)
          if [[ ${#components[@]} -eq 0 ]]; then
            echo "packaging produced no update components" >&2
            exit 1
          fi
          for component in "${components[@]}"; do
            name=$(basename "$component")
            case "$name" in
              update-planet-*) floor=10000000 ;;
              update-engine-*-universal-*) floor=10000000 ;;
              update-engine-*) floor=5000000 ;;
              *) echo "$name matches no known update component" >&2; exit 1 ;;
            esac
            size=$(wc -c < "$component")
            if [[ "$size" -lt "$floor" ]]; then
              echo "$name is only $size bytes, below the $floor floor" >&2
              exit 1
            fi
            echo "ok $name $size bytes"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/dist/clonk-rust-*.zip
            target/dist/clonk-rust-*.dmg
            target/dist/clonk-rust-*.exe
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

      # Keep update components separate so upload-artifact's least-common-
      # ancestor rule cannot silently add a directory to the desktop assets.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: components-${{ matrix.artifact }}
          path: target/dist/components/*.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

      # publish generates the manifest with this exact Linux host tool instead
      # of compiling xtask again. The other two matrix legs skip this step.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.name == 'linux'
        with:
          name: release-tool
          path: target/debug/xtask-engine-tools
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true
