name: Bug report
description: Something is broken, slow, or crashes
labels:
  - bug
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, and what happened instead. Logs, screenshots, or a replay help.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How do we reproduce it?
      placeholder: |
        1. Start Eke Reloaded / HarpoonRace
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and OS
      placeholder: v0.3.0 on macOS 15 — or a commit hash
    validations:
      required: true
