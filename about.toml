# cargo-about 0.9.1 configuration for the two binary release graphs.
#
# This selects one valid redistribution license from each OR expression while
# retaining every term required by AND expressions. Native libraries bundled
# by a sys crate have their own notices under licenses/third_party/.
accepted = [
    "Apache-2.0",
    "MIT",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]
ignore-build-dependencies = false
ignore-dev-dependencies = true
ignore-transitive-dependencies = false

[private]
ignore = true
