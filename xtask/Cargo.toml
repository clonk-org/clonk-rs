[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true
autobins = false
default-run = "xtask"

[features]
default = []
engine-tools = [
    "dep:clonk-core",
    "dep:clonk-engine",
    "dep:clonk-icon",
    "dep:clonk-network",
    "dep:clonk-logging",
    "dep:clonk-resources",
    "dep:flate2",
    "dep:image",
    "dep:tracing",
    "dep:walkdir",
    "dep:zip",
    "dep:ring",
    "dep:serde",
    "dep:serde_json",
    "dep:toml",
]

[dependencies]
anyhow = "1"
# Feature set matches every other consumer in the workspace so the shared
# dependency graph stays unified.
image = { version = "0.25", default-features = false, features = ["bmp", "jpeg", "png"], optional = true }
walkdir = { version = "2", optional = true }
flate2 = { version = "1", default-features = false, features = ["rust_backend"], optional = true }
zip = { version = "8.1", default-features = false, features = ["deflate-flate2"], optional = true }
# Only for `ENGINE_VERSION`, which the update manifest carries so a client can
# refuse content built for a newer engine.
clonk-core = { path = "../crates/clonk-core", optional = true }
clonk-engine = { path = "../crates/clonk-engine", optional = true }
# Owns the shared icon derivation, so the bundle `.icns` this tool renders is
# cut from the same image as the window icon and the Windows resource.
clonk-icon = { path = "../crates/clonk-icon", optional = true }
clonk-network = { path = "../crates/clonk-network", optional = true }
clonk-logging = { path = "../crates/clonk-logging", optional = true }
clonk-resources = { path = "../crates/clonk-resources", optional = true }
tracing = { version = "0.1", optional = true }
# Already in the lock via rustls; used here for SHA-256 over component
# archives, so no new third-party code is pulled in. There is no manifest
# signature — see the trust-model note in `src/manifest.rs`.
ring = { version = "0.17", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
# Reads the content submodule's packs.toml, the list of what an installer
# copies out of it.
toml = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3"

[lib]
doctest = false

[[bin]]
name = "xtask"
path = "src/dispatcher.rs"
test = false

[[bin]]
name = "xtask-engine-tools"
path = "src/main.rs"
required-features = ["engine-tools"]
test = true
