[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true
autobins = false
default-run = "xtask"

[features]
default = []
engine-tools = [
    "dep:clonk-engine",
    "dep:clonk-logging",
    "dep:clonk-resources",
    "dep:image",
    "dep:tracing",
    "dep:walkdir",
    "dep:zip",
]

[dependencies]
anyhow = "1"
# Feature set matches every other consumer in the workspace so the shared
# dependency graph stays unified.
image = { version = "0.24", default-features = false, features = ["bmp", "jpeg", "png"], optional = true }
walkdir = { version = "2", optional = true }
zip = { version = "0.6", default-features = false, features = ["deflate"], optional = true }
clonk-engine = { path = "../crates/clonk-engine", optional = true }
clonk-logging = { path = "../crates/clonk-logging", optional = true }
clonk-resources = { path = "../crates/clonk-resources", optional = true }
tracing = { version = "0.1", optional = true }

[dev-dependencies]
tempfile = "3"

[lib]
doctest = false

[[bin]]
name = "xtask"
path = "src/dispatcher.rs"
test = false

[[bin]]
name = "xtask-engine-tools"
path = "src/main.rs"
required-features = ["engine-tools"]
test = true
