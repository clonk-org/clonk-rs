[workspace]
members = [
    "crates/lc-core",
    "crates/lc-resources",
    "crates/lc-script",
    "crates/lc-engine",
    "crates/lc-engine-core",
    "crates/lc-app",
    "crates/lc-graphics",
    "crates/lc-frontend",
    "crates/lc-launcher",
    "crates/lc-launcher-ui",
    "crates/lc-launcher-shell",
    "crates/lc-audio",
    "crates/lc-network",
    "crates/lc-gui",
    "crates/lc-platform",
    "crates/lc-game",
    "crates/lc-scaling",
    "xtask",
]
resolver = "2"
default-members = ["crates/lc-app"]

# The frontend renders in software (per-pixel blits); at opt-level 0 the menu
# and boot are ~12x slower than release and unplayable. Keep dev builds
# optimized enough to run while retaining debug assertions.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
# We never step into registry deps in a debugger; line tables keep file:line
# in backtraces while skipping the expensive full-DWARF codegen at opt 3.
debug = "line-tables-only"

# Full-frame output upscaling is hot per-pixel code on the present path;
# the crate is tiny and rarely changes, so opt 3 costs no iteration time.
[profile.dev.package.lc-scaling]
opt-level = 3

# Simulation-heavy integration tests spend most of their time in workspace
# crates. A small optimization bump cuts their warm runtime substantially
# while retaining the checks that make the test profile useful.
[profile.test]
opt-level = 2
# Full DWARF dominates codegen, linking, and disk use for the very large test
# harnesses. Line tables retain source locations in failures and backtraces.
debug = "line-tables-only"
debug-assertions = true
overflow-checks = true

# Dependency frames are symbolized by their exported names; generating line
# tables for every registry crate only adds cold codegen, link, and disk work.
# Preserve the dev profile's optimized dependencies for test runtime; workspace
# crates retain line tables through the profile above.
[profile.test.package."*"]
opt-level = 3
debug = false
