[workspace]
members = [
    "crates/lc-core",
    "crates/lc-resources",
    "crates/lc-script",
    "crates/lc-engine",
    "crates/lc-app",
    "crates/lc-graphics",
    "crates/lc-frontend",
    "crates/lc-launcher",
    "crates/lc-launcher-ui",
    "crates/lc-launcher-shell",
    "crates/lc-audio",
    "crates/lc-network",
    "crates/lc-gui",
    "crates/lc-platform",
    "crates/lc-game",
    "xtask",
]
resolver = "2"
default-members = ["crates/lc-app"]

# The frontend renders in software (per-pixel blits); at opt-level 0 the menu
# and boot are ~12x slower than release and unplayable. Keep dev builds
# optimized enough to run while retaining debug assertions.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
