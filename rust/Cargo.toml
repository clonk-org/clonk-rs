[workspace]
members = [
    "crates/lc-core",
    "crates/lc-logging",
    "crates/lc-resources",
    "crates/lc-script",
    "crates/lc-engine",
    "crates/lc-engine-unit-tests",
    "crates/lc-engine-integration-tests",
    "crates/lc-engine-core",
    "crates/lc-app",
    "crates/lc-graphics",
    "crates/lc-frontend",
    "crates/lc-frontend-unit-tests",
    "crates/lc-launcher",
    "crates/lc-launcher-ui",
    "crates/lc-launcher-shell",
    "crates/lc-audio",
    "crates/lc-network",
    "crates/lc-gui",
    "crates/lc-platform",
    "crates/lc-game",
    "crates/lc-scaling",
    "xtask",
]
resolver = "2"
default-members = ["crates/lc-app"]

# Keep the ordinary edit/build loop lightly optimized. Live gameplay uses the
# `play` profile below so runtime-heavy rendering and simulation do not force
# level-3 codegen onto every development build.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
# We never step into registry deps in a debugger; line tables keep file:line
# in backtraces while skipping the expensive full-DWARF codegen at opt 3.
debug = "line-tables-only"

# Full-frame output upscaling is hot per-pixel code on the present path;
# the crate is tiny and rarely changes, so opt 3 costs no iteration time.
[profile.dev.package.lc-scaling]
opt-level = 3

# Scenario presentation and script callbacks dominate live gameplay. The
# explicit playable profile retains debug assertions and incremental reuse but
# optimizes the hot workspace crates without slowing the default compile loop.
[profile.play]
inherits = "dev"

[profile.play.package.lc-app]
opt-level = 3

[profile.play.package.lc-frontend]
opt-level = 3

[profile.play.package.lc-engine]
opt-level = 3

[profile.play.package.lc-script]
opt-level = 3

[profile.play.package.lc-graphics]
opt-level = 3

# Simulation-heavy integration tests spend most of their time in workspace
# crates. Full optimization keeps their warm runtime low, while explicitly
# disabling thin-local LTO avoids repeating an expensive whole-crate codegen
# pass across the large test harnesses.
[profile.test]
opt-level = 3
lto = "off"
# CI disables incremental compilation for cache portability. Keep the same
# broad codegen parallelism Cargo gives incremental local builds so the large
# app and engine test wrappers do not become single long LLVM/link tails.
codegen-units = 256
# Test-profile debug data increases codegen, link I/O, and target size without
# affecting assertions or runtime. Panic-site text and function symbols remain;
# use the dev profile or override CARGO_PROFILE_TEST_DEBUG when line-symbolized
# test backtraces are needed.
debug = false
debug-assertions = true
overflow-checks = true

# The test profile inherits the dev package wildcard, whose debug setting would
# otherwise win. Keep registry dependencies optimized and debug-free explicitly.
[profile.test.package."*"]
opt-level = 3
debug = false

# The main application test harness is the largest final link in the workspace.
# Level 2 keeps its gameplay-heavy tests close to fully optimized while
# avoiding the longest level-3 codegen tail on this 192k-line wrapper.
[profile.test.package.lc-app]
opt-level = 2

# The large async lc-network harness is a cold-build tail, while its complete
# suite remains only a few seconds without LLVM optimization. Skip optimization
# for this crate's test-profile copy to shorten that tail.
[profile.test.package.lc-network]
opt-level = 0

# The inline and small unit wrappers are compile-bound, so avoid LLVM
# optimization for their leaf package.
[profile.test.package.lc-engine-unit-tests]
opt-level = 0

# The integration wrapper spends most of its wall time running scenario and
# virtual-player loops. Light optimization pays for itself there without
# restoring the level-3 compiler tail for the much larger inline wrapper.
[profile.test.package.lc-engine-integration-tests]
opt-level = 1

# Keep the production frontend optimized for the app and render-heavy tests,
# while using only light optimization for its large inline unit-test wrapper.
# Level 1 keeps the 666-test software-render suite fast
# without restoring the level-3 compiler tail.
[profile.test.package.lc-frontend-unit-tests]
opt-level = 1
