[workspace]
members = [
    "crates/lc-core",
    "crates/lc-logging",
    "crates/lc-resources",
    "crates/lc-script",
    "crates/lc-engine",
    "crates/lc-engine-unit-tests",
    "crates/lc-engine-integration-tests",
    "crates/lc-engine-core",
    "crates/lc-app",
    "crates/lc-graphics",
    "crates/lc-frontend",
    "crates/lc-frontend-unit-tests",
    "crates/lc-launcher",
    "crates/lc-launcher-ui",
    "crates/lc-launcher-shell",
    "crates/lc-audio",
    "crates/lc-network",
    "crates/lc-gui",
    "crates/lc-platform",
    "crates/lc-game",
    "crates/lc-scaling",
    "xtask",
]
resolver = "2"
default-members = ["crates/lc-app"]

# The frontend renders in software (per-pixel blits); at opt-level 0 the menu
# and boot are ~12x slower than release and unplayable. Keep dev builds
# optimized enough to run while retaining debug assertions.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
# We never step into registry deps in a debugger; line tables keep file:line
# in backtraces while skipping the expensive full-DWARF codegen at opt 3.
debug = "line-tables-only"

# Full-frame output upscaling is hot per-pixel code on the present path;
# the crate is tiny and rarely changes, so opt 3 costs no iteration time.
[profile.dev.package.lc-scaling]
opt-level = 3

# Simulation-heavy integration tests spend most of their time in workspace
# crates. Full optimization keeps their warm runtime low, while explicitly
# disabling thin-local LTO avoids repeating an expensive whole-crate codegen
# pass across the large test harnesses.
[profile.test]
opt-level = 3
lto = "off"
# CI disables incremental compilation for cache portability. Keep the same
# broad codegen parallelism Cargo gives incremental local builds so the large
# app and engine test wrappers do not become single long LLVM/link tails.
codegen-units = 256
# Full DWARF dominates codegen, linking, and disk use for the very large test
# harnesses. Line tables retain source locations in failures and backtraces.
debug = "line-tables-only"
debug-assertions = true
overflow-checks = true

# Dependency frames are symbolized by their exported names; generating line
# tables for every registry crate only adds cold codegen, link, and disk work.
# Preserve the dev profile's optimized dependencies for test runtime; workspace
# crates retain line tables through the profile above.
[profile.test.package."*"]
opt-level = 3
debug = false

# The main application test harness is the largest final link in the workspace.
# Keep this explicit so future global profile changes do not accidentally add
# debug data back to the 150k-line test wrapper.
[profile.test.package.lc-app]
debug = false

# Engine line tables account for roughly 36 MiB of its test-profile rlib and
# are repeatedly processed by the large app and integration-test links.
# Function names remain available in backtraces without this per-instruction
# source mapping.
[profile.test.package.lc-engine]
debug = false

# The large async lc-network harness is a cold-build tail, while its complete
# suite remains only a few seconds without LLVM optimization. Skip optimization
# and line tables for this crate's test-profile copy to shorten that tail.
[profile.test.package.lc-network]
opt-level = 0
debug = false

# The inline and small unit wrappers are compile-bound, so avoid LLVM
# optimization and line tables for their leaf package.
[profile.test.package.lc-engine-unit-tests]
opt-level = 0
debug = false

# The integration wrapper spends most of its wall time running scenario and
# virtual-player loops. Light optimization pays for itself there without
# restoring the level-3 compiler tail for the much larger inline wrapper.
[profile.test.package.lc-engine-integration-tests]
opt-level = 1
debug = false

# Keep the production frontend optimized for the app and render-heavy tests,
# while using only light optimization and no line tables for its large inline
# unit-test wrapper. Level 1 keeps the 666-test software-render suite fast
# without restoring the level-3 compiler tail.
[profile.test.package.lc-frontend-unit-tests]
opt-level = 1
debug = false
