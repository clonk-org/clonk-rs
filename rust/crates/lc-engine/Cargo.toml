[package]
name = "lc-engine"
version = "0.1.0"
edition = "2021"

[features]
default = []
bench = ["dep:criterion"]
ffi = ["dep:tracing-subscriber"]
test-graph = ["dep:proptest"]

[dependencies]
lc-core = { path = "../lc-core" }
lc-engine-core = { path = "../lc-engine-core" }
lc-script = { path = "../lc-script" }
lc-resources = { path = "../lc-resources" }
indexmap = { version = "2", features = ["serde"] }
rand = { version = "0.8", default-features = false, features = ["std"] }
rand_core = "0.6"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.24", default-features = false, features = ["bmp", "jpeg", "png"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"], optional = true }
# Benchmark-only: keeping Criterion optional prevents `cargo test -p lc-engine`
# from changing the shared Serde feature graph for every downstream crate.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"], optional = true }
# Exposed only so lc-app's dev graph can pre-unify the features used by this
# crate's property tests. The non-optional dev dependency below still makes
# `cargo test -p lc-engine` work without an explicit feature.
proptest = { version = "1", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
# The remaining inline and integration tests name these directly.
lc-script = { path = "../lc-script" }
lc-resources = { path = "../lc-resources" }
serde_json = "1"
tempfile = "3"
proptest = { version = "1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["registry"] }
once_cell = "1"

[[bench]]
name = "engine_tick"
harness = false
required-features = ["bench"]
