[package]
name = "lc-engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
lc-script = { path = "../lc-script" }
rand = { version = "0.8", default-features = false, features = ["std", "small_rng"] }
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
