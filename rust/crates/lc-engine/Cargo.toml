[package]
name = "lc-engine"
version = "0.1.0"
edition = "2021"

[features]
default = []
ffi = ["dep:tracing-subscriber"]

[dependencies]
lc-engine-core = { path = "../lc-engine-core" }
lc-script = { path = "../lc-script" }
lc-resources = { path = "../lc-resources" }
rand = { version = "0.8", default-features = false, features = ["std"] }
rand_core = "0.6"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.24", default-features = false, features = ["bmp", "jpeg", "png"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"], optional = true }

[dev-dependencies]
# The moved lib.rs unit tests (tests/it/unit.rs) name these directly.
lc-script = { path = "../lc-script" }
lc-resources = { path = "../lc-resources" }
# Bench-only: skip criterion's default plotters/rayon subtrees (HTML plot
# reports); plain reports keep the numbers.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
serde_json = "1"
tempfile = "3"
proptest = "1"
tracing-subscriber = { version = "0.3", features = ["registry"] }
once_cell = "1"

[[bench]]
name = "engine_tick"
harness = false
