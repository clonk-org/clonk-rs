[package]
name = "lc-network"
version = "0.1.0"
edition = "2021"

[dependencies]
lc-engine = { path = "../lc-engine" }
serde = { version = "1", features = ["derive"] }
thiserror = "1"
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["gzip", "rustls-tls"] }
socket2 = { version = "0.6", features = ["all"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
