[package]
name = "lc-script"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
default = []
ffi = []

[dependencies]
thiserror = "1"
serde = { version = "1.0", features = ["derive"] }
# Grows the native stack on demand so deep (but C++-legal, <=512) script
# recursion doesn't overflow the thread stack in this tree-walking interpreter.
stacker = "0.1"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "script_execution"
harness = false
