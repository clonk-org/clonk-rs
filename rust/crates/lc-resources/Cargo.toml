[package]
name = "lc-resources"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
walkdir = "2"
thiserror = "1"
byteorder = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.24", default-features = false, features = ["jpeg", "png"] }

[dev-dependencies]
tempfile = "3"
