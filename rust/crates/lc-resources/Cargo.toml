[package]
name = "lc-resources"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
default = []
ffi = []

[dependencies]
walkdir = "2"
thiserror = "1"
byteorder = "1"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.24", default-features = false, features = ["bmp", "jpeg", "png"] }
tracing = "0.1"
encoding_rs = "0.8"

[dev-dependencies]
tempfile = "3"
