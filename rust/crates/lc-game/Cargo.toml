[package]
name = "lc-game"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
lc-launcher = { path = "../lc-launcher" }
lc-logging = { path = "../lc-logging" }
lc-platform = { path = "../lc-platform" }
lc-core = { path = "../lc-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
