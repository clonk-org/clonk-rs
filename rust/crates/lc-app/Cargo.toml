[package]
name = "lc-app"
version = "0.1.0"
edition = "2021"
autotests = false

[dependencies]
anyhow = "1.0"
arboard = { version = "3.3", default-features = false }
gilrs = "0.10"
lc-audio = { path = "../lc-audio" }
lc-core = { path = "../lc-core" }
lc-engine = { path = "../lc-engine" }
lc-frontend = { path = "../lc-frontend" }
lc-gui = { path = "../lc-gui" }
lc-graphics = { path = "../lc-graphics" }
lc-logging = { path = "../lc-logging" }
lc-scaling = { path = "../lc-scaling" }
lc-network = { path = "../lc-network" }
lc-platform = { path = "../lc-platform" }
lc-resources = { path = "../lc-resources" }
lc-script = { path = "../lc-script" }
pixels = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.32", features = ["rt-multi-thread", "sync", "time", "net"] }
winit = "0.28"
tracing = "0.1"
parking_lot = "0.12"
png = "0.17"
image = { version = "0.24", default-features = false, features = ["bmp", "jpeg", "png"] }
time = { version = "0.3", features = ["formatting", "macros"] }
freetype-rs = "0.38.0"
ttf-parser = "0.25.1"
thiserror = "1"
gethostname = "1.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSUserDefaults"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "4.4", default-features = false, features = ["async-io"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.54", features = ["Data_Xml_Dom", "Foundation", "UI_Notifications", "Win32_Foundation", "Win32_System_Registry", "Win32_System_WinRT", "Win32_UI_Shell"] }

[dev-dependencies]
flate2 = "1"
tempfile = "3.8"
# Keep lc-engine's property-test dependencies in the app test graph so adding
# lc-engine or the full workspace does not rebuild shared transitive crates.
lc-engine = { path = "../lc-engine", features = ["test-graph"] }
# Every comparison target includes lc-app. Request lc-network's test-only
# Tokio feature here as well so app-only and workspace test graphs share one
# Tokio fingerprint without enabling test utilities in production builds.
tokio = { version = "1.32", features = ["test-util"] }
