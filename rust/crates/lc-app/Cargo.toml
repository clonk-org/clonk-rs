[package]
name = "lc-app"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
gilrs = "0.10"
lc-audio = { path = "../lc-audio" }
lc-core = { path = "../lc-core" }
lc-engine = { path = "../lc-engine" }
lc-frontend = { path = "../lc-frontend" }
lc-gui = { path = "../lc-gui" }
lc-graphics = { path = "../lc-graphics" }
lc-network = { path = "../lc-network" }
lc-platform = { path = "../lc-platform" }
lc-resources = { path = "../lc-resources" }
pixels = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.32", features = ["rt-multi-thread", "sync", "time", "net"] }
winit = "0.28"
tracing = "0.1"
parking_lot = "0.12"
png = "0.17"
time = { version = "0.3", features = ["formatting", "macros"] }

[dev-dependencies]
tempfile = "3.8"
