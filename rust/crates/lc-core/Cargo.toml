[package]
name = "lc-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
once_cell = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"
rand = { version = "0.8", default-features = false, features = ["std", "small_rng"] }
indexmap = "2"

[dev-dependencies]
tempfile = "3"
