[package]
name = "lc-launcher"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
lc-core = { path = "../lc-core" }
lc-platform = { path = "../lc-platform" }
lc-resources = { path = "../lc-resources" }
open = "5.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.10"
