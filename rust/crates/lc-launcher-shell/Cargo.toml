[package]
name = "lc-launcher-shell"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
# Text-only clipboard use; default "image-data" feature would pull a second
# image crate (0.25) plus moxcms/pxfm/tiff into every workspace build.
arboard = { version = "3.3", default-features = false }
lc-launcher = { path = "../lc-launcher" }
lc-launcher-ui = { path = "../lc-launcher-ui" }
lc-gui = { path = "../lc-gui" }
lc-graphics = { path = "../lc-graphics" }
lc-platform = { path = "../lc-platform" }
lc-logging = { path = "../lc-logging" }
pixels = "0.13"
rfd = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
winit = "0.28"
tracing = "0.1"

[dev-dependencies]
tempfile = "3.10"
