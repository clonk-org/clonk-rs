[package]
name = "lc-engine-unit-tests"
version = "0.1.0"
edition = "2021"
publish = false
autotests = false

[features]
# Mirror lc-engine's cfg namespace because engine_inline compiles that crate
# root directly. The complete workspace gate uses the same default feature set
# as lc-engine's former built-in unit harness.
default = []
bench = []
ffi = []
test-graph = []

[[test]]
name = "unit"
path = "tests/unit/main.rs"

[[test]]
name = "engine_inline"
path = "../lc-engine/src/lib.rs"

[[test]]
name = "engine_it"
path = "../lc-engine/tests/it/main.rs"

[dev-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
image = { version = "0.24", default-features = false, features = ["bmp", "jpeg", "png"] }
indexmap = { version = "2", features = ["serde"] }
lc-core = { path = "../lc-core" }
lc-engine = { path = "../lc-engine" }
lc-engine-core = { path = "../lc-engine-core" }
lc-resources = { path = "../lc-resources" }
lc-script = { path = "../lc-script" }
once_cell = "1"
proptest = { version = "1", default-features = false, features = ["std"] }
rand = { version = "0.8", default-features = false, features = ["std"] }
rand_core = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
