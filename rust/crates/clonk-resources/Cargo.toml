[package]
name = "clonk-resources"
version = "0.1.0"
edition = "2021"

[features]
default = []

[dependencies]
walkdir = "2"
thiserror = "1"
byteorder = "1"
flate2 = "1"
libz-sys = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.24", default-features = false, features = ["bmp", "jpeg", "png"] }
tracing = "0.1"
encoding_rs = "0.8"
libc = "0.2"
clonk-script = { path = "../clonk-script" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Globalization"] }

[dev-dependencies]
tempfile = "3"
