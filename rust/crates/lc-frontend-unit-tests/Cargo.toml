[package]
name = "lc-frontend-unit-tests"
version = "0.1.0"
edition = "2021"
publish = false
autotests = false

[features]
# Mirror lc-frontend's cfg namespace because frontend_inline compiles that
# crate root directly. The complete workspace gate uses the same default
# feature set as lc-frontend's former built-in unit harness.
default = []
dev-feedback-render = []

[[test]]
name = "frontend_inline"
path = "../lc-frontend/src/lib.rs"

[dev-dependencies]
anyhow = "1.0.102"
freetype-rs = "0.38.0"
image = { version = "0.24", default-features = false, features = ["bmp", "jpeg", "png"] }
lc-engine = { path = "../lc-engine" }
lc-graphics = { path = "../lc-graphics" }
lc-gui = { path = "../lc-gui" }
lc-resources = { path = "../lc-resources" }
lc-scaling = { path = "../lc-scaling" }
lc-script = { path = "../lc-script" }
rayon = "1.11.0"
serde_json = "1.0"
tempfile = "3"
