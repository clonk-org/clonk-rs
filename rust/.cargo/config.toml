[alias]
xtask = "run --package xtask --bin xtask --"
dev-check = "run --package xtask --bin xtask -- dev-check"

# Rust 1.97's bundled Mach-O LLD emits invalid unwind metadata for some large
# test binaries on this workspace. Apple Clang's system linker preserves panic
# unwinding and is also faster for the measured cold workspace test build.
[target.aarch64-apple-darwin]
linker = "/usr/bin/clang"
