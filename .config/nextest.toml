nextest-version = "0.9.91"

# Opt-in workspace profiling. Keep this separate from the default gate so
# ordinary runs stay concise while performance work can retain every test's
# duration in a machine-readable JUnit report.
[profile.profiling]
fail-fast = false
status-level = "fail"
final-status-level = "fail"

[profile.profiling.junit]
path = "junit.xml"
store-success-output = false

# Keep a compact report for every CI shard, including a failed one. Failure
# output is retained in the report while successful test output stays in the
# normal nextest stream, so uploading diagnostics does not turn each shard into
# an unbounded log archive.
[profile.default.junit]
path = "junit.xml"
report-name = "nextest-run"
store-success-output = false
store-failure-output = true

[[profile.default.overrides]]
filter = '(package(clonk-app) and test(/(app_virtual_keyboard_(completes_real_tutorial(0[13])_route|delivers_tutorial08_surface_wipfs_to_hut)|harpoonrace_invalid_live_seed_is_ended_before_the_host_can_launch)$/)) or (package(clonk-app-netplay) and test(/(regicide_assigns_the_initial_host_player_before_publishing_join_data|tutorial01_builds_the_exact_supported_initial_host_bootstrap)$/)) or (package(clonk-engine-integration-tests) and test(/(tutorial0(4|6|7|9)_virtual_player_completes|tutorial10_virtual_player_completes_)/))'
# These allocation- and memory-bandwidth-heavy tests slow down by several times
# under mixed-suite contention despite each process using one CPU. Reserve
# enough capacity for their observed working sets without serializing the suite.
threads-required = 12

# Known-flaky clonk-app path-case probe with an env-lock/process race predating
# INFRA-001; its schedule window does not overlap the fixed perpetrator, so
# the retry stays until it is separately root-caused.
[[profile.default.overrides]]
filter = 'package(clonk-app) and test(install_definition_resolver_handles_case_insensitive_paths)'
retries = 2

# The 2026-07-21 package-wide retries=2 that absorbed random fixture-shaped
# clonk-app failures was removed after INFRA-001 root-caused them: a filename-
# less player profile resolved to the install root itself, and each slot save
# renamed the whole worktree aside for ~1.4ms, blinding every concurrent
# fixture read (fix + regression test in synchronized_player_profile_path).

# Host preparation uses a real background runtime and can exhaust its bounded
# poll window when several worker gates saturate the machine simultaneously.
[[profile.default.overrides]]
filter = 'package(clonk-app) and test(/(prepared_host_transport_swap_retains_automatic_preload_state|selected_network_scenario_installs_prepared_host_before_admission)/)'
retries = 2
slow-timeout = { period = "60s", terminate-after = 1 }

# This is a wall-clock product contract over a real host/client join. Reserve
# the same capacity as the workspace's memory-heavy tests so unrelated process
# contention cannot spend the 500ms budget on the join's behalf.
[[profile.default.overrides]]
filter = 'package(clonk-app) and test(initial_network_game_join_fully_loads_the_client_lobby_within_500ms)'
threads-required = 12

# This is the selector-to-lobby wall-clock contract over real ClonkMars
# resources. Run it alone inside nextest so unrelated scenario decompression
# cannot spend the one-second product budget on the selection's behalf.
[[profile.default.overrides]]
filter = 'package(clonk-app) and test(selected_clonkmars_host_reference_is_queryable_within_one_second)'
threads-required = 24

[[profile.default.overrides]]
filter = 'package(clonk-network) and test(control_sync_and_reconnect_smoke)'
retries = 2

# A wgpu test that cannot get an adapter is supposed to skip; one that *hangs*
# inside adapter or device creation never reaches that check, and takes the
# whole shard with it. That happened twice in consecutive merge-queue entries
# (clonk-org/clonk-rs#721): `Linux / remaining workspace 1/2` ran 15 minutes
# against ~5 for its seventeen siblings, was cancelled with three live
# `clonk_app_render` processes, and the `Landing gate` then evicted the entry
# for a cancelled result — forcing everything queued behind it to rebuild.
#
# The whole package finishes in about two seconds locally, so this cap is two
# orders of magnitude of headroom. It cannot make a healthy run fail; what it
# does is turn a stuck adapter call into one failed test with a name on it,
# instead of an eviction that reads as infrastructure noise.
[[profile.default.overrides]]
filter = 'package(clonk-app-render)'
slow-timeout = { period = "120s", terminate-after = 1 }

# Nextest otherwise launches tests lexicographically. Start the longest
# scenario cases first so they overlap the thousands of short tests
# instead of becoming a serial tail at the end of the workspace gate.
[[profile.default.overrides]]
filter = '(package(clonk-app) and test(/app_virtual_keyboard_(completes_real_tutorial(0[1-3]|05)_route|delivers_tutorial08_surface_wipfs_to_hut)/)) or (package(clonk-engine-integration-tests) and test(/(dragon_rock_princess_scream_is_|queron_assassin_death_relaunches_a_visible_paladin|shipped_scenarios_do_not_animate_the_sky_lighting_factor|tutorial(0[1-9]|10)_virtual_player_completes_)/))'
priority = 100

[[profile.default.overrides]]
filter = '(package(clonk-app) and test(/(classic_host_zero_countdown_|complete_resource_join_|fair_crew_set_|locally_authored_join_|offline_player_info_control_|secondary_local_player_|simultaneous_local_team_selection_|synchronized_team_selection_|unknown_loadable_resource_join_|selected_network_scenario_installs_prepared_host_|staged_host_installs_activated_participant_|(ready_tick_local_join|synchronized_remote_join)|real_alchemy_mouse_subcases_batch_[12]|real_tutorial01_(message_render|saved_game_music)_subcases_batch|real_tutorial09_hud_names_subcases_batch)/)) or (package(clonk-app-netplay) and test(/(regicide_assigns_the_initial_host_player_|tutorial01_builds_the_exact_supported_initial_host_bootstrap)/)) or (package(clonk-engine-integration-tests) and test(/(tutorial08_empty_messages_clear_|alchemy_real_scenario_subcases_batch_1|drachenfels_real_scenario_subcases_batch_1|sky_race_finish_eliminates_|goldrush_shared_scenario_subcases_batch_[12]|committed_real_scenario_replays_|tutorial05_(jump_and_run_held_down_|shared_scenario_subcases_batch_[12])|replayed_section_load_realigns_)/))'
priority = 80

# The remaining real-scenario and real-resource cases are individually slower
# than the thousands of unit tests. Start them before ordinary priority-zero
# work so their final few multi-second cases do not become the workspace's
# serial tail; the especially long cases above retain their higher priority.
[[profile.default.overrides]]
filter = '(package(clonk-engine-integration-tests) and test(/(real_scenario_harness::|real_clonk_hangle::tutorial01_real_clonk_subcases_batch|goldrush_scenario_batches::goldrush_shared_scenario_subcases_batch_3|far_worlds_deep_shared_scenario_subcases|jungle_amulet_real_scenario_subcases|arctic_occupied_kayak_rows_with_jump_and_run_direction_updates|elevator_motion_oracle::tutorial07_seed_zero_landscape_matches_cpp_surface8|elevator_motion_oracle::tutorial07_elevator_matches_cpp_fixed_motion_and_shaft_contact|real_tutorial07_virtual_play::tutorial07_workshop_basement_keeps_cpp_pre_growth_creation_position|weather_audio::tutorial07_real_acid_rain_starts_on_each_cpp_phase_call|weather_audio::tutorial07_tick10_starts_cpp_wind_loop_at_level_40)/)) or (package(clonk-frontend-unit-tests) and test(/tests::(real_fish_overlay_uses_its_live_object_color_without_an_owner|real_tutorial_seven_acid_(landscape_matches_cpp_material_color|rain_matches_cpp_animated_pxs_sequence)|real_tutorial_elevator_facets_construction_and_live_frame_delta_match_cpp)/))'
priority = 60

# These small families repeatedly formed the final cached-suite tail after all
# scenario work had drained. Start them ahead of ordinary priority-zero tests
# without competing with the scenario tiers above; priority changes ordering,
# not nextest's process isolation or concurrency.
[[profile.default.overrides]]
filter = '(package(clonk-network) and test(/^initial_network_dynamic::/)) or (package(xtask) and test(/^dev_check::tests::(base_collection_includes_committed_and_worktree_changes|git_collection_unions_staged_unstaged_untracked_and_rename_ends)$/))'
priority = 20
